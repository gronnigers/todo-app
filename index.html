<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dwellness">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A16" media="(prefers-color-scheme: dark)">
<title>Dwellness</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4EF;--side:#E3E9DF;--card:#FBFCFA;--ink:#243129;--mute:#5F6D63;--line:#E1E7DD;
  --acc:#4F6B5A;--acc-ink:#FFFFFF;--acc-soft:#DDE7DF;--warn:#A9531F;--warn-soft:#F6E6DA;--bad:#B3261E;--bad-soft:#F7DEDB;
  --ok:#2F6B45;--ok-soft:#DDEEE2;--tint:#EEF2EB;--track:#E4EAE0;--shadow:0 8px 24px rgba(36,49,41,.10);
  --r:20px;--r-sm:12px;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
  font-family:'Outfit',system-ui,sans-serif;color-scheme:light;
}
:root[data-theme="sage-dark"]{--bg:#141A16;--side:#1B231E;--card:#1E2722;--ink:#E4EBE5;--mute:#9AA99F;--line:#2B362F;--acc:#8DB59C;--acc-ink:#10251A;--acc-soft:#26382D;--warn:#F0A774;--warn-soft:#3A2A1E;--bad:#F2B8B5;--bad-soft:#3E2220;--ok:#8DD1A3;--ok-soft:#1E3326;--tint:#222D26;--track:#2B362F;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark;}
:root[data-theme="tidewater"]{--bg:#EEF4F6;--side:#DCE8EE;--card:#FFFFFF;--ink:#0B2A3A;--mute:#56707E;--line:#DCE7EC;--acc:#138A8F;--acc-ink:#FFFFFF;--acc-soft:#D6EEEF;--warn:#B4541A;--warn-soft:#FBE9DC;--bad:#B3261E;--bad-soft:#F8DEDB;--ok:#1F7A4D;--ok-soft:#DCF0E4;--tint:#EAF3F5;--track:#DCE8EE;--shadow:0 8px 24px rgba(20,30,40,.10);color-scheme:light;}
:root[data-theme="ivory"]{--bg:#F7F3EA;--side:#EFE8D8;--card:#FFFDF8;--ink:#2A241B;--mute:#766B5A;--line:#E6DDCB;--acc:#8A6A3B;--acc-ink:#FFFFFF;--acc-soft:#F0E6D3;--warn:#A4442A;--warn-soft:#F5E1D6;--bad:#9E2B25;--bad-soft:#F5DCD9;--ok:#4E6B3A;--ok-soft:#E7EEDC;--tint:#F4EEE1;--track:#EDE5D4;--shadow:0 8px 24px rgba(20,30,40,.10);color-scheme:light;}
:root[data-theme="hillcountry"]{--bg:#F4EBDD;--side:#EADBC6;--card:#FFFAF2;--ink:#2E211A;--mute:#7A6655;--line:#E7D7C2;--acc:#B5532A;--acc-ink:#FFFFFF;--acc-soft:#F6E0D3;--warn:#9A5210;--warn-soft:#F8E6CF;--bad:#A3261E;--bad-soft:#F6DAD6;--ok:#4F6E45;--ok-soft:#E3ECD9;--tint:#F6ECDD;--track:#EADCC8;--shadow:0 8px 24px rgba(20,30,40,.10);color-scheme:light;}
:root[data-theme="glass"]{--bg:#E9EEF7;--side:#DCE4F2;--card:#FFFFFF;--ink:#1C2433;--mute:#5B6679;--line:#DFE6F2;--acc:#2F6FEB;--acc-ink:#FFFFFF;--acc-soft:#DCE7FD;--warn:#B8520F;--warn-soft:#FDE9D7;--bad:#B42318;--bad-soft:#FBE0DD;--ok:#1D7A46;--ok-soft:#DCF1E4;--tint:#EEF3FC;--track:#E1E8F5;--shadow:0 8px 24px rgba(20,30,40,.10);color-scheme:light;}
:root[data-theme="swiss"]{--bg:#FFFFFF;--side:#F4F4F4;--card:#FFFFFF;--ink:#111111;--mute:#5E5E5E;--line:#E2E2E2;--acc:#D7001F;--acc-ink:#FFFFFF;--acc-soft:#FBE0E3;--warn:#B45309;--warn-soft:#FDECD8;--bad:#B00020;--bad-soft:#FBDDE1;--ok:#1B7A3E;--ok-soft:#DDF1E3;--tint:#F2F2F2;--track:#E6E6E6;--shadow:0 8px 24px rgba(20,30,40,.10);color-scheme:light;}
:root[data-theme="midnight"]{--bg:#0B0F14;--side:#080B0F;--card:#121922;--ink:#E8EEF3;--mute:#8C99A6;--line:#1F2A36;--acc:#5CF2A6;--acc-ink:#06241A;--acc-soft:#16352A;--warn:#FFB547;--warn-soft:#3A2C12;--bad:#FF8A80;--bad-soft:#3D1C1A;--ok:#5CF2A6;--ok-soft:#14301F;--tint:#17212C;--track:#1F2A36;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark;}
:root[data-theme="brass"]{--bg:#1B1B1D;--side:#141415;--card:#242427;--ink:#EEE8DC;--mute:#A39C8C;--line:#35332F;--acc:#C9A45C;--acc-ink:#1B1508;--acc-soft:#3A3220;--warn:#E8A06A;--warn-soft:#3D2B1D;--bad:#F2A098;--bad-soft:#3E2321;--ok:#A9C98A;--ok-soft:#27321F;--tint:#2B2A2D;--track:#35332F;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark;}
:root[data-theme="blueprint"]{--bg:#0F2A4A;--side:#0A1F38;--card:#13345C;--ink:#EAF2FF;--mute:#9DB5D3;--line:#28507F;--acc:#F5C542;--acc-ink:#1B1400;--acc-soft:#1E4677;--warn:#FF9E6B;--warn-soft:#4A3530;--bad:#FF8A80;--bad-soft:#4A2B35;--ok:#7FE0A8;--ok-soft:#1E4A48;--tint:#173E6B;--track:#1D4575;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark;}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#141A16;--side:#1B231E;--card:#1E2722;--ink:#E4EBE5;--mute:#9AA99F;--line:#2B362F;--acc:#8DB59C;--acc-ink:#10251A;--acc-soft:#26382D;--warn:#F0A774;--warn-soft:#3A2A1E;--bad:#F2B8B5;--bad-soft:#3E2220;--ok:#8DD1A3;--ok-soft:#1E3326;--tint:#222D26;--track:#2B362F;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--side);padding:calc(var(--safe-t) + 22px) 14px 18px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px;margin-bottom:22px}
.mark{width:40px;height:40px;border-radius:13px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex-shrink:0}
.mark svg{width:24px;height:24px}
.brand b{display:block;font-weight:600;font-size:19px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:99px;color:var(--ink);opacity:.82;font-size:15px;cursor:pointer}
@media(hover:hover){.nav:hover{opacity:1;background:color-mix(in srgb,var(--card) 60%,transparent)}}
.nav[aria-current="page"]{opacity:1;background:var(--card);font-weight:600;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:1px 8px}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:99px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.foot .who{font-size:13px;line-height:1.2;min-width:0}.foot .who span{display:block;color:var(--mute);font-size:12px}
.iconbtn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:99px;display:grid;place-items:center;color:var(--mute)}
@media(hover:hover){.iconbtn:hover{background:var(--tint);color:var(--ink)}}
main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{max-width:1280px;margin:0 auto;padding:calc(var(--safe-t) + 28px) 32px 48px}
.mhead{display:none}
.tabs{display:none}

/* ---------- common ---------- */
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:500}
h1{margin:4px 0 0;font-weight:300;font-size:36px;letter-spacing:-.02em;line-height:1.1}
h2{margin:0;font-weight:500;font-size:17px}
h3{margin:0;font-weight:600;font-size:15px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.ask{flex:1;max-width:460px;min-width:260px;display:flex;align-items:center;gap:6px;height:48px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 5px 0 18px}
.ask input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0;height:100%}
.ask button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:99px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.link{cursor:pointer;transition:transform .15s,box-shadow .15s}
@media(hover:hover){.card.link:hover{box-shadow:var(--shadow)}}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{font-size:13px;color:var(--mute)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;height:38px;padding:0 16px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn.ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.btn.quiet{background:var(--tint);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--mute);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.acc{background:var(--acc-soft);color:var(--acc)}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}@media(hover:hover){.li.tap:hover .li-t{color:var(--acc)}}
.li-b{flex:1;min-width:0}
.li-t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:12.5px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{all:unset;cursor:pointer;width:26px;height:26px;border-radius:99px;box-shadow:inset 0 0 0 1.8px var(--mute);display:grid;place-items:center;flex-shrink:0}
@media(hover:hover){.check:hover{box-shadow:inset 0 0 0 1.8px var(--acc);background:var(--acc-soft)}}
.check.on{background:var(--acc);box-shadow:none;color:var(--acc-ink)}
.empty{padding:26px 10px;text-align:center;color:var(--mute);font-size:14px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--tint);border-radius:99px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:99px;font-size:13.5px;color:var(--mute);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{height:40px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 16px;min-width:200px;flex:1;max-width:340px;outline:none}
.spacer{flex:1}

/* ---------- vitals ---------- */
.dash{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"vit vit water" "time plan water" "time equip punch"}
.a-vit{grid-area:vit}.a-water{grid-area:water}.a-plan{grid-area:plan}.a-time{grid-area:time}.a-equip{grid-area:equip}.a-punch{grid-area:punch}
.vit{flex-direction:row;flex-wrap:wrap;gap:18px 36px;align-items:center}
.score{font-weight:300;font-size:84px;color:var(--acc);line-height:.95;letter-spacing:-.03em}
.score.mid{color:var(--warn)}.score.low{color:var(--bad)}
.bars{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
.bar-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar{height:5px;border-radius:9px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc);transition:width .6s}
.bar i.mid{background:var(--warn)}.bar i.low{background:var(--bad)}
.chem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chem div{background:var(--tint);border-radius:14px;padding:10px 11px}
.chem b{display:block;font-weight:500;font-size:22px;line-height:1.1}
.chem span{font-size:11.5px;color:var(--mute)}
.chem div.out{background:var(--warn-soft)}.chem div.out b{color:var(--warn)}

/* ---------- floorplan ---------- */
.fp{position:relative;width:100%;max-width:100%}
.rcell{position:absolute;padding:3px;box-sizing:border-box}.fp.big .rcell{padding:4px}
.rcell .room{width:100%;height:100%;container-type:size}
.fpnote{margin-top:8px}
.room{all:unset;box-sizing:border-box;cursor:pointer;background:var(--tint);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;border:1.5px solid transparent}
.room b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (max-width:110px){.fp .rcell .room b{font-size:14px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:normal;word-break:normal;line-height:1.2}}
@container (max-width:84px){.fp .rcell .room b{font-size:12.5px}.rcell .room{padding:8px 7px}}
@container (max-width:68px){.fp .rcell .room b{font-size:11.5px}}
@container (max-height:52px){.room span{display:none}}
@container (max-width:64px){.room span{display:none}}
.rcell .room{padding:9px 10px}
.room span{font-size:11.5px;color:var(--mute)}
.room.hot span{color:var(--warn);font-weight:500}.room.hot span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}
.room.sel{border:2px solid var(--acc);background:var(--acc-soft)}
.room{transition:background .15s}@media(hover:hover){.room:not(.sel):hover{background:color-mix(in srgb,var(--tint),var(--ink) 7%)}}
@container (min-width:111px){.fp.big .room b{font-size:16px}}

/* ---------- timeline ---------- */
.tl{position:relative;margin-left:10px;padding-left:26px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tl .month{margin:14px 0 2px -26px;padding-left:26px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.tl .month:first-child{margin-top:0}
.tl .ev{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.tl .ev::before{content:"";position:absolute;left:-34px;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:99px;background:var(--acc);box-shadow:0 0 0 4px var(--bg)}
.tl .ev.due::before{background:var(--warn)}.tl .ev.over::before{background:var(--bad)}
.tl .ev.over{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));animation:overGlow 2.2s ease-in-out infinite}
.tl .ev.over::before{animation:overDot 2.2s ease-in-out infinite}
.chip.bad.glow{animation:overChip 2.2s ease-in-out infinite}
@keyframes overGlow{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--bad) 25%,transparent),0 0 6px color-mix(in srgb,var(--bad) 18%,transparent)}50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--bad) 55%,transparent),0 0 18px color-mix(in srgb,var(--bad) 40%,transparent)}}
@keyframes overDot{0%,100%{box-shadow:0 0 0 4px var(--bg),0 0 0 4px color-mix(in srgb,var(--bad) 0%,transparent)}50%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px color-mix(in srgb,var(--bad) 30%,transparent)}}
@keyframes overChip{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 10px color-mix(in srgb,var(--bad) 45%,transparent)}}
@media (prefers-reduced-motion:reduce){.tl .ev.over,.tl .ev.over::before,.chip.bad.glow{animation:none}.tl .ev.over{box-shadow:0 0 0 1px color-mix(in srgb,var(--bad) 45%,transparent),0 0 14px color-mix(in srgb,var(--bad) 30%,transparent)}}

/* ---------- pool ---------- */
.spark{width:100%;height:64px;display:block}
.range{font-size:11.5px;color:var(--mute)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;max-width:760px;min-height:40vh}
.msg{max-width:84%;padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.5;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.sugg button{all:unset;cursor:pointer;font-size:13.5px;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
@media(hover:hover){.sugg button:hover{border-color:var(--acc);color:var(--acc)}}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,26,22,.38);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .15s}
.sheet{background:var(--card);border-radius:24px;width:100%;max-width:560px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:rise .2s}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.sheet-b{padding:4px 20px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet-f{display:flex;gap:10px;padding:12px 20px calc(16px + var(--safe-b));border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mute);font-weight:500}
.fld input,.fld select,.fld textarea{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink);outline:none;width:100%}
.fld textarea{height:84px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(16px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;animation:rise .2s;box-shadow:var(--shadow)}

/* ---------- theme picker ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.sw{all:unset;box-sizing:border-box;cursor:pointer;border-radius:16px;border:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column;background:var(--card)}
.sw[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.sw .pv{height:62px;display:grid;grid-template-columns:28% 1fr;gap:0}
.sw .pv i{display:block}
.sw .pv .pc{padding:9px 8px;display:flex;flex-direction:column;gap:5px}
.sw .pv .pc b{display:block;height:9px;border-radius:5px}
.sw .pv .pc em{display:block;height:9px;width:46%;border-radius:5px}
.sw span{padding:7px 10px 9px;font-size:13px;font-weight:500;color:var(--ink)}
/* ---------- rooms ---------- */
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dims div{background:var(--tint);border-radius:14px;padding:10px 12px}

.dims span{font-size:11.5px;color:var(--mute)}
.mrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px;gap:8px;align-items:end}
.mrow .iconbtn{height:46px;width:40px}
/* ---------- photos ---------- */
.photos-wrap{display:flex;flex-direction:column;gap:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--tint);position:relative;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{flex-direction:column;gap:5px;border:1.5px dashed color-mix(in srgb,var(--mute) 45%,transparent);color:var(--mute);font-size:12px;font-weight:500;background:transparent}

.ph.add svg{width:24px;height:24px}
.spin{width:22px;height:22px;border-radius:99px;border:2.5px solid var(--line);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.thumb{width:44px;height:44px;border-radius:11px;object-fit:cover;flex-shrink:0;background:var(--tint)}
.hero{display:block;width:calc(100% + 36px);margin:-18px -18px 2px;height:160px;object-fit:cover;border-radius:19px 19px 0 0;background:var(--tint)}
.sheet .hero{width:100%;margin:0;height:220px;border-radius:16px}
.broken{visibility:hidden}
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,10,9,.94);display:flex;flex-direction:column;animation:fade .15s}
.lb-top{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 12px) 14px 10px;color:#E4EBE5;font-size:14px}
.lb-btn{all:unset;cursor:pointer;height:40px;min-width:40px;padding:0 14px;border-radius:99px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);font-weight:600;font-size:14px;box-sizing:border-box}
.lb-btn.del{color:#F2B8B5}
.lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px calc(var(--safe-b) + 16px);position:relative}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transform-origin:center center;will-change:transform;cursor:zoom-in}
.lb[data-zoomed="1"] .lb-img img{cursor:grab}
.lb[data-zoomed="1"] .lb-nav{opacity:0;pointer-events:none}
.lb-hint{position:absolute;bottom:calc(var(--safe-b) + 18px);left:50%;transform:translateX(-50%);color:#E4EBE5;opacity:.6;font-size:12.5px;pointer-events:none}
.lb-nav{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-size:30px;display:grid;place-items:center;line-height:1}
.lb-nav.p{left:16px}.lb-nav.n{right:16px}

/* ---------- update banner (floating card with a soft glowing outline) ---------- */
.upd{position:fixed;z-index:75;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 24px);width:min(420px,calc(100vw - 24px));display:flex;align-items:center;gap:12px;background:var(--card);color:var(--ink);border:1.5px solid var(--acc);padding:12px;border-radius:20px;
  box-shadow:0 0 16px 0 color-mix(in srgb,var(--acc) 38%,transparent),0 14px 36px rgba(20,30,25,.12);
  animation:updIn .45s cubic-bezier(.2,.9,.25,1.15),updGlow 2.8s ease-in-out .5s infinite}
@keyframes updIn{from{transform:translate(-50%,18px);opacity:0}}
@keyframes updGlow{0%,100%{box-shadow:0 0 12px 0 color-mix(in srgb,var(--acc) 30%,transparent),0 14px 36px rgba(20,30,25,.12)}
  50%{box-shadow:0 0 26px 3px color-mix(in srgb,var(--acc) 55%,transparent),0 14px 36px rgba(20,30,25,.12)}}
@media (prefers-reduced-motion:reduce){.upd{animation:updIn .2s ease-out}}
.upd.out{transition:transform .25s ease,opacity .25s ease;transform:translate(-50%,14px);opacity:0;animation:none}
.upd-ic{width:40px;height:40px;border-radius:13px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex-shrink:0}
.upd-ic svg{width:20px;height:20px}
.upd-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.25}
.upd-t b{font-weight:600;font-size:14.5px;letter-spacing:-.005em}
.upd-t span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd .later{all:unset;cursor:pointer;height:36px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:500;color:var(--mute)}
@media(hover:hover){.upd .later:hover{color:var(--ink);background:var(--tint)}}
.upd .btn{height:36px;padding:0 16px}
@media (orientation:portrait) and (max-width:1100px),(max-width:720px){.upd{bottom:calc(var(--safe-b) + 84px)}}

/* ---------- settings: roles + about ---------- */
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.roles div{background:var(--tint);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.roles b{font-size:13.5px;font-weight:600}.roles span{font-size:12px;color:var(--mute);line-height:1.35}
@media (max-width:560px){.roles{grid-template-columns:minmax(0,1fr)}.roles div{flex-direction:row;gap:8px;align-items:baseline}.roles b{min-width:74px}}
.about{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.about .mark{width:36px;height:36px;border-radius:11px}.about .mark svg{width:20px;height:20px}
.about b{display:block;font-weight:600;font-size:14.5px}.about span{font-size:12.5px;color:var(--mute)}

/* ---------- what's new ---------- */
.wn-hero{display:flex;align-items:center;gap:14px;padding:4px 0 6px}
.wn-hero .upd-ic{width:48px;height:48px;border-radius:15px}
.wn-hero .upd-ic svg{width:24px;height:24px}

.wn-hero span{font-size:13px;color:var(--mute)}
.wn-group{display:flex;flex-direction:column;gap:8px}
.wn-group h4{margin:6px 0 0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:8px}
.wn-dot{width:8px;height:8px;border-radius:99px;background:var(--acc)}
.wn-group.improved .wn-dot{background:var(--ok)}.wn-group.fixed .wn-dot{background:var(--warn)}
.wn-item{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45;padding:10px 12px;background:var(--tint);border-radius:14px}
.wn-item small{margin-left:auto;flex-shrink:0;font-size:11px;color:var(--mute);padding-top:3px;white-space:nowrap}

/* ---------- sign in ---------- */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.gate .box{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.gate .mark{width:76px;height:76px;border-radius:24px}.gate .mark svg{width:44px;height:44px}
.gate h1{font-size:40px}
.gate p{color:var(--mute);margin:0;line-height:1.5}
.ms{height:50px;padding:0 22px;font-size:15px}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .dash{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"vit vit" "water water" "time plan" "equip punch"}
}
/* Portrait phones + portrait iPads, and any narrow window: bottom tabs */
@media (orientation:portrait) and (max-width:1100px),(max-width:720px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;padding-top:var(--safe-t);background:var(--bg)}
  .side{display:none}
  main{grid-row:1}
  .page{padding:14px 18px 28px}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .mhead .brand{margin:0;padding:0;min-width:0}
  .tabs{display:flex;grid-row:2;position:relative;z-index:40;background:var(--side);border-top:1px solid var(--line);justify-content:space-around;align-items:center;padding:6px max(8px,env(safe-area-inset-right)) calc(var(--safe-b) + 6px) max(8px,env(safe-area-inset-left))}
  .tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px;padding:7px 4px;border-radius:18px;font-size:10.5px;font-weight:500;color:var(--mute)}
  .tab svg{width:23px;height:23px}
  .tab[aria-current="page"]{color:var(--acc);background:var(--card);font-weight:600}
  .top .ask{max-width:none}
}
@media (max-width:720px){
  h1{font-size:30px}
  .dash{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"vit vit" "water water" "time time" "punch punch" "equip equip" "plan plan"}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .vit{gap:14px 20px}.score{font-size:64px}.bars{grid-template-columns:minmax(0,1fr);min-width:0;gap:9px}
  .chem{grid-template-columns:repeat(2,minmax(0,1fr))}.chem div:nth-child(n+3){display:none}
  .a-pool .chem div:nth-child(n+3),.a-spa .chem div:nth-child(n+3){display:none}
  .pool-page .chem div{display:block!important}
  .pool-page .chem{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fp.big{grid-auto-rows:84px}
  .frow{grid-template-columns:minmax(0,1fr)}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:24px 24px 0 0;max-height:92dvh}
  .search{max-width:none}
}
/* Short landscape phones: slim left rail */
@media (orientation:landscape) and (max-height:520px){
  #app{grid-template-columns:calc(72px + env(safe-area-inset-left)) minmax(0,1fr)}
  .side{padding:calc(var(--safe-t) + 10px) 8px calc(var(--safe-b) + 10px) calc(env(safe-area-inset-left) + 8px);gap:0}
  .nav{min-height:44px}
  main{padding-right:env(safe-area-inset-right)}
  .brand{justify-content:center;margin-bottom:10px;padding:0}.brand div{display:none}
  .nav{justify-content:center;padding:10px}.nav span,.nav .count{display:none}
  .side .foot .who{display:none}.side .foot{justify-content:center;flex-direction:column;padding-top:8px}
  .page{padding:14px 20px calc(var(--safe-b) + 20px)}
  .score{font-size:60px}
}
/* water */

.wdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;margin-right:8px;vertical-align:1px}.wdot.pool{background:var(--pool)}.wdot.spa{background:var(--spa)}
.a-water{gap:0}.a-water>.hd{margin-bottom:6px}

.wpage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1100px){.wpage{grid-template-columns:minmax(0,1fr)}}

.wkey i{display:inline-block;margin-left:6px}.wkb{width:12px;height:9px;border-radius:2px;background:color-mix(in srgb,var(--ok) 14%,transparent)}.wkl{width:14px;border-top:1.5px dotted var(--mute)}.wko{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--bad)}

.wcell-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.wcell-h b{font-size:13px;font-weight:600}.wcell-h span{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.wcell-h span.bad{color:var(--bad)}

@media (max-width:600px){.wmult{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.wcell{padding:8px 9px 6px}.wcell-s{font-size:10.5px}}

/* search links */
.sxl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sxl button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:99px;padding:5px 12px;white-space:normal}
@media(hover:hover){.sxl button:hover{filter:brightness(.97)}}
/* vitals explainer */
.vbar{all:unset;box-sizing:border-box;cursor:pointer;display:block;border-radius:10px;margin:-6px -8px;padding:6px 8px}
.vscore{all:unset;cursor:pointer;display:block;border-radius:14px}
@media(hover:hover){.vbar:hover,.vscore:hover{background:var(--tint)}}
.vbar:focus-visible,.vscore:focus-visible{outline:2px solid var(--acc)}
.vhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.vhead .score{font-size:56px;line-height:1}
.vcap{font-size:12.5px;color:var(--mute)}
.vp{margin:0;font-size:14px;color:var(--mute);line-height:1.5}
.vhits .li,.vsys .li{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%}
.vpts{font-weight:600;font-variant-numeric:tabular-nums;color:var(--bad);white-space:nowrap}
.vnum{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}.vnum.mid{color:var(--warn)}.vnum.low{color:var(--bad)}
.vrules{display:flex;flex-direction:column;font-size:13.5px}
.vrules>div{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrules>div span:last-child{color:var(--mute);text-align:right}
.vgood{padding:14px 0;text-align:left}
/* ---------- home ideas ---------- */
.ixav{width:22px;height:22px;border-radius:99px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--card);flex-shrink:0;background:var(--acc)}
.ixav.w1,.ixdot.w1{--who:var(--warn)}.ixav.w2,.ixdot.w2{--who:var(--ok)}.ixav.w3,.ixdot.w3{--who:var(--bad)}
.ixav{background:var(--who,var(--acc))}
.ixby{position:absolute;top:8px;right:8px;box-shadow:0 0 0 2px var(--card)}
.ixph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mute);padding:8px;text-align:center;position:relative}.ixph svg{width:28%;max-width:40px;height:auto;aspect-ratio:1;opacity:.45}.ixph small{font-size:11px;font-weight:500;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.ixrt .ixph small,.ixc .ixph small{display:none}
.ixph.g0{background:linear-gradient(135deg,var(--acc-soft),var(--tint))}.ixph.g1{background:linear-gradient(135deg,var(--warn-soft),var(--tint))}.ixph.g2{background:linear-gradient(135deg,var(--ok-soft),var(--tint))}
.ixph.g3{background:linear-gradient(200deg,var(--acc-soft),var(--warn-soft))}.ixph.g4{background:linear-gradient(160deg,var(--tint),var(--ok-soft))}.ixph.g5{background:linear-gradient(120deg,var(--bad-soft),var(--tint))}
.ixquick{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 16px;min-width:0}
.ixquick input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;color:var(--ink);outline:none;height:38px}
.ixquick .iconbtn{color:var(--acc)}
.ixempty{display:flex;flex-direction:column;gap:6px;align-items:center;max-width:44ch;margin:24px auto}.ixempty b{color:var(--ink);font-weight:500;font-size:16px}
.ixchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-bottom:10px}.ixchips::-webkit-scrollbar{display:none}
.ixf{all:unset;cursor:pointer;white-space:nowrap;font-size:13px;padding:6px 12px;border-radius:99px;background:var(--tint);color:var(--mute);font-weight:500}
.ixf[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.ixback{all:unset;cursor:pointer;color:var(--acc);font-size:14px;font-weight:500;margin-bottom:6px;display:inline-block}
.ixsec{margin:20px 0 10px}.ixsec h2{font-size:17px;font-weight:600;margin:0}
.ixhero{margin-top:14px;background:var(--acc-soft);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:14px;align-items:center}
.ixhero>div:first-child{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.ixhero b{font-size:17px;font-weight:600}.ixhero span{font-size:13px;color:var(--mute)}.ixhero .btn{margin-top:8px}
.ixhero.done{grid-template-columns:minmax(0,1fr)}.ixhero.done .ixhero-pic{display:none}
.ixhero-pic{height:88px;border-radius:14px;overflow:hidden;transform:rotate(3deg);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.ixhero-pic img,.ixc img,.ixti img,.ixrt img,.ixcpic img,.ixdhero img,.ixfilm img{width:100%;height:100%;object-fit:cover;display:block}
.ixstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.ixstats button{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:11.5px;color:var(--mute);line-height:1.25}
.ixstats b{display:block;font-size:22px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:2px}
.ixstrip{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x mandatory}.ixstrip::-webkit-scrollbar{display:none}
.ixroom{all:unset;cursor:pointer;flex:0 0 150px;display:flex;flex-direction:column;gap:3px;scroll-snap-align:start}
.ixroom b{font-size:14px;font-weight:500;margin-top:4px}.ixroom span{font-size:12px;color:var(--mute)}
.ixcoll{height:110px;border-radius:14px;overflow:hidden;display:grid;gap:2px;background:var(--line)}
.ixcoll.n1{grid-template-columns:1fr}.ixcoll.n2{grid-template-columns:1fr 1fr}
.ixcoll.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.ixcoll.n3 .ixc:first-child{grid-row:span 2}
.ixc{overflow:hidden;min-height:0}
.ixnotes{display:flex;flex-direction:column;gap:8px}
.ixmsg{all:unset;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4;cursor:default}
button.ixmsg{cursor:pointer}
.ixbub{background:var(--tint);border-radius:4px 14px 14px 14px;padding:7px 11px;display:flex;flex-direction:column;gap:2px;min-width:0;word-break:break-word}
.ixbub b{font-weight:600}.ixbub small{font-size:11px;color:var(--mute)}
.ixswipe-btn{margin-bottom:12px}
.ixmas{columns:2 150px;column-gap:10px}.ixmas .ixtile{break-inside:avoid;margin-bottom:12px;width:100%}
.ixtile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.ixtile .chip{align-self:flex-start}
.ixti{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--tint);display:block}
.ixmas .ixtile:nth-child(3n+1) .ixti{aspect-ratio:4/5}.ixmas .ixtile:nth-child(4n+2) .ixti{aspect-ratio:5/4}
.ixtt{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ixtile.sel .ixti{outline:2.5px solid var(--acc);outline-offset:2px}
.ixlist{padding-top:4px;padding-bottom:4px;gap:0}
.ixrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.ixrow:last-child{border-bottom:0}.ixrow .li-b{display:flex;flex-direction:column}
.ixrow.sel .li-t{color:var(--acc);font-weight:600}
.ixrt{width:52px;height:52px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--tint)}
.ixdots{display:flex;gap:3px;flex-shrink:0}
.ixdot{width:20px;height:20px;border-radius:99px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--card);background:var(--who,var(--acc))}
.ixdot.v-none{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--line)}
.ixdot.v-maybe{background:transparent;color:var(--who,var(--acc));box-shadow:inset 0 0 0 1.5px var(--who,var(--acc))}
.ixdot.v-pass{background:var(--mute);text-decoration:line-through}
@media(max-width:420px){.ixrow .ixdots{display:none}}
/* studio */
.ixhead{display:flex;gap:8px;flex-wrap:wrap}
.ixstudio{display:grid;grid-template-columns:200px minmax(0,1fr) 320px;gap:16px;align-items:start}
.ixside{gap:2px;padding:12px;position:sticky;top:12px}
.ixside .eyebrow{margin:10px 8px 4px}.ixside .eyebrow:first-child{margin-top:2px}
.ixs{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:10px;font-size:13.5px}
.ixs span:last-child{color:var(--mute);font-variant-numeric:tabular-nums}
.ixs[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600}.ixs[aria-pressed="true"] span:last-child{color:var(--acc)}
@media(hover:hover){.ixs:not([aria-pressed="true"]):hover{background:var(--tint)}.ixtile:not(.sel):hover .ixti{filter:brightness(.96)}}
.ixmain{display:flex;flex-direction:column;gap:12px;min-width:0}
.ixdrop{border:1.5px dashed var(--line);border-radius:18px;padding:8px;display:flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.ixdrop .ixquick{flex:1}.ixdrop-t{font-size:13px;color:var(--mute);padding-right:8px;white-space:nowrap}
.ixdrop.over{border-color:var(--acc);background:var(--acc-soft)}
.ixbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.ixbar .mute{font-size:13px;color:var(--mute)}
.ixgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ixdetail{position:sticky;top:12px;max-height:calc(100dvh - 40px);overflow-y:auto;gap:12px}
.ixdhero{border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--tint)}
.ixdimg{all:unset;cursor:zoom-in;display:block;width:100%;height:100%}
.ixfilm{display:flex;gap:6px}.ixfilm button{all:unset;cursor:pointer;width:48px;height:48px;border-radius:10px;overflow:hidden;background:var(--tint)}
.ixdt{font-size:18px;font-weight:500;margin:0;min-width:0;overflow-wrap:anywhere}
.ixvote{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ixvote button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:9px 4px;border-radius:12px;font-size:13.5px;font-weight:600;background:var(--tint);color:var(--mute)}
.ixvote .v-love[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.ixvote .v-maybe[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.ixvote .v-pass[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.ixkv{display:flex;flex-direction:column;font-size:13.5px}
.ixkv>div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.ixkv>div span:first-child{color:var(--mute);flex-shrink:0}.ixkv>div>:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.ixkv a{color:var(--acc);font-weight:500;text-decoration:none}
.ixthread{display:flex;flex-direction:column;gap:8px}.ixnone{font-size:13px;color:var(--mute)}
.ixcompose{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 3px 3px 14px;background:var(--bg)}
.ixcompose input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;color:var(--ink);outline:none;height:38px}
.ixcompose .iconbtn{color:var(--acc)}
.ixdact{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:1180px){.ixstudio{grid-template-columns:180px minmax(0,1fr) 280px}}
@media (max-width:980px){.ixstudio{grid-template-columns:minmax(0,1fr) 270px}.ixside{grid-column:1/-1;position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:8px;gap:4px;scrollbar-width:none}.ixside .eyebrow{display:none}.ixs{flex-shrink:0;background:var(--tint)}.ixgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.ixdrop-t{display:none}}
/* swipe */
.ixsw{position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 18px);gap:14px;animation:fade .15s}
.ixswtop{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.ixdeck{position:relative;width:100%;max-width:400px;flex:1;min-height:0;max-height:620px}
.ixcard{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 18px 50px rgba(0,0,0,.16);touch-action:none;user-select:none;-webkit-user-select:none}
.ixcard.b1{transform:translateY(10px) scale(.96);opacity:.8}.ixcard.b2{transform:translateY(20px) scale(.92);opacity:.5}
.ixcard.ixtop{cursor:grab}.ixcard.ixtop:active{cursor:grabbing}
.ixcard::after{content:"";position:absolute;inset:0;border-radius:26px;pointer-events:none;box-shadow:inset 0 0 0 3px transparent;transition:box-shadow .1s}
.ixcard[data-lean="love"]::after{box-shadow:inset 0 0 0 3px var(--acc)}.ixcard[data-lean="pass"]::after{box-shadow:inset 0 0 0 3px var(--mute)}.ixcard[data-lean="maybe"]::after{box-shadow:inset 0 0 0 3px var(--warn)}
.ixcpic{flex:1;min-height:0;border-radius:18px;overflow:hidden;position:relative;background:var(--tint)}
.ixcpic img{pointer-events:none}
.ixcinfo{display:flex;flex-direction:column;gap:1px;padding:0 4px}.ixcinfo b{font-size:18px;font-weight:600}.ixcinfo span{font-size:13px;color:var(--mute)}
.ixcinfo a{color:var(--acc);text-decoration:none;font-weight:500}
.ixcnote{background:var(--tint);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.35}
.ixcnotes{all:unset;cursor:pointer;font-size:13px;color:var(--acc);font-weight:600;padding:2px 4px 4px}
.ixacts{display:flex;gap:18px;align-items:center}
.ixa{all:unset;cursor:pointer;width:62px;height:62px;border-radius:99px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--mute);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.ixa.love{width:74px;height:74px;background:var(--acc);color:var(--acc-ink);border:0}.ixa.maybe{color:var(--warn)}
.ixhint{font-size:12px;color:var(--mute)}
.ixswdone{margin:auto;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}.ixswdone b{font-size:22px;font-weight:500}.ixswdone span{color:var(--mute)}.ixswdone .btn{margin-top:10px}
@media (orientation:landscape) and (max-height:520px){.ixdeck{max-width:300px}.ixacts{gap:10px}.ixa{width:50px;height:50px}.ixa.love{width:58px;height:58px}.ixhint{display:none}.ixcnote{display:none}}
</style>

  return `<div class="photos-wrap" data-strip="${t}" data-label="${esc(label)}"><div class="eyebrow">${esc(label)}</div><div class="photos">${ps.map(p => `<button type="button" class="ph" data-act="viewPhoto" data-pid="${p.id}" data-target="${t}" aria-label="View photo"><img data-photo="${p.id}" alt=""></button>`).join("")}${Array.from({ length: n }, () => `<div class="ph"><span class="spin" aria-label="Uploading"></span></div>`).join("")}<button type="button" class="ph add" data-act="photoCam" data-target="${t}">${ic("i-camera")}<span>Take photo</span></button><button type="button" class="ph add" data-act="photoLib" data-target="${t}">${ic("i-image")}<span>Upload</span></button></div></div>`;
}
function refreshStrips() { document.querySelectorAll("[data-strip]").forEach(el => { el.outerHTML = photoStrip(el.dataset.strip, el.dataset.label); }); hydrate(); }
const thumbOf = x => x?.photos?.length ? `<img class="thumb" data-photo="${x.photos[0].id}" alt="">` : "";
function pickPhoto(t, cam) { photoTarget = t; const el = $(cam ? "#camIn" : "#libIn"); el.value = ""; el.click(); }
async function onPicked(files) {
  const t = photoTarget; if (!t || !files.length) return;
  for (const f of files) {
    uploading[t] = (uploading[t] || 0) + 1; refreshStrips();
    try {
      const ref = await addPhotoFile(f);
      if (t === "sheet") { if (!S.sheet) deletePhotoFiles(ref); else { S.sheet.photos.push(ref); S.sheet.added.push(ref); } }
      else { targetPhotos(t).push(ref); commit(); }
    } catch (e) { toast(e.message === "signed-out" ? "Sign in again to add photos" : e.message); }
    finally { uploading[t]--; refreshStrips(); }
  }
  if (t !== "sheet") toast(files.length > 1 ? `${files.length} photos added` : "Photo added");
}
["camIn", "libIn"].forEach(id => document.getElementById(id).addEventListener("change", e => onPicked([...e.target.files])));
function openPhoto(pid, t) {
  const ps = targetPhotos(t); let i = ps.findIndex(p => p.id === pid); if (i < 0) return;
  const lb = document.createElement("div"); lb.className = "lb"; lb.id = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-label", "Photo");
  const draw = () => { const p = ps[i]; lb.innerHTML = `<div class="lb-top"><span>${ps.length > 1 ? `${i + 1} / ${ps.length} · ` : ""}${p.added ? fmtD(p.added.slice(0, 10), { month: "short", day: "numeric", year: "numeric" }) : ""}</span><span class="spacer"></span><button class="lb-btn del" data-lb="del">Delete</button><button class="lb-btn" data-lb="close" aria-label="Close">${ic("i-x")}</button></div><div class="lb-img">${ps.length > 1 ? `<button class="lb-nav p" data-lb="prev" aria-label="Previous photo">‹</button>` : ""}<img data-photo="${p.id}" data-size="full" alt="Photo">${ps.length > 1 ? `<button class="lb-nav n" data-lb="next" aria-label="Next photo">›</button>` : ""}<span class="lb-hint">Pinch or double-tap to zoom</span></div>`; lb.dataset.zoomed = ""; hydrate(lb); attachZoom(lb.querySelector(".lb-img img"), lb); };
  draw(); document.body.appendChild(lb);
  lb.addEventListener("click", ev => {
    const b = ev.target.closest("[data-lb]");
    if (!b) { if (ev.target === lb || ev.target.classList.contains("lb-img")) lb.remove(); return; }
    const a = b.dataset.lb;
    if (a === "close") lb.remove();
    else if (a === "prev") { i = (i - 1 + ps.length) % ps.length; draw(); }
    else if (a === "next") { i = (i + 1) % ps.length; draw(); }
    else if (a === "del" && confirm("Delete this photo?")) {
      const [ref] = ps.splice(i, 1);
      if (t === "sheet") { if (S.sheet.added.includes(ref)) deletePhotoFiles(ref); else S.sheet.removed.push(ref); }
      else { deletePhotoFiles(ref); commit("Photo deleted"); }
      refreshStrips();
      if (!ps.length) lb.remove(); else { i = Math.min(i, ps.length - 1); draw(); }
    }
  });
  let x0 = null, multi = false;
  lb.addEventListener("touchstart", e => { if (e.touches.length > 1) { multi = true; x0 = null; return; } if (!multi && !lb.dataset.zoomed) x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", e => { if (e.touches.length === 0) { const was = multi; multi = false; if (was || lb.dataset.zoomed || x0 == null || ps.length < 2) { x0 = null; return; } } else return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) { i = (i + (dx < 0 ? 1 : -1) + ps.length) % ps.length; draw(); } x0 = null; });
}

/* ---------- Home Ideas ----------
   ideas:     { id, title, room, link, price, by, byName, created, photos }
   ideaVotes: { id: idea|user, idea, user, v: love|maybe|pass, at }   (one record per person per idea, so merges never clash)
   ideaNotes: { id, idea, user, name, text, at }
   Portrait phone/iPad → summary home + swipe + room boards + list.  Landscape / desktop → three-pane studio. */
const PORTRAIT = matchMedia("(orientation:portrait) and (max-width:1100px),(max-width:720px)");
PORTRAIT.addEventListener?.("change", () => { if (S.view === "ideas" && S.data) render(); });
S.ix = { mode: "home", room: "", status: "all", who: "all", layout: "grid", sel: null };
const meKey = () => myKey() || "demo-shane";
const IX_ST = { yours: ["Your turn", "acc"], waiting: ["Waiting", ""], maybe: ["Maybe", "warn"], agreed: ["Agreed", "ok"], passed: ["Passed", ""] };
function ixPeople() {
  const ks = new Set(Object.keys(S.data.members || {}));
  (S.data.ideas || []).forEach(i => i.by && ks.add(i.by)); (S.data.ideaVotes || []).forEach(v => ks.add(v.user)); ks.add(meKey());
  const me = meKey(); return [me, ...[...ks].filter(k => k !== me).sort()];
}
function ixName(k) {
  if (k === meKey()) return S.me?.first || "Me";
  const m = (S.data.members || {})[k]; if (m?.first || m?.name) return m.first || m.name.split(" ")[0];
  const i = (S.data.ideas || []).find(x => x.by === k); if (i?.byName) return i.byName;
  const n = (S.data.ideaNotes || []).find(x => x.user === k); return n?.name || "Someone";
}
const ixWho = k => Math.max(0, ixPeople().indexOf(k)) % 4;
const ixAv = (k, extra = "") => `<span class="ixav w${ixWho(k)} ${extra}" title="${esc(ixName(k))}">${esc((ixName(k)[0] || "?").toUpperCase())}</span>`;
const ixVotes = id => { const o = {}; (S.data.ideaVotes || []).forEach(v => { if (v.idea === id) o[v.user] = v.v; }); return o; };
function ixStatus(i) {
  const v = ixVotes(i.id), ppl = ixPeople(), vals = Object.values(v);
  if (vals.includes("pass")) return "passed";
  if (!v[meKey()]) return "yours";
  if (ppl.some(p => !v[p])) return "waiting";
  if (vals.includes("maybe")) return "maybe";
  return "agreed";
}
const ixNotes = id => (S.data.ideaNotes || []).filter(n => n.idea === id).sort((a, b) => a.at.localeCompare(b.at));
function ixSetVote(id, v) {
  const u = meKey(), vid = id + "|" + u; S.data.ideaVotes = S.data.ideaVotes || [];
  const x = S.data.ideaVotes.find(z => z.id === vid);
  if (x) { x.v = v; x.at = new Date().toISOString(); } else S.data.ideaVotes.push({ id: vid, idea: id, user: u, v, at: new Date().toISOString() });
}
function ixAddNote(id, text) {
  text = (text || "").trim(); if (!text) return false;
  S.data.ideaNotes = S.data.ideaNotes || [];
  S.data.ideaNotes.push({ id: uid(), idea: id, user: meKey(), name: S.me?.first || "", text, at: new Date().toISOString() });
  return true;
}
const ixDomain = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
function ixTitleFromLink(u) {
  try { const p = new URL(u).pathname.split("/").filter(Boolean).filter(s => !/^\d+$/.test(s) && !/^(p|dp|product|products|item|shop|s)$/i.test(s)); const s = decodeURIComponent(p.sort((a, b) => b.length - a.length)[0] || "").replace(/\.[a-z]+$/i, "").replace(/[-_+]+/g, " ").replace(/\b[a-z0-9]{8,}\b/gi, "").trim(); return s ? s[0].toUpperCase() + s.slice(1, 60) : ""; } catch (e) { return ""; }
}
const ixHash = s => [...(s || "x")].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % 6;
function ixPic(i, size = "thumb") {
  if (i.photos?.length) return `<img data-photo="${i.photos[0].id}" data-size="${size}" alt="">`;
  const d = ixDomain(i.link);
  return `<div class="ixph g${ixHash(i.id)}">${ic("i-image")}${d ? `<small>${esc(d)}</small>` : ""}</div>`;
}
const ixChip = s => `<span class="chip ${IX_ST[s][1]}">${IX_ST[s][0]}</span>`;
function ixVoteDots(i) { const v = ixVotes(i.id); return `<span class="ixdots">${ixPeople().map(p => `<span class="ixdot ${v[p] ? "v-" + v[p] : "v-none"} w${ixWho(p)}" title="${esc(ixName(p))}: ${v[p] || "no vote yet"}">${esc((ixName(p)[0] || "?").toUpperCase())}</span>`).join("")}</span>`; }
function ixFiltered() {
  const f = S.ix; return (S.data.ideas || []).filter(i => (!f.room || (f.room === "none" ? !i.room : i.room === f.room)) && (f.status === "all" || ixStatus(i) === f.status) && (f.who === "all" || i.by === f.who)).sort((a, b) => (b.created || "").localeCompare(a.created || ""));
}
function ixCounts(list = S.data.ideas || []) { const c = { yours: 0, waiting: 0, maybe: 0, agreed: 0, passed: 0 }; list.forEach(i => c[ixStatus(i)]++); return c; }
function ixRooms() {
  const ideas = S.data.ideas || [], out = S.data.rooms.map(r => ({ id: r.id, name: r.name, list: ideas.filter(i => i.room === r.id) })).filter(r => r.list.length);
  const none = ideas.filter(i => !i.room || !byId("rooms", i.room)); if (none.length) out.push({ id: "none", name: "Anywhere", list: none });
  return out;
}
function ixCollage(list) { const l = [...list].sort((a, b) => (b.photos?.length ? 1 : 0) - (a.photos?.length ? 1 : 0)).slice(0, 3); return `<div class="ixcoll n${l.length}">${l.map(i => `<div class="ixc">${ixPic(i)}</div>`).join("")}</div>`; }
function ixRow(i) {

}
function ixTile(i) {
  const st = ixStatus(i);
  return `<button class="ixtile ${S.ix.sel === i.id && !PORTRAIT.matches ? "sel" : ""}" data-act="ideaOpen" data-id="${i.id}"><span class="ixti">${ixPic(i)}${ixAv(i.by, "ixby")}</span><span class="ixtt">${esc(i.title || ixDomain(i.link) || "Untitled")}</span>${ixChip(st)}</button>`;

function ixQuickAdd() {
  return `<form class="ixquick" data-form="ideaLink"><label class="sr" for="ixLink">Paste a link</label><input id="ixLink" name="u" type="url" inputmode="url" placeholder="Paste a link" autocomplete="off"><button type="button" class="iconbtn" data-act="ideaAddCam" aria-label="Take a photo">${ic("i-camera")}</button><button type="button" class="iconbtn" data-act="ideaAddLib" aria-label="Choose photos">${ic("i-image")}</button></form>`;
}
const ixEmpty = () => `<div class="empty ixempty"><b>No ideas yet</b><span>Paste a link, snap a photo or pick one from your library. You and everyone in the house can vote on each idea.</span></div>`;

VIEWS.ideas = () => PORTRAIT.matches ? ixPortrait() : ixStudio();

function ixPortrait() {
  const f = S.ix, ideas = S.data.ideas || [];
  if (f.mode === "room") {
    const room = f.room === "none" ? { name: "Anywhere" } : byId("rooms", f.room) || { name: "Room" };
    const inRoom = ideas.filter(i => f.room === "none" ? !i.room || !byId("rooms", i.room) : i.room === f.room), c = ixCounts(inRoom);
    const dm = room.id ? roomDims(room) : {};

    return `<button class="ixback" data-act="ideaMode" data-mode="home">‹ Ideas</button>
      ${header(dm.area ? `${esc(room.length || "")} × ${esc(room.width || "")} · ${Math.round(dm.area)} sq ft` : `${inRoom.length} idea${inRoom.length === 1 ? "" : "s"}`, esc(room.name), `<button class="btn" data-act="ideaAdd" data-room="${f.room === "none" ? "" : f.room}">${ic("i-plus")}Add</button>`)}
      <div class="ixchips">${[["all", `All ${inRoom.length}`], ["agreed", `Agreed ${c.agreed}`], ["maybe", `Maybe ${c.maybe}`], ["yours", `Your turn ${c.yours}`], ["waiting", `Waiting ${c.waiting}`], ["passed", `Passed ${c.passed}`]].filter(([k], n) => !n || c[k]).map(([k, l]) => `<button class="ixf" data-act="ideaFilter" data-k="status" data-v="${k}" aria-pressed="${f.status === k}">${l}</button>`).join("")}</div>
      ${c.yours ? `<button class="btn ghost sm ixswipe-btn" data-act="ideaSwipe" data-room="${f.room}">Swipe ${c.yours} new</button>` : ""}

  }
  if (f.mode === "list") {
    const list = ixFiltered(), c = ixCounts();
    return `<button class="ixback" data-act="ideaMode" data-mode="home">‹ Ideas</button>
      ${header("Everything we've added", "All ideas", `<button class="btn" data-act="ideaAdd">${ic("i-plus")}Add</button>`)}
      <div class="ixchips">${[["all", "All"], ["yours", `Your turn ${c.yours}`], ["agreed", `Agreed ${c.agreed}`], ["maybe", `Maybe ${c.maybe}`], ["waiting", `Waiting ${c.waiting}`], ["passed", `Passed ${c.passed}`]].map(([k, l]) => `<button class="ixf" data-act="ideaFilter" data-k="status" data-v="${k}" aria-pressed="${f.status === k}">${l}</button>`).join("")}</div>
      <div class="ixchips">${[["all", "Everyone"], ...ixPeople().map(p => [p, p === meKey() ? "Added by me" : ixName(p) + "'s"])].map(([k, l]) => `<button class="ixf" data-act="ideaFilter" data-k="who" data-v="${esc(k)}" aria-pressed="${f.who === k}">${esc(l)}</button>`).join("")}</div>

    ${ixQuickAdd()}

      <div><b>${c.yours ? `${c.yours} waiting for your vote` : "You're all caught up"}</b><span>${c.yours ? (fromWho.length ? `New from ${fromWho.map(ixName).join(" & ")}` : "Swipe to decide") : c.waiting ? `${c.waiting} waiting on ${others.map(ixName).join(" & ") || "others"}` : "Add something new anytime"}</span>
      ${c.yours ? `<button class="btn" data-act="ideaSwipe">Start swiping</button>` : ""}</div>
      ${newest[0] ? `<div class="ixhero-pic">${ixPic(newest[0])}</div>` : ""}
    </section>

  const presets = [[7, "Weekly"], [14, "Every 2 weeks"], [30, "Monthly"], [90, "Every 3 months"], [182, "Every 6 months"], [365, "Yearly"], [730, "Every 2 years"]];
  const every = +t.everyDays || 90;
  openSheet(isNew ? "Add maintenance task" : "Edit task", `
    ${fld("Task", inp("title", t.title, "text", 'required'))}
    <div class="frow">${fld("System", `<select name="system">${sysOpts(t.system || "HVAC")}</select>`)}${fld("Room", `<select name="room">${roomOpts(t.room)}</select>`)}</div>
    <div class="frow">${fld("Repeats", `<select name="everyDays">${presets.map(([v, l]) => `<option value="${v}" ${v === every ? "selected" : ""}>${l}</option>`).join("")}${presets.some(p => p[0] === every) ? "" : `<option value="${every}" selected>Every ${every} days</option>`}</select>`)}${fld("Last done", inp("lastDone", t.lastDone, "date"))}</div>
    ${fld("Equipment", `<select name="equipId">${equipOpts(t.equipId)}</select>`)}
    ${fld("Notes", `<textarea name="notes">${esc(t.notes)}</textarea>`)}`, {
    onSave: d => { if (!d.title.trim()) return false; d.everyDays = +d.everyDays; if (isNew) S.data.tasks.push({ id: uid(), created: todayISO(), ...d }); else Object.assign(byId("tasks", t.id), d); commit(isNew ? "Task added" : "Saved"); },
    onDelete: isNew ? null : () => { S.data.tasks = S.data.tasks.filter(x => x.id !== t.id); commit("Deleted"); }
  });
}
function doneTask(t) {
  openSheet(`Done: ${t.title}`, `${fld("Completed on", inp("date", todayISO(), "date", "required"))}${fld("Note (optional)", inp("note", "", "text", 'placeholder="Used 20x25x1 filters"'))}%%PHOTOS%%`, {
    photos: [], photoLabel: "Photo (optional) · receipt, filter size, the work",
    saveLabel: "Mark done",
    onSave: d => { t.lastDone = d.date || todayISO(); S.data.history.push({ id: uid(), taskId: t.id, title: t.title, system: t.system, date: t.lastDone, note: d.note, photos: d.photos || [] }); commit(`Nice. Next: ${fmtRel(nextDue(t))}`); }
  });
}
function punchForm(p = {}) {
  const isNew = !p.id;

    ${fld("What needs fixing?", inp("title", p.title, "text", 'required'))}
    <div class="frow">${fld("Priority", `<select name="priority">${[["high", "High"], ["med", "Medium"], ["low", "Low"]].map(([v, l]) => `<option value="${v}" ${v === (p.priority || "med") ? "selected" : ""}>${l}</option>`).join("")}</select>`)}${fld("Who", `<select name="who"><option value="diy" ${p.who !== "pro" ? "selected" : ""}>DIY</option><option value="pro" ${p.who === "pro" ? "selected" : ""}>Call a pro</option></select>`)}</div>
    <div class="frow">${fld("Room", `<select name="room">${roomOpts(p.room)}</select>`)}${fld("System", `<select name="system">${sysOpts(p.system || "Other")}</select>`)}</div>
    <div class="frow">${fld("Equipment", `<select name="equipId">${equipOpts(p.equipId)}</select>`)}${fld("Pro", `<select name="proId">${proOpts(p.proId)}</select>`)}</div>
    %%PHOTOS%%
    ${fld("Notes", `<textarea name="notes" placeholder="Part numbers, quotes…">${esc(p.notes)}</textarea>`)}`, {

/* ---------- Accounts: utilities, services & insurance ---------- */
const UTIL_TYPES = ["Electric", "Water & sewer", "Gas", "Trash & recycling", "HOA", "Internet", "Phone / TV", "Security / alarm", "Lawn service", "Pool service", "Pest control", "Property tax", "Mortgage", "Other"];
const INS_TYPES = ["Homeowners", "Flood", "Umbrella", "Home warranty", "Earthquake", "Other"];
const FREQ = [["monthly", "Monthly", 1], ["quarterly", "Quarterly", 1 / 3], ["semiannual", "Every 6 months", 1 / 6], ["annual", "Yearly", 1 / 12]];
const money = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.]/g, "")); return isNaN(n) ? null : n; };
const fmtMoney = n => n == null ? "" : "$" + n.toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
const perMonth = a => { const n = money(a.amount); if (n == null) return null; const f = FREQ.find(x => x[0] === (a.freq || "monthly")); return n * (f ? f[2] : 1); };
const mask = s => { s = String(s || ""); return s.length > 4 ? "•••• " + s.slice(-4) : s; };
const telLink = p => p ? `<a href="tel:${esc(String(p).replace(/[^\d+]/g, ""))}">${esc(p)}</a>` : "";
const webLink = u => { if (!u) return ""; const h = /^https?:\/\//i.test(u) ? u : "https://" + u; return `<a href="${esc(h)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//i, "").replace(/\/$/, ""))} ↗</a>`; };
function nextDueDay(day) { day = parseInt(day, 10); if (!day) return null; const t = parseD(todayISO()); let d = new Date(t.getFullYear(), t.getMonth(), Math.min(day, 28)); if (d < t) d = new Date(t.getFullYear(), t.getMonth() + 1, Math.min(day, 28)); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function renewIn(a) { return a.renewal ? daysUntil(a.renewal) : null; }
function renewChip(a) { const d = renewIn(a); if (d == null) return ""; if (d < 0) return `<span class="chip bad">Expired ${fmtD(a.renewal, { month: "short", day: "numeric" })}</span>`; if (d <= 30) return `<span class="chip warn">Renews in ${d} day${d === 1 ? "" : "s"}</span>`; return `<span class="chip">Renews ${fmtD(a.renewal, { month: "short", day: "numeric", year: "numeric" })}</span>`; }

VIEWS.accts = () => {
  const all = S.data.accounts || [], ins = all.filter(a => a.kind === "insurance"), ut = all.filter(a => a.kind !== "insurance");
  const month = ut.reduce((s, a) => s + (perMonth(a) || 0), 0), insYear = ins.reduce((s, a) => s + (money(a.premium) || 0), 0);
  const nextRenew = ins.filter(a => renewIn(a) != null && renewIn(a) >= 0).sort((a, b) => a.renewal.localeCompare(b.renewal))[0];
  const auto = ut.filter(a => a.autopay === "yes").length;
  const typeOrder = t => { const i = UTIL_TYPES.indexOf(t); return i < 0 ? 99 : i; };
  return `${header("Utilities & insurance", "Accounts", `<div class="acth"><button class="btn ghost" data-act="addAcct" data-kind="insurance">${ic("i-plus")} Insurance</button><button class="btn" data-act="addAcct" data-kind="utility">${ic("i-plus")} Utility</button></div>`)}
  ${all.length ? `<div class="acsum">
    <div><b>${fmtMoney(Math.round(month))}</b><span>Utilities per month</span></div>
    <div><b>${insYear ? fmtMoney(Math.round(insYear)) : "—"}</b><span>Insurance per year</span></div>
    <div><b>${auto}/${ut.length}</b><span>On autopay</span></div>
    <div><b>${nextRenew ? fmtD(nextRenew.renewal, { month: "short", day: "numeric" }) : "—"}</b><span>${nextRenew ? `Next renewal · ${esc(nextRenew.carrier || nextRenew.type)}` : "Next renewal"}</span></div>
  </div>` : ""}
  <div class="grid g2 acgrid">
    <section class="card"><div class="hd"><h2>Insurance</h2></div>
      <div class="list">${ins.map(a => `<div class="li tap" data-act="viewAcct" data-id="${a.id}"><span class="acic ins">${esc((a.type || "I")[0])}</span><div class="li-b"><div class="li-t">${esc(a.carrier || "Carrier")} · ${esc(a.type || "Insurance")}</div><div class="li-s">${esc([a.policy ? "Policy " + mask(a.policy) : "", a.premium ? fmtMoney(money(a.premium)) + "/yr" : "", a.deductible ? "Deductible " + a.deductible : ""].filter(Boolean).join(" · "))}</div></div>${renewChip(a)}</div>`).join("") || `<div class="empty">Add your homeowners policy: carrier, policy number, agent, claims line and renewal date.<br><button class="btn sm" data-act="addAcct" data-kind="insurance" style="margin-top:10px">${ic("i-plus")} Add insurance</button></div>`}</div></section>
    <section class="card"><div class="hd"><h2>Utilities & services</h2>${ut.length ? `<span class="sub">${fmtMoney(Math.round(month))}/mo</span>` : ""}</div>
      <div class="list">${[...ut].sort((a, b) => typeOrder(a.type) - typeOrder(b.type)).map(a => { const pm = perMonth(a), nd = nextDueDay(a.dueDay); return `<div class="li tap" data-act="viewAcct" data-id="${a.id}"><span class="acic">${esc((a.type || "U")[0])}</span><div class="li-b"><div class="li-t">${esc(a.provider || a.type)}</div><div class="li-s">${esc([a.type, a.account ? "Acct " + mask(a.account) : "", nd ? "Due " + fmtD(nd, { month: "short", day: "numeric" }) : ""].filter(Boolean).join(" · "))}</div></div><div class="acamt">${pm != null ? `<b>${fmtMoney(money(a.amount))}</b><span>${esc(FREQ.find(f => f[0] === (a.freq || "monthly"))[1].toLowerCase())}</span>` : ""}${a.autopay === "yes" ? `<span class="chip ok">Autopay</span>` : ""}</div></div>`; }).join("") || `<div class="empty">Add electric, water, gas, HOA, trash, internet… with account numbers and who to call.<br><button class="btn sm" data-act="addAcct" data-kind="utility" style="margin-top:10px">${ic("i-plus")} Add utility</button></div>`}</div></section>
  </div>
  <p class="acnote">Don't store passwords here. Account and policy numbers show masked in lists and are left out of AI answers.</p>`;
};

function viewAcct(a) {
  if (!a) return;
  const ins = a.kind === "insurance";
  const row = (k, v, raw) => v ? `<div><span>${k}</span><span>${raw ? v : esc(v)}</span></div>` : "";
  const copyRow = (k, v) => v ? `<div><span>${k}</span><span class="accopy"><b>${esc(v)}</b><button type="button" class="btn sm quiet" data-act="copyText" data-v="${esc(v)}">Copy</button></span></div>` : "";
  const body = ins ? `
    <div class="ackv">${row("Type", a.type)}${row("Carrier", a.carrier)}${copyRow("Policy #", a.policy)}${row("Renewal", a.renewal ? fmtD(a.renewal, { month: "long", day: "numeric", year: "numeric" }) + (renewIn(a) >= 0 ? ` (in ${renewIn(a)} days)` : " (expired)") : "")}${row("Premium", a.premium ? fmtMoney(money(a.premium)) + " per year" : "")}${row("Paid through", a.paidVia)}</div>
    <div class="eyebrow">Coverage</div><div class="ackv">${row("Dwelling", a.dwelling)}${row("Other structures", a.otherStructures)}${row("Personal property", a.property)}${row("Liability", a.liability)}${row("Loss of use", a.lossOfUse)}${row("Deductible", a.deductible)}${row("Wind / hail deductible", a.windDeductible)}</div>
    <div class="eyebrow">Contacts</div><div class="ackv">${row("Claims line", telLink(a.claimsPhone), 1)}${row("Agent", a.agent)}${row("Agent phone", telLink(a.agentPhone), 1)}${row("Agent email", a.agentEmail ? `<a href="mailto:${esc(a.agentEmail)}">${esc(a.agentEmail)}</a>` : "", 1)}${row("Website", webLink(a.website), 1)}</div>`
    : `
    <div class="ackv">${row("Type", a.type)}${row("Provider", a.provider)}${copyRow("Account #", a.account)}${row("Amount", a.amount ? `${fmtMoney(money(a.amount))} ${FREQ.find(f => f[0] === (a.freq || "monthly"))[1].toLowerCase()}` : "")}${row("Due", a.dueDay ? `Day ${a.dueDay} of the month · next ${fmtD(nextDueDay(a.dueDay), { month: "short", day: "numeric" })}` : "")}${row("Autopay", a.autopay === "yes" ? "Yes" + (a.payFrom ? ` · ${a.payFrom}` : "") : a.autopay === "no" ? "No" : "")}${row("Account holder", a.holder)}</div>
    <div class="eyebrow">Contacts</div><div class="ackv">${row("Phone", telLink(a.phone), 1)}${row("Emergency / outage", telLink(a.emergency), 1)}${row("Email", a.email ? `<a href="mailto:${esc(a.email)}">${esc(a.email)}</a>` : "", 1)}${row("Website", webLink(a.website), 1)}${row("Login hint", a.login)}</div>`;
  openSheet(ins ? `${a.carrier || "Insurance"} · ${a.type || ""}` : (a.provider || a.type), `${body}${a.notes ? `<div class="eyebrow">Notes</div><div class="acnotes">${esc(a.notes)}</div>` : ""}${photoStrip("accounts:" + a.id, ins ? "Photos · declarations page, ID card" : "Photos · bills, meter")}`, {
    footer: `<div class="sheet-f"><span class="spacer"></span><button type="button" class="btn quiet" data-act="editAcct" data-id="${a.id}">Edit</button><button type="button" class="btn" data-close>Done</button></div>`
  });
}
function acctForm(a = {}) {
  const isNew = !a.id, ins = (a.kind || "utility") === "insurance";
  const sel = (name, list, cur) => `<select name="${name}">${list.map(v => Array.isArray(v) ? `<option value="${v[0]}" ${v[0] === cur ? "selected" : ""}>${v[1]}</option>` : `<option ${v === cur ? "selected" : ""}>${v}</option>`).join("")}</select>`;
  const body = ins ? `
    <div class="frow">${fld("Type", sel("type", INS_TYPES, a.type || "Homeowners"))}${fld("Carrier", inp("carrier", a.carrier, "text", 'autocomplete="off"'))}</div>
    <div class="frow">${fld("Policy number", inp("policy", a.policy, "text", 'autocomplete="off"'))}${fld("Renewal date", inp("renewal", a.renewal, "date"))}</div>
    <div class="frow">${fld("Annual premium", inp("premium", a.premium, "text", 'inputmode="decimal"'))}${fld("Paid through", sel("paidVia", ["", "Mortgage escrow", "Paid directly", "Autopay"], a.paidVia || ""))}</div>
    <div class="eyebrow">Coverage</div>
    <div class="frow">${fld("Dwelling", inp("dwelling", a.dwelling))}${fld("Other structures", inp("otherStructures", a.otherStructures))}</div>
    <div class="frow">${fld("Personal property", inp("property", a.property))}${fld("Liability", inp("liability", a.liability))}</div>
    <div class="frow">${fld("Loss of use", inp("lossOfUse", a.lossOfUse))}${fld("Deductible", inp("deductible", a.deductible))}</div>
    ${fld("Wind / hail deductible", inp("windDeductible", a.windDeductible, "text", 'placeholder="e.g. 1% of dwelling"'))}
    <div class="eyebrow">Contacts</div>
    <div class="frow">${fld("Claims phone", inp("claimsPhone", a.claimsPhone, "tel"))}${fld("Website", inp("website", a.website, "url", 'inputmode="url"'))}</div>
    ${fld("Agent", inp("agent", a.agent))}
    <div class="frow">${fld("Agent phone", inp("agentPhone", a.agentPhone, "tel"))}${fld("Agent email", inp("agentEmail", a.agentEmail, "email"))}</div>`
    : `
    <div class="frow">${fld("Type", sel("type", UTIL_TYPES, a.type || "Electric"))}${fld("Provider", inp("provider", a.provider, "text", 'autocomplete="off"'))}</div>
    <div class="frow">${fld("Account number", inp("account", a.account, "text", 'autocomplete="off"'))}${fld("Account holder", inp("holder", a.holder))}</div>
    <div class="frow">${fld("Typical amount", inp("amount", a.amount, "text", 'inputmode="decimal"'))}${fld("Billed", sel("freq", FREQ.map(f => [f[0], f[1]]), a.freq || "monthly"))}</div>
    <div class="frow">${fld("Due day of month", inp("dueDay", a.dueDay, "number", 'min="1" max="31" inputmode="numeric"'))}${fld("Autopay", sel("autopay", [["", "—"], ["yes", "Yes"], ["no", "No"]], a.autopay || ""))}</div>
    ${fld("Paid from", inp("payFrom", a.payFrom, "text", 'placeholder="e.g. Chase checking, Amex"'))}
    <div class="eyebrow">Contacts</div>
    <div class="frow">${fld("Phone", inp("phone", a.phone, "tel"))}${fld("Emergency / outage", inp("emergency", a.emergency, "tel"))}</div>
    <div class="frow">${fld("Website", inp("website", a.website, "url", 'inputmode="url"'))}${fld("Email", inp("email", a.email, "email"))}</div>
    ${fld("Login hint", inp("login", a.login, "text", 'placeholder="Which email you log in with — never the password"'))}`;
  openSheet(isNew ? (ins ? "Add insurance" : "Add a utility or service") : "Edit account", body + fld("Notes", `<textarea name="notes">${esc(a.notes || "")}</textarea>`) + "%%PHOTOS%%", {
    photos: a.photos || [], photoLabel: ins ? "Photos · declarations page, ID card" : "Photos · bills, meter",
    onSave: d => {
      d.kind = ins ? "insurance" : "utility";

      if (isNew) { S.data.accounts.push({ id: uid(), ...d }); commit(ins ? "Insurance added" : "Account added"); }
      else { Object.assign(byId("accounts", a.id), d); commit("Saved"); }
    },
    onDelete: isNew ? null : () => { purgePhotos(a); S.data.accounts = S.data.accounts.filter(x => x.id !== a.id); commit("Deleted"); }
  });
}

/* ---------- Materials: paint, flooring, tile, finishes — by room, with a house-wide view ---------- */
const HOUSE = "_house";
const SURFACES = [["Walls", "paint"], ["Ceiling", "paint"], ["Trim", "paint"], ["Doors", "paint"], ["Exterior paint", "paint"], ["Stain", "paint"],
  ["Floor", "floor"], ["Carpet", "floor"], ["Tile", "tile"], ["Backsplash", "tile"], ["Grout", "tile"], ["Shower / tub surround", "tile"],
  ["Countertop", "counter"], ["Cabinets", "counter"], ["Fixtures", "fixture"], ["Hardware", "fixture"], ["Lighting", "fixture"], ["Roof", "other"], ["Other", "other"]];
const MAT_CATS = [["paint", "Paint & stain"], ["floor", "Flooring"], ["tile", "Tile & grout"], ["counter", "Countertops & cabinets"], ["fixture", "Fixtures & hardware"], ["other", "Other"]];
const matCat = m => (SURFACES.find(s => s[0] === m.surface) || [0, "other"])[1];
const matRoom = id => id === HOUSE ? "Whole house / exterior" : roomName(id) || "—";
const matTitle = m => m.color || m.product || m.brand || m.surface || "Material";
const matLine = m => [m.brand, m.color && m.product && m.product !== m.color ? m.product : "", m.code, m.finish].filter(Boolean).join(" · ");
const matSw = m => m.hex ? `<span class="msw" style="background:${esc(m.hex)}"></span>` : `<span class="msw none">${esc((m.surface || "M")[0])}</span>`;
function matRow(m, showRoom) {
  return `<div class="li tap" data-act="editMat" data-id="${m.id}">${matSw(m)}<div class="li-b"><div class="li-t">${esc(m.surface || "Material")} · ${esc(matTitle(m))}</div><div class="li-s">${esc([showRoom ? matRoom(m.room) : "", matLine(m)].filter(Boolean).join(" · ") || "Tap to add details")}</div></div>${m.photos?.length ? `<img class="thumb" data-photo="${m.photos[0].id}" alt="">` : ""}</div>`;
}
function roomMaterials(r) {
  const ms = (S.data.materials || []).filter(m => m.room === r.id).sort((a, b) => SURFACES.findIndex(s => s[0] === a.surface) - SURFACES.findIndex(s => s[0] === b.surface));
  return `<div class="list">${ms.map(m => matRow(m)).join("") || `<div class="sub">No paint, flooring or finishes yet</div>`}</div>`;
}
function materialsView() {
  const all = S.data.materials || [];
  if (!all.length) return `<section class="card"><div class="empty">Keep every paint color, flooring, tile, countertop and fixture in one place, room by room.<br><button class="btn sm" data-act="addMat" style="margin-top:10px">${ic("i-plus")} Add material</button></div></section>`;
  // same product in several rooms shows once, with every room it's used in
  const groups = new Map();
  all.forEach(m => { const k = [matCat(m), m.brand, m.product, m.color, m.code, m.finish, m.surface === "Floor" || m.surface === "Carpet" ? "floor" : ""].map(x => (x || "").toLowerCase().trim()).join("|"); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(m); });
  const byCat = {}; for (const list of groups.values()) (byCat[matCat(list[0])] = byCat[matCat(list[0])] || []).push(list);
  return `<div class="matgrid">${MAT_CATS.filter(([c]) => byCat[c]).map(([c, label]) => `<section class="card"><div class="hd"><h2>${label}</h2><span class="sub">${byCat[c].length}</span></div><div class="list">${byCat[c].sort((a, b) => matTitle(a[0]).localeCompare(matTitle(b[0]))).map(list => { const m = list.find(x => x.hex) || list[0]; const rooms = [...new Set(list.map(x => matRoom(x.room)))]; const surf = [...new Set(list.map(x => x.surface))].join(", "); return `<div class="li tap" data-act="${list.length > 1 ? "matGroup" : "editMat"}" data-id="${m.id}" ${list.length > 1 ? `data-ids="${list.map(x => x.id).join(",")}"` : ""}>${matSw(m)}<div class="li-b"><div class="li-t">${esc(matTitle(m))}</div><div class="li-s">${esc([matLine(m), surf].filter(Boolean).join(" · "))}</div><div class="li-s mrooms">${esc(rooms.join(", "))}</div></div>${list.length > 1 ? `<span class="chip">${list.length} places</span>` : ""}</div>`; }).join("")}</div></section>`).join("")}</div>`;
}
function matGroup(ids) {
  const ms = ids.map(id => byId("materials", id)).filter(Boolean); if (!ms.length) return;
  openSheet(matTitle(ms[0]), `<div class="sub">${esc(matLine(ms[0]))}</div><div class="list">${ms.map(m => matRow(m, true)).join("")}</div>`, { footer: `<div class="sheet-f"><span class="spacer"></span><button type="button" class="btn" data-close>Done</button></div>` });
}
function matForm(m = {}) {
  const isNew = !m.id;
  const roomSel = `<select name="room"><option value="${HOUSE}" ${m.room === HOUSE ? "selected" : ""}>Whole house / exterior</option>${S.data.rooms.map(r => `<option value="${r.id}" ${r.id === m.room ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select>`;
  const surf = `<select name="surface">${SURFACES.map(([s]) => `<option ${s === (m.surface || "Walls") ? "selected" : ""}>${s}</option>`).join("")}</select>`;
  const finishes = ["", "Flat / matte", "Eggshell", "Satin", "Semi-gloss", "Gloss", "Honed", "Polished", "Textured"];
  openSheet(isNew ? "Add material" : `${m.surface || "Material"} · ${matRoom(m.room)}`, `

  if (m) return +m[1] + (m[2] ? +m[2] / 12 : 0);
  m = v.match(/^(\d+(?:\.\d+)?)\s*(?:"|in|inch|inches)$/); if (m) return +m[1] / 12;
  m = v.match(/^(\d+)\s+(\d+(?:\.\d+)?)$/); if (m) return +m[1] + +m[2] / 12;
