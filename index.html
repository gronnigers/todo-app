// ---------- RENDER ----------
function renderLists(el) {

    const x = e >= 0 ? lstExpState(it.vals[e]) : null;
    const note = n >= 0 && it.vals[n] ? it.vals[n] : '';
    return `<button class="lst-gc" style="--gc:${c}" data-lst-edit="${L.items.indexOf(it)}"><span class="lst-gc-name">${lstH(it.vals[0])}</span><span class="lst-gc-amt">${lstH(it.vals[a] || '—')}</span>
      <span class="lst-gc-sub">${x ? `<i class="${x.cls}">${x.cls === 'gone' ? 'expired' : 'exp'} ${lstH(it.vals[e])}</i>` : ''}${note ? `<i>${lstH(note)}</i>` : ''}</span></button>`;
  }).join('') + `</div>`;
  return h;
}

// ---------- SHEETS ----------
function lstItemSheet(L, it) {
  const editing = !!it;
  const a = L.wallet ? lstCol(L, /amount|balance/i) : -1;
  const fieldsHTML = L.fields.map((f, k) => {
    const v = it ? (it.vals[k] || '') : '';
    const long = /note/i.test(f) || (L.quote && k === 0);
    return `<div class="pk-lbl">${lstH(f)}</div>${long ? `<textarea data-k="${k}" rows="${L.quote && k === 0 ? 3 : 2}">${lstH(v)}</textarea>` : `<input type="text" data-k="${k}" value="${lstH(v)}" ${k === a ? 'inputmode="decimal"' : ''}>`}`;
  }).join('');
  const used = editing && a >= 0 ? `<div class="pk-lbl">Used some?</div><div class="pk-chips2">${[10, 25, 50].map(x => `<button class="pk-c" data-sub="${x}">− $${x}</button>`).join('')}<button class="pk-c" data-usedup>Used up</button></div>` : '';
  const { ov, close } = parkModal(`<h2>${editing ? 'Edit' : 'Add to'} <span class="pk-tt">${lstH(L.name)}</span></h2>
    ${fieldsHTML}${used}
    ${editing && !L.quote ? `<label class="lst-donechk"><input type="checkbox" data-done ${it.done ? 'checked' : ''}> ${lstH(L.doneWord)}</label>` : ''}
    <div class="modal-btns"><button class="btn-cancel">Cancel</button><button class="btn-primary">${editing ? 'Save' : 'Add'}</button></div>
    ${editing ? `<button class="btn-danger-outline" data-del>Delete</button>` : ''}`);
  const inp = k => ov.querySelector(`[data-k="${k}"]`);
  setTimeout(() => { if (!editing) inp(0).focus(); }, 250);
  ov.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { const cur = lstMoney(inp(a).value) || 0; const nv = Math.max(0, cur - +b.dataset.sub); inp(a).value = lstFmt$(nv); });
  const ud = ov.querySelector('[data-usedup]'); if (ud) ud.onclick = () => { inp(a).value = '$0'; const d = ov.querySelector('[data-done]'); if (d) d.checked = true; };
  ov.querySelector('.btn-cancel').onclick = close;
  ov.querySelector('.btn-primary').onclick = async () => {
    const vals = L.fields.map((_, k) => inp(k).value.trim());
    if (!vals[0]) { inp(0).focus(); return; }
    const d = ov.querySelector('[data-done]'); close();
    if (editing) { const ok = await lstEdit(L.file, it, vals, d ? d.checked : null); if (ok) showToast('✓ Saved'); }
    else { const ok = await lstAdd(L.file, vals); if (ok) showToast(`＋ Added to ${L.name}`); }
  };
  const del = ov.querySelector('[data-del]');
  if (del) del.onclick = async () => {
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Tap again to delete'; return; }
    close(); const ok = await lstDelete(L.file, it); if (ok) showToast('Deleted');
  };
}
function lstNewListSheet() {
  let pick = null, color = LST_COLORS[0];
  const { ov, close } = parkModal(`<h2>New list</h2>
    <div class="pk-lbl">Start from a template</div><div class="pk-chips2">${LST_TEMPLATES.map((t, k) => `<button class="pk-c" data-t="${k}">${lstH(t.name)}</button>`).join('')}</div>
    <div class="pk-lbl">Name</div><input type="text" data-name placeholder="e.g. Whiskey Shelf">
    <div class="pk-lbl">Fields (after the name, comma separated)</div><input type="text" data-fields placeholder="e.g. Distillery, Price, Rating, Notes">
    <div class="pk-lbl">Color</div><div class="lst-swatches">${LST_COLORS.map(c => `<button class="lst-sw" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div>
    <div class="modal-btns"><button class="btn-cancel">Cancel</button><button class="btn-primary">Create</button></div>`);
  const nm = ov.querySelector('[data-name]'), fl = ov.querySelector('[data-fields]');
  const sync = () => { ov.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', +b.dataset.t === pick)); ov.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === color)); };
  ov.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { pick = +b.dataset.t; const t = LST_TEMPLATES[pick]; nm.value = t.name; fl.value = t.fields.join(', '); color = t.color; sync(); });
  ov.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { color = b.dataset.c; sync(); });
  ov.querySelector('.btn-cancel').onclick = close;
  ov.querySelector('.btn-primary').onclick = async () => {
    const name = nm.value.trim(); if (!name) { nm.focus(); return; }
    const fields = ['Name', ...fl.value.split(',').map(s => s.trim()).filter(Boolean)];
    const t = pick != null && LST_TEMPLATES[pick].name === name ? LST_TEMPLATES[pick] : null;
    close(); await lstCreate(name, fields, { color, icon: t ? t.icon : 'list', ...(t && t.doneWord ? { doneWord: t.doneWord } : {}) });
  };
  sync(); setTimeout(() => nm.focus(), 250);
}
function lstSettingsSheet(L) {
  let color = L.color;
  const { ov, close } = parkModal(`<h2>List settings</h2>
    <div class="pk-lbl">Name</div><input type="text" data-name value="${lstH(L.name)}">
    <div class="pk-lbl">Fields</div><input type="text" data-fields value="${lstH(L.fields.join(', '))}">
    <div class="pk-sub" style="margin:-4px 2px 10px">Items keep their values in order. Renaming a field is safe; adding one gives older items a blank.</div>
    <div class="pk-lbl">Color</div><div class="lst-swatches">${LST_COLORS.map(c => `<button class="lst-sw" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div>
    <div class="modal-btns"><button class="btn-cancel">Cancel</button><button class="btn-primary">Save</button></div>
    <button class="btn-danger-outline" data-del>Delete this list</button>`);
  const sync = () => ov.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === color));
  ov.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { color = b.dataset.c; sync(); }); sync();
  ov.querySelector('.btn-cancel').onclick = close;
  ov.querySelector('.btn-primary').onclick = async () => {
    const name = ov.querySelector('[data-name]').value.trim() || L.name;
    const fields = ov.querySelector('[data-fields]').value.split(',').map(s => s.trim()).filter(Boolean);
    close(); const ok = await lstSetHeader(L.file, { name: name !== L.name ? name : null, fields: fields.length && fields.join('|') !== L.fields.join('|') ? fields : null, meta: color !== L.color ? { color } : null });
    if (ok) showToast('✓ List updated');
  };
  const del = ov.querySelector('[data-del]');
  del.onclick = async () => {
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = `Tap again to delete ${L.name} (${L.items.length} items)`; return; }
    close(); await lstRemoveList(L.file);
  };
}
function lstPlus() {   // header + button on the Lists tab
  const L = lstOpen && lists.find(l => l.file === lstOpen);
  if (L) lstItemSheet(L, null); else lstNewListSheet();
}

// ---------- events (delegated) ----------
document.addEventListener('click', e => {
  if (currentTab !== 'lists' || !e.target.closest) return;
  const t = e.target; if (!t.closest('#content')) return;
  const L = lstOpen && lists.find(l => l.file === lstOpen);
  const op = t.closest('[data-lst-open]'); if (op) { lstOpen = op.dataset.lstOpen; render(); window.scrollTo(0, 0); return; }
  if (t.closest('[data-lst-new]')) return lstNewListSheet();
  if (t.closest('[data-lst-back]')) { lstOpen = null; render(); return; }
  if (!L) return;
  if (t.closest('[data-lst-settings]')) return lstSettingsSheet(L);
  if (t.closest('[data-lst-add]')) return lstItemSheet(L, null);
  const tg = t.closest('[data-lst-toggle]');
  if (tg) { const it = L.items[+tg.dataset.lstToggle]; if (it) lstEdit(L.file, it, it.vals, !it.done).then(ok => ok && !it.done && showToast(`✓ ${L.doneWord}`)); return; }
  const ed = t.closest('[data-lst-edit]'); if (ed) { const it = L.items[+ed.dataset.lstEdit]; if (it) lstItemSheet(L, it); }
});
document.addEventListener('keydown', e => {
  if (currentTab === 'lists' && e.key === 'Enter' && e.target.matches && e.target.matches('[data-lst-open]')) e.target.click();
});

boot();
</script>
</body>
</html>
