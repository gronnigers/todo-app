/* ---------- gate + boot ---------- */
function renderGate(err) {
  const configured = !/YOUR-/.test(CONFIG.CLIENT_ID);
  $("#root").innerHTML = `<div class="gate"><div class="box"><span class="mark"><svg><use href="#logo"/></svg></span><h1>Dwellness</h1><p>${esc(CONFIG.ADDRESS)}</p><p>Your house — equipment, maintenance, pool &amp; spa, punch list and pros — in one calm place.</p>
  ${configured ? `<button class="btn ms" data-gate="signin">Sign in with Microsoft</button>` : `<p class="warn" style="font-size:14px">Add your Entra app's client ID to CONFIG in index.html to enable sign-in.</p>`}
  <button class="btn quiet" data-gate="demo">Try it with sample data</button>
  ${err ? `<p class="bad" style="font-size:13px">${esc(err)}</p>` : ""}</div></div>`;
}
document.addEventListener("click", ev => { const g = ev.target.closest("[data-gate]"); if (!g) return; if (g.dataset.gate === "signin") signIn(); else startDemo(); });
function demoData() {
  const d = seed(); const R = n => d.rooms.find(r => r.name === n)?.id; const t = todayISO();
  const pro = (name, trade, phone) => { const p = { id: uid(), name, trade, phone, email: "", notes: "" }; d.pros.push(p); return p.id; };
  const hv = pro("Sample HVAC Co.", "HVAC", "(512) 555-0100"), pl = pro("Sample Pool Service", "Pool service", "(512) 555-0101"), pb = pro("Sample Plumbing", "Plumbing", "(512) 555-0102");
  const eq = (name, system, room, extra = {}) => { const e = { id: uid(), name, system, room: R(room), make: "", model: "", serial: "", installed: "", warrantyEnd: "", proId: "", link: "", notes: "", ...extra }; d.equipment.push(e); return e.id; };
  eq("Oven", "Appliances", "Kitchen", { make: "Sample Make", model: "OV-1234", serial: "SN-00A1", warrantyEnd: addDays(t, 300) });
  eq("Pool pump", "Pool & Spa", "Pool", { make: "Sample Make", model: "PP-2", serial: "SN-77Q", warrantyEnd: addDays(t, 28), proId: pl });
  eq("Hot tub", "Pool & Spa", "Patio", { make: "Sample Make", model: "HT-500", serial: "SN-HT9", proId: pl });
  eq("Water heater", "Plumbing", "Utility", { make: "Sample Make", model: "WH-50", serial: "SN-WH5", proId: pb });
  eq("HVAC · upstairs", "HVAC", "Attic", { proId: hv });
  d.tasks.find(x => x.title.startsWith("Rinse hot tub")).lastDone = addDays(t, -13);
  d.tasks.find(x => x.title.startsWith("Replace HVAC")).lastDone = addDays(t, -95);
  d.punch.push({ id: uid(), title: "Oven heats unevenly", priority: "high", who: "pro", proId: "", status: "open", created: t, room: R("Kitchen"), system: "Appliances", equipId: d.equipment[0].id, notes: "" });
  d.punch.push({ id: uid(), title: "Guest bath faucet drips", priority: "med", who: "diy", proId: "", status: "open", created: t, room: "", system: "Plumbing", equipId: "", notes: "" });
  const nd = new Date(); nd.setMinutes(nd.getMinutes() - nd.getTimezoneOffset()); const now = nd.toISOString().slice(0, 16);
  d.tests.push({ id: uid(), body: "pool", date: now, ph: "7.4", san: "2.1", alk: "90", cya: "40", temp: "78", added: "", notes: "" });
  d.tests.push({ id: uid(), body: "pool", date: addDays(t, -4) + "T08:00", ph: "7.6", san: "1.6", alk: "95", cya: "40", temp: "", added: "", notes: "" });
  d.tests.push({ id: uid(), body: "spa", date: now, ph: "7.9", san: "4", alk: "100", cya: "", temp: "102", added: "", notes: "" });
  return d;
}
function startDemo() { S.demo = true; lsSet(LS.demo, true); S.me = { first: "Shane", name: "Demo", email: "" }; S.data = normalize(lsGet("dw_demo_data") || demoData()); if (!Array.isArray(S.data.ideas) || !S.data.members) demoIdeas(S.data); lsSet("dw_demo_data", S.data); render(); maybeShowWhatsNew(); }
const _commit = commit; commit = function (msg) { if (S.demo) { lsSet("dw_demo_data", S.data); render(); if (msg) toast(msg); return; } _commit(msg); };

/* ---------- app updates: new sw.js on GitHub → "Update available" ---------- */
let swReg = null, updWorker = null, reloading = false;
function askVersion(w) { return new Promise(res => { try { const ch = new MessageChannel(); ch.port1.onmessage = e => res(e.data); w.postMessage("GET_VERSION", [ch.port2]); setTimeout(() => res(null), 1500); } catch { res(null); } }); }
async function onWaiting(w) {
  if (!w || !navigator.serviceWorker.controller) return;
  const v = await askVersion(w);
  if (v && v === APP_VERSION) { w.postMessage("SKIP_WAITING"); return; }   // this page is already the new version (network-first) — just activate quietly
  updWorker = w; showUpdateBanner(v);
}
function showUpdateBanner(v) {
  if (document.getElementById("upd")) return;
  const el = document.createElement("div"); el.className = "upd"; el.id = "upd"; el.setAttribute("role", "status");
  el.innerHTML = `<span class="upd-ic">${ic("i-refresh")}</span><div class="upd-t"><b>Update ready</b><span>${v ? `Version ${esc(v)}` : "A new version of Dwellness"}</span></div><button class="later" data-upd="later">Later</button><button class="btn" data-upd="go">Update</button>`;
  document.body.appendChild(el);
  el.addEventListener("click", ev => {
    const b = ev.target.closest("[data-upd]"); if (!b) return;
    if (b.dataset.upd === "later") { el.classList.add("out"); setTimeout(() => el.remove(), 260); return; }
    applyUpdate(b);
  });
}
async function applyUpdate(btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Updating…"; }
  try { if (S.dirty && !S.demo) { clearTimeout(saveTimer); await saveRemote(); } } catch {}
  if (updWorker) updWorker.postMessage("SKIP_WAITING"); else location.reload();
}
async function checkForUpdate(manual) {
  if (!swReg) { if (manual) toast("Updates aren't available in this browser"); return; }
  try { await swReg.update(); } catch {}
  if (swReg.waiting) onWaiting(swReg.waiting);
  else if (manual) setTimeout(() => { if (!swReg.waiting && !swReg.installing) toast(`You're up to date · ${APP_VERSION}`); }, 1200);
}
function initUpdates() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register("sw.js").then(reg => {
    swReg = reg;
    if (reg.waiting) onWaiting(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; if (!w) return; w.addEventListener("statechange", () => { if (w.state === "installed") onWaiting(w); }); });
    setInterval(() => checkForUpdate(false), 15 * 60e3);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(false); });
  }).catch(() => {});
}

/* ---------- what's new ---------- */
const LS_SEEN = "dw_seen_version";
const verKey = v => String(v || "").split(/[.\-]/).map(n => parseInt(n, 10) || 0);
function cmpVer(a, b) { const x = verKey(a), y = verKey(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; }
function showWhatsNew(fromVer, manual) {
  const entries = CHANGELOG.filter(e => cmpVer(e.v, APP_VERSION) <= 0 && (fromVer ? cmpVer(e.v, fromVer) > 0 : true)).slice(0, fromVer ? undefined : (manual ? 3 : 1));
  if (!entries.length) { if (manual) toast("No release notes yet"); return; }
  const multi = entries.length > 1;
  const groups = { new: [], improved: [], fixed: [] };
  entries.forEach(e => e.items.forEach(([t, txt]) => (groups[t] || groups.improved).push({ txt, v: e.v })));
  const label = { new: "New", improved: "Improved", fixed: "Fixed" };
  const sub = fromVer && multi ? `${entries.length} updates since ${fromVer}` : `Version ${entries[0].v}`;
  const body = `<div class="wn-hero"><span class="upd-ic">${ic("i-refresh")}</span><div><b>${fromVer ? "You’re up to date" : "What’s new"}</b><span>${esc(sub)}</span></div></div>
    ${["new", "improved", "fixed"].filter(k => groups[k].length).map(k => `<div class="wn-group ${k}"><h4><span class="wn-dot"></span>${label[k]}</h4>${groups[k].map(it => `<div class="wn-item"><span>${esc(it.txt)}</span>${multi ? `<small>${esc(it.v.slice(5))}</small>` : ""}</div>`).join("")}</div>`).join("")}`;
  openSheet("What’s new", body, { footer: `<div class="sheet-f"><span class="spacer"></span><button type="button" class="btn" data-close>Got it</button></div>` });
}
function maybeShowWhatsNew() {
  let seen = lsGet(LS_SEEN);
  if (!seen) {
    // first time this device sees release notes: if the app was already in use, treat it as an update from the previous release
    const used = lsGet(LS.cache) || lsGet("dw_demo_data");
    if (!used) { lsSet(LS_SEEN, APP_VERSION); return; }
    const prev = CHANGELOG.find(e => cmpVer(e.v, APP_VERSION) < 0); seen = prev ? prev.v : null;
  }
  if (cmpVer(seen, APP_VERSION) >= 0) return;
  lsSet(LS_SEEN, APP_VERSION);
  setTimeout(() => { if (!document.getElementById("scrim")) showWhatsNew(seen); }, 700);
}

async function boot() {
  initUpdates();
  try { await handleRedirect(); } catch (e) { return renderGate(e.message); }
  if (lsGet(LS.demo) && !lsGet(LS.tok)) return startDemo();
  if (!lsGet(LS.tok)) return renderGate();
  if (tokenAging() && renewSignIn()) return;
  S.home = lsGet(LS.home);
  const cached = lsGet(LS.cache);
  if (cached && cached.data && (!S.home || same(cached.home, S.home))) { S.data = normalize(cached.data); S.base = cached.base; S.etag = cached.etag; S.ctag = cached.ctag; S.dirty = !!cached.dirty; S.me = lsGet(LS.me) || { first: "" }; render(); }
  else $("#root").innerHTML = `<div class="gate"><div class="box"><span class="mark"><svg><use href="#logo"/></svg></span><p>Opening the house…</p></div></div>`;
  try {
    await Promise.all([loadMe(), loadRemote()]);
    syncMyPrefs(); recordMe(); render(); setSync("ok"); maybeShowWhatsNew();
  } catch (e) {
    console.error(e);
    if (e.message === "signed-out") return renderGate("Your session expired. Sign in again.");
    const why = !navigator.onLine || e instanceof TypeError ? "You're offline" : /AADSTS|token|signed-out|401/i.test(e.message) ? "Sign-in needs refreshing" : /40[34]/.test(e.message) ? "Can't reach the Dwellness site" : "Couldn't load the latest";
    if (S.data) { setSync("err"); toast(`${why}. Showing your last saved copy. Changes will sync when it's back.`); if (navigator.onLine) setTimeout(() => pollRemote(), 15000); } else renderGate(e.message);
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") return; if (!S.demo && tokenAging() && !S.dirty && !document.getElementById("scrim") && renewSignIn()) return; pollRemote(); });
window.addEventListener("online", () => { if (S.dirty && !S.demo) saveRemote(); else pollRemote(); });
boot();
</script>
</body>
