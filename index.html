<script>
const msalConfig = {
 auth: { clientId: CONFIG.CLIENT_ID, authority: 'https://login.microsoftonline.com/common', redirectUri: 
window.location.href.split('?')[0] }
};
const msal = new msal.PublicClientApplication(msalConfig);
let tasks = [], filter = 'all', tab = 'backlog', editingIndex = null, rawContent = '';
async function init() {
 await msal.initialize();
 const resp = await msal.handleRedirectPromise();
 const accounts = msal.getAllAccounts();
 if (!accounts.length) { document.getElementById('login').classList.remove('hidden'); return; }
 msal.setActiveAccount(accounts[0]);
 document.getElementById('app').classList.remove('hidden');
 await loadTasks();
}
async function signIn() {
 await msal.loginRedirect({ scopes: CONFIG.SCOPES });
}
async function getToken() {
 const result = await msal.acquireTokenSilent({ scopes: CONFIG.SCOPES });
 return result.accessToken;
}
async function loadTasks() {
 try {
 const token = await getToken();
 const res = await fetch('https://graph.microsoft.com/v1.0' + CONFIG.FILE_PATH, {
 headers: { Authorization: 'Bearer ' + token }
 });
 rawContent = await res.text();
 parseTasks();
 render();
 } catch(e) { document.getElementById('subtitle').textContent = 'Error loading backlog'; }
}
function parseTasks() {
 tasks = [];
 const lines = rawContent.split('\n');
 lines.forEach((line, i) => {
 const m = line.match(/^- \[( |x)\] (.+?)(?:\s+\((\w+)\))?$/);
 if (m) tasks.push({ done: m[1]==='x', title: m[2].replace(/ \(\w+\)$/, '').trim(), tag: m[3]||'', 
lineIndex: i });
 });
}
function render() {
 const active = tasks.filter(t => !t.done && (filter==='all' || t.tag===filter));
 const done = tasks.filter(t => t.done && (filter==='all' || t.tag===filter));
 document.getElementById('subtitle').textContent = tasks.filter(t=>!t.done).length + ' active · ' + 
tasks.filter(t=>t.done).length + ' done';
 if (tab !== 'backlog') { renderStats(); return; }

div><div class="stat-value">' + tasks.filter(t=>t.done).length + '</div></div></div>';

}

 await fetch('https://graph.microsoft.com/v1.0' + CONFIG.FILE_PATH, {

 });
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function closeModalIfBg(e) { if (e.target.id === 'modal') closeModal(); }
async function saveTask() {
 const title = document.getElementById('task-input').value.trim();
 if (!title) return;
 const tag = document.getElementById('tag-select').value;
 const tagStr = tag ? ' (' + tag + ')' : '';
 const newLine = '- [ ] ' + title + tagStr;
 const lines = rawContent.split('\n');
 if (editingIndex !== null) {
 const old = lines[editingIndex];
 const isDone = old.includes('- [x]');
 lines[editingIndex] = (isDone ? '- [x] ' : '- [ ] ') + title + tagStr;
 } else {
 const activeIdx = lines.findIndex(l => l.trim() === '## Active');
 if (activeIdx >= 0) { lines.splice(activeIdx + 2, 0, newLine); }
 else { lines.push(newLine); }
 }
 rawContent = lines.join('\n');
 parseTasks(); render(); closeModal();
 await saveToOneDrive();
}
async function deleteTask() {
 if (editingIndex === null) return;
 const lines = rawContent.split('\n');
 lines.splice(editingIndex, 1);
 rawContent = lines.join('\n');
 parseTasks(); render(); closeModal();
 await saveToOneDrive();
}
function setFilter(f, el) {
 filter = f;
 document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
 el.classList.add('active');
 render();
}
function setTab(t, el) {
