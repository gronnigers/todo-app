      <circle cx="18" cy="18" r="15" fill="none" stroke="var(--tag-bg)" stroke-width="4"/>${planPct > pct ? `<circle cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-opacity=".3" stroke-width="4" stroke-linecap="round" stroke-dasharray="${planPct * C} ${C}" transform="rotate(-90 18 18)"/>` : ''}${Dn ? `<circle cx="18" cy="18" r="15" fill="none" stroke="url(#blgr)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${pct * C} ${C}" transform="rotate(-90 18 18)"/>` : ''}</svg>
      <div><div class="l">Today’s focus</div><div class="v">${Dn} / ${goal}</div><div class="s">${Dn >= goal && !U ? 'Set complete 🤙' : [U + Dn ? `${U + Dn} on Today` : 'Nothing on Today yet', slots ? `${slots} slot${slots > 1 ? 's' : ''} open` : ''].filter(Boolean).join(' · ')}</div></div></div>
    <div class="bl-kpi glass-panel" ${ready ? 'data-pj-checkin' : ''}><div class="l">⚡ Ready for you</div><div class="v" style="color:var(--green)">${ready}</div><div class="s">${ready ? 'your move — tap to check in' : 'nothing came back yet'}</div></div>
    <div class="bl-kpi glass-panel" ${pkW.length ? 'style="cursor:pointer" onclick="blSetView(\'parked\')"' : ''}><div class="l">⏳ Waiting on others</div><div class="v" style="color:var(--orange)">${waiting}</div><div class="s">${due ? `<span style="color:var(--danger)">${due} follow-up${due > 1 ? 's' : ''} due</span>` : 'no follow-ups due'}</div></div>
    <div class="bl-kpi glass-panel" ${old ? `data-bl-open="${old.lineIndex}"` : ''}><div class="l">Oldest open</div><div class="v">${old ? oldD + 'd' : '—'}</div><div class="s bl-trunc">${old ? old.title.replace(/</g, '&lt;') : 'nothing dated'}</div></div>
  </div>`;
}
document.addEventListener('click', e => {
  const o = e.target.closest && e.target.closest('[data-bl-open]'); if (!o) return;
  const t = tasks.find(x => x.lineIndex === +o.dataset.blOpen); if (!t) return;
  if (t.cardId && pjFind(t.cardId)[1]) pjOpen('card', t.cardId); else openEditModal(t);
});

// keep sticky offsets in sync with the real header height
function blSyncHeader() { const h = document.querySelector('.header'); if (h) document.documentElement.style.setProperty('--hdr-h', h.offsetHeight + 'px'); }
window.addEventListener('resize', blSyncHeader);
window.addEventListener('scroll', () => { const k = document.querySelector('.bl-kpis'); if (k) k.classList.toggle('stuck', window.scrollY > 20); }, { passive: true });

// ============================================================
// LIVE SYNC — pull changes made on other devices (or by the backlog assistant)
// Runs when the app comes back to the foreground, on focus/online, and every 45s while visible.
// Never interrupts: skips while you're typing, dragging, have a sheet/modal open, or a save is in flight.
// ============================================================
let blSaving = 0;
const _blSaveBacklog = saveBacklog;
saveBacklog = async function (...a) { blSaving++; try { return await _blSaveBacklog(...a); } finally { blSaving--; } };
let syncBusy = false, lastAutoSync = 0;
function syncUiBusy() {
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return true;
  const m = document.getElementById('modal'); if (m && !m.classList.contains('hidden')) return true;
  if (document.querySelector('.pj-sheet.open, .pop-scrim, .pj-lightbox, .modal-overlay:not(.hidden)')) return true;
  if (typeof pjDrag !== 'undefined' && (pjDrag || pjPending)) return true;
  if (window.__tdDrag) return true;
  if (typeof openSwipeWrap !== 'undefined' && openSwipeWrap) return true;
  return false;
}
async function autoSync(force) {
  if (!accessToken || document.hidden || syncBusy) return;
  if (!force && Date.now() - lastAutoSync < 8000) return;
  if (blSaving || pjSaving || pjSaveT || syncUiBusy()) return;
  syncBusy = true; lastAutoSync = Date.now();
  try {
    let changed = false;
    const [rb, rp, rf] = await Promise.all([graphFetch(CONFIG.FILE_PATH), graphFetch(PJ_PATH), graphFetch(PREFS_PATH)]);
    if (await loadPrefs(rf)) changed = true;
    if (blSaving || pjSaving || pjSaveT) return;                      // a local edit started meanwhile — try next tick
    if (rb && rb.ok) { const txt = await rb.text(); if (txt !== backlogBase && txt !== rawMd) { rawMd = txt; backlogBase = txt; parseTasks(); changed = true; } }
    if (rp && rp.ok) { const txt = await rp.text(); if (txt !== pjBase) { try { const d = JSON.parse(txt); if (d && Array.isArray(d.projects)) { pj = Object.assign({ tomb: [] }, d); pjBase = txt; localStorage.setItem('pj_cache', txt); changed = true; } } catch {} } }
    await loadFocusHistory();
    lastSynced = new Date(); syncError = null;
    if (changed) { await maybeRolloverToday(); if (maybeBackfillFromDeck()) await saveBacklog(); if (!syncUiBusy()) { const y = window.scrollY; pjFlip(render); window.scrollTo(0, y); } }
  } catch (e) { /* offline — try again later */ }
  finally { syncBusy = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoSync(true); });
window.addEventListener('focus', () => autoSync());
window.addEventListener('online', () => autoSync(true));
setInterval(() => autoSync(), 45000);

// ---------- one-time tag cleanup (Sept 2026): house → "around the house", drop "personal" ----------
async function migrateTags() {
  const reg = readTagRegistry() || [];
  const hasTag = t => reg.includes(t) || tasks.some(x => (x.tag || '').toLowerCase() === t);
  let did = false;
  if (hasTag('house')) { await renameTag('house', 'around the house'); did = true; }
  if (hasTag('personal')) { await removeTag('personal'); did = true; }
  if (did) showToast('Tags updated: House → Around the house · Personal removed');
}

boot();
</script>
