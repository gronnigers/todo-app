// ============================================================
// PKCE AUTH
// ============================================================
function base64urlEncode(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function generatePKCE() {
  const verifier = base64urlEncode(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = base64urlEncode(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  return { verifier, challenge };
}
async function login() {
  const { verifier, challenge } = await generatePKCE();
  const state = base64urlEncode(crypto.getRandomValues(new Uint8Array(16)));
  localStorage.setItem('pkce_verifier', verifier);
  localStorage.setItem('pkce_state', state);
  localStorage.setItem('auth_error', '');
  const p = new URLSearchParams({
    client_id: CONFIG.CLIENT_ID, response_type: 'code',
    redirect_uri: REDIRECT_URI, scope: CONFIG.SCOPES,
    code_challenge: challenge, code_challenge_method: 'S256', state
  });
  location.href = `https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/authorize?${p}`;
}
async function exchangeCode(code, returnedState) {
  const verifier = localStorage.getItem('pkce_verifier');
  const savedState = localStorage.getItem('pkce_state');
  if (!verifier) { localStorage.setItem('auth_error', 'PKCE verifier missing.'); return false; }
  if (savedState && returnedState && savedState !== returnedState) {
    localStorage.setItem('auth_error', 'State mismatch.'); return false;
  }
  try {
    const res = await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/token`, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: CONFIG.CLIENT_ID, grant_type: 'authorization_code',
        code, redirect_uri: REDIRECT_URI, code_verifier: verifier
      })
    });
    const data = await res.json();
    if (data.access_token) {
      accessToken = data.access_token;
      localStorage.setItem('ms_token', accessToken);
      if (data.refresh_token) localStorage.setItem('ms_refresh', data.refresh_token);
      localStorage.removeItem('pkce_verifier'); localStorage.removeItem('pkce_state');
      localStorage.setItem('auth_error', '');
      history.replaceState({}, '', location.pathname);
      return true;
    }
    localStorage.setItem('auth_error', data.error_description || data.error || JSON.stringify(data));
    return false;
  } catch(e) {
    localStorage.setItem('auth_error', 'Network error: ' + e.message); return false;
  }
}
async function refreshToken() {
  const rt = localStorage.getItem('ms_refresh');
  if (!rt) return false;
  const res = await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/token`, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CONFIG.CLIENT_ID, grant_type: 'refresh_token',
      refresh_token: rt, scope: CONFIG.SCOPES
    })
  });
  const data = await res.json();
  if (data.access_token) {
    accessToken = data.access_token;
    localStorage.setItem('ms_token', accessToken);
    if (data.refresh_token) localStorage.setItem('ms_refresh', data.refresh_token);
    return true;
  }
  return false;
}

// ============================================================
// GRAPH API
// ============================================================
async function graphFetch(url, opts = {}) {
  const res = await fetch('https://graph.microsoft.com/v1.0' + url, {
    ...opts, headers: { Authorization: 'Bearer ' + accessToken, ...(opts.headers || {}) }
  });
  if (res.status === 401) {
    const ok = await refreshToken();
    if (ok) return graphFetch(url, opts);
    signOut(); return null;
  }
  return res;
}

let lastSynced = null;
let syncError = null;

let backlogBase = null;   // the content we last loaded/saved — the merge base

async function loadBacklog() {
  syncError = null;
  const res = await graphFetch(CONFIG.FILE_PATH);
  if (!res) { syncError = 'Auth failed — signed out'; return; }
  if (!res.ok) {

    showToast('⚠️ Could not load backlog (' + res.status + ')');

// ---- CONFLICT-SAFE MERGE ----
// The backlog file is written from several places (this app on each device, plus
// Dispatch/the backlog assistant). Before overwriting, we merge our changes onto
// whatever is newest so a stale copy can never silently wipe someone else's edit
// (e.g. notes just added on another device).
function taskKeyOf(line) {
  if (!/^- \[[ x]\] /.test(line)) return null;         // not a task line
  return line.replace(/^- \[[ x]\] /, '')
             .replace(/\s*\[[^\]]*\]/g, '')            // strip bracket flags
             .replace(/\s*\([A-Za-z]+\)\s*$/, '')      // strip trailing (tag)
             .trim();
}
function _keyCounts(lines) {
  const m = new Map();
  for (const l of lines) { const k = taskKeyOf(l); if (k) m.set(k, (m.get(k)||0)+1); }
  return m;
}
function mergeBacklog(base, ours, theirs) {
  const baseL = base.split('\n'), ourL = ours.split('\n'), theirL = theirs.split('\n');
  const baseC = _keyCounts(baseL), ourC = _keyCounts(ourL), theirC = _keyCounts(theirL);
  const safe = k => !!k && baseC.get(k) === 1 && (ourC.get(k) || 0) <= 1;  // unambiguous only
  const baseByKey = new Map(); baseL.forEach(l => { const k = taskKeyOf(l); if (k && baseC.get(k)===1) baseByKey.set(k, l); });
  const ourByKey  = new Map(); ourL.forEach(l => { const k = taskKeyOf(l); if (k && ourC.get(k)===1) ourByKey.set(k, l); });
  const removed = new Set([...baseByKey.keys()].filter(k => safe(k) && !ourByKey.has(k)));
  const result = [], consumed = new Set();
  for (const line of theirL) {
    const k = taskKeyOf(line);
    if (k === null) { result.push(line); continue; }               // headers/prose/blanks: keep theirs
    if (safe(k) && removed.has(k)) continue;                       // we deleted this task
    if (safe(k) && ourByKey.has(k)) {                              // task in both
      consumed.add(k);
      const ourLine = ourByKey.get(k), baseLine = baseByKey.get(k);
      result.push(ourLine !== baseLine ? ourLine : line);          // our edit wins; else keep theirs
    } else {
      result.push(line);                                           // untouched or ambiguous: keep theirs
    }
  }
  // tasks we created that don't exist in base or theirs yet
  const additions = [...ourByKey.entries()].filter(([k]) => ourC.get(k) === 1 && !baseC.has(k) && !theirC.has(k)).map(([,l]) => l);
  if (additions.length) {
    const idx = result.findIndex(l => l.trim() === '## Active');
    if (idx !== -1) result.splice(idx + 2, 0, ...additions); else result.push(...additions);
  }
  // Tag-registry comment is app-managed metadata: if WE changed it, our version wins
  // (a concurrent task-only write would otherwise carry theirs' stale registry through).
  const regOf = s => { const m = s.match(REGISTRY_RE); return m ? m[0] : null; };
  const baseReg = regOf(base), ourReg = regOf(ours);
  if (ourReg && ourReg !== baseReg) {
    const ri = result.findIndex(l => REGISTRY_RE.test(l));
    if (ri !== -1) result[ri] = ourReg;
    else { const a = result.findIndex(l => l.trim() === '## Active'); if (a !== -1) result.splice(a + 1, 0, ourReg); else result.unshift(ourReg); }
  }
  return result.join('\n');
}

async function loadStats() {

async function saveBacklog() {
  // Conflict-safe: re-read the newest copy and merge our changes onto it before
  // overwriting, so we never clobber edits (like notes) made elsewhere meanwhile.
  try {
    const cur = await graphFetch(CONFIG.FILE_PATH);
    if (cur && cur.ok) {
      const latest = await cur.text();
      if (backlogBase !== null && latest !== backlogBase && latest !== rawMd) {
        rawMd = mergeBacklog(backlogBase, rawMd, latest);
        parseTasks();
      }
    }
  } catch (e) { /* best-effort — fall through and still write */ }

  const res = await graphFetch(CONFIG.FILE_PATH, {
    method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: rawMd
  });
  if (res && !res.ok) {
    const body = await res.text().catch(()=>'');
    syncError = `Save failed: HTTP ${res.status} — ${body.slice(0,120)}`;
    showToast('⚠️ Save failed (' + res.status + ')');
  } else if (res && res.ok) {
    backlogBase = rawMd;
    lastSynced = new Date();
  }
}

async function manualRefresh() {
  showToast('Refreshing…');
  await Promise.all([loadBacklog(), loadFocusHistory(), loadProjects()]);
  await maybeRolloverToday();
  render();
  if (!syncError) showToast('✓ Synced');
}

// ============================================================
// PARSE
// ============================================================
function parseTasks() {
  tasks = [];
  let createdDirty = false;
  let completionsDirty = false;
  rawMd.split('\n').forEach((line, i) => {
    // Extract and strip all bracket metadata before parsing
    let createdTs = null, doneTs = null, notesRaw = null;
    const createdMatch = line.match(/\s*\[created:([^\]]+)\]/);
    if (createdMatch) createdTs = createdMatch[1];
    const doneMatch = line.match(/\s*\[done:([^\]]+)\]/);
    if (doneMatch) doneTs = doneMatch[1];
    const notesMatch = line.match(/\s*\[notes:([^\]]*)\]/);
    if (notesMatch) notesRaw = notesMatch[1];
    const cardMatch = line.match(/\[card:([^\]]+)\]/);
    const isTomorrow = /\[tomorrow\]/.test(line);
    const isBonus = /\[bonus\]/.test(line);

    // Strip [created:...], [done:...], [notes:...], [tomorrow], [bonus] before main parse
    const cleanLine = line
      .replace(/\s*\[created:[^\]]+\]/g, '')
      .replace(/\s*\[done:[^\]]+\]/g, '')
      .replace(/\s*\[notes:[^\]]*\]/g, '')
      .replace(/\s*\[tomorrow\]/g, '')
      .replace(/\s*\[bonus\]/g, '')
      .replace(/\s*\[card:[^\]]+\]/g, '');

    const m = cleanLine.match(/^- \[( |x)\] (.+?)(?:\s+\((\w+)\))?(\s+\[today(?::([^\]]+))?\])?$/);
    if (m) {
      const title = m[2];
      // Store inline created timestamp
      if (createdTs && !created[title]) { created[title] = createdTs; createdDirty = true; }
      // Store inline done timestamp into completions
      if (doneTs && !completions[title]) { completions[title] = doneTs; completionsDirty = true; }
      const today = !!m[4];
      tasks.push({
        done: m[1]==='x', title, tag: m[3]||null,
        today,
        tomorrow: isTomorrow && !today,   // [tomorrow] staging (mutually exclusive with today)
        bonus: isBonus && today,          // [bonus] icing task (a Today task past the core 3)
        todayAt: m[5] ? new Date(m[5]) : null,
        lineIndex: i,
        notes: notesRaw !== null ? decodeNotes(notesRaw) : null,
        cardId: cardMatch ? cardMatch[1] : null
      });
    }
  });
  if (createdDirty) saveCreated();
  if (completionsDirty) saveCompletions();
}

function todayAgeHours(task) {
  if (!task.today || !task.todayAt || task.done) return 0;
  return (Date.now() - task.todayAt.getTime()) / 3600000;
}
// Aging badge: how many full days a task has been sitting on Today (≥1 day only).
function ageBadge(task) {
  const days = Math.floor(todayAgeHours(task) / 24);
  if (days < 1) return '';
  const stale = days >= 2 ? 'stale' : '';
  return `<span class="age-badge ${stale}" title="On Today for ${days} day${days===1?'':'s'}">` +
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>` +
    `${days}d</span>`;
}

// ============================================================
// TOGGLE DONE — records timestamp
// ============================================================
let todayCelebrating = false;

async function clearTodayList() {
  const lines = rawMd.split('\n').map(l => l.replace(/\s+\[today(?::[^\]]+)?\]/, ''));
  rawMd = lines.join('\n');
  todayCelebrating = false;
  parseTasks(); render();
  await saveBacklog();
}

async function toggleDone(title, lineIndex) {
  const lines = rawMd.split('\n');
  let line = lines[lineIndex];
  if (!line) return;
  const marking = line.includes('- [ ]');
  const wasToday = /\[today/.test(line);
  const ts = new Date().toISOString();

  if (marking) {
    line = line.replace('- [ ]','- [x]');
    // Persist the completion timestamp INTO the file so stats are durable & sync.
    if (!/\[done:/.test(line)) line = line.trimEnd() + ` [done:${ts}]`;
    completions[title] = ts;
    if (wasToday) bumpFocusToday(1);        // counts toward "days you hit your 3"
  } else {
    line = line.replace('- [x]','- [ ]').replace(/\s*\[done:[^\]]*\]/,'');
    delete completions[title];
    if (wasToday) bumpFocusToday(-1);
  }
  lines[lineIndex] = line;
  rawMd = lines.join('\n');
  saveCompletions();

  parseTasks();
  render();
  await saveBacklog();

  // Check if all today tasks are now complete — show celebration but don't auto-clear
  if (marking && !todayCelebrating) {
    const todayTasks = tasks.filter(t => t.today);
    if (todayTasks.length > 0 && todayTasks.every(t => t.done)) {
      todayCelebrating = true;
      render();
    }
  }
}

// ============================================================
// ADD TASK
// ============================================================
async function addTask(title, tag, notes) {
  const lines = rawMd.split('\n');
  const activeIdx = lines.findIndex(l => l.trim() === '## Active');
  const iso = new Date().toISOString();
  const notesFlag = notes ? ` [notes:${encodeNotes(notes)}]` : '';
  const base = tag ? `- [ ] ${title} (${tag})` : `- [ ] ${title}`;
  // Stamp [created:] inline so creation order persists in the file and syncs across devices.
  const newLine = `${base} [created:${iso}]${notesFlag}`;
  if (activeIdx !== -1) lines.splice(activeIdx + 2, 0, newLine);
  else lines.push(newLine);
  rawMd = lines.join('\n');
  if (!created[title]) { created[title] = iso; saveCreated(); }
  parseTasks(); render();
  await saveBacklog();
}

// ============================================================
// EDIT TASK
// ============================================================
async function editTask(lineIndex, oldTitle, newTitle, newTag, newNotes) {
  const lines = rawMd.split('\n');
  const line = lines[lineIndex];
  if (!line) return;
  const isDone = line.includes('- [x]');
  // Preserve ALL existing bracket metadata (created/done/today/tomorrow/bonus);
  // only the title, tag, and notes are being rewritten here.
  const keptFlags = (line.match(/\s*\[(?:created|done|today|tomorrow|bonus|card)(?::[^\]]*)?\]/g) || []).join('');
  const notesFlag = newNotes ? ` [notes:${encodeNotes(newNotes)}]` : '';
  const box = isDone ? '- [x]' : '- [ ]';
  const tagPart = newTag ? ` (${newTag})` : '';
  lines[lineIndex] = `${box} ${newTitle}${tagPart}${notesFlag}${keptFlags}`;
  rawMd = lines.join('\n');

  // Update completions key if title changed
  if (oldTitle !== newTitle && completions[oldTitle]) {
    completions[newTitle] = completions[oldTitle];
    delete completions[oldTitle];
    saveCompletions();
  }
  // Update created key if title changed
  if (oldTitle !== newTitle && created[oldTitle]) {
    created[newTitle] = created[oldTitle];
    delete created[oldTitle];
    saveCreated();
  }

  parseTasks(); render();
  await saveBacklog();
}

// ============================================================
// DELETE TASK
// ============================================================
async function deleteTask(lineIndex, title) {
  const lines = rawMd.split('\n');
  lines.splice(lineIndex, 1);
  rawMd = lines.join('\n');
  if (title) { delete completions[title]; saveCompletions(); }
  if (title) { delete created[title]; saveCreated(); }
  parseTasks(); render();
  showToast('Task deleted');
  await saveBacklog();
}

function showModal() {
  const overlay = document.getElementById('modal');
  overlay.classList.remove('hidden');
  // Trigger animation on next frame
  requestAnimationFrame(() => {
    overlay.classList.add('visible');
    setTimeout(() => document.getElementById('modal-task-title').focus(), 150);
  });
  // Adjust for virtual keyboard on iOS
  if (window.visualViewport) {
    const adjustModal = () => {
      const vv = window.visualViewport;
      const keyboardHeight = window.innerHeight - vv.height;
      overlay.style.paddingTop = keyboardHeight > 100
        ? `${Math.max(20, vv.offsetTop + 40)}px`
        : '';
    };
    window.visualViewport.addEventListener('resize', adjustModal);
    overlay._vvCleanup = () => window.visualViewport.removeEventListener('resize', adjustModal);
  }
}
function closeModal() {
  const overlay = document.getElementById('modal');
  overlay.classList.remove('visible');
  if (overlay._vvCleanup) { overlay._vvCleanup(); overlay._vvCleanup = null; }
  overlay.style.paddingTop = '';
  setTimeout(() => overlay.classList.add('hidden'), 200);
}
function submitModal() {
  const title = document.getElementById('modal-task-title').value.trim();
  const tag = document.getElementById('modal-task-tag').value || null;
  const notes = document.getElementById('modal-task-notes').value.trim() || null;
  if (!title) return;
  closeModal();
  if (modalMode === 'add') {
    addTask(title, tag, notes); showToast('Task added');
  } else {
    editTask(editingTask.lineIndex, editingTask.title, title, tag, notes);
    showToast('Task saved');

}

  if (!editingTask) return;
  closeModal();

// ============================================================
function getCompletionsThisMonth() {
  const now = new Date();
  const yr = now.getFullYear(), mo = now.getMonth();
  return Object.entries(completions).filter(([,iso]) => {
    const d = new Date(iso);
    return d.getFullYear() === yr && d.getMonth() === mo;
  });
}
function getCompletionsByDay() {
  const now = new Date();
  const yr = now.getFullYear(), mo = now.getMonth();
  const daysInMonth = new Date(yr, mo+1, 0).getDate();
  const byDay = new Array(daysInMonth+1).fill(0);
  Object.values(completions).forEach(iso => {
    const d = new Date(iso);
    if (d.getFullYear()===yr && d.getMonth()===mo) byDay[d.getDate()]++;
  });
  return { byDay, daysInMonth };
}

// Radial progress ring for the monthly score card
function buildProgressRing(value, goal) {
  const pct = Math.max(0, Math.min(1, goal > 0 ? value / goal : 0));
  const r = 62, cx = 74, cy = 74, sw = 12, circ = 2 * Math.PI * r;
  const dash = (pct * circ).toFixed(2);
  return `<svg viewBox="0 0 148 148" xmlns="http://www.w3.org/2000/svg" style="width:148px;height:148px;transform:rotate(-90deg)">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#007aff"/><stop offset="1" stop-color="#5ac8fa"/>
      </linearGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--progress-bg)" stroke-width="${sw}"/>
    ${pct > 0 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#ringGrad)" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${dash} ${(circ - pct * circ).toFixed(2)}"/>` : ''}
  </svg>`;
}

function buildDonutChart(segments) {
  // segments: [{label, count, color}]
  const total = segments.reduce((s,x) => s+x.count, 0);
  const r = 36, cx = 50, cy = 50, sw = 11, circ = 2 * Math.PI * r;
  if (total === 0) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="donut-svg">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--donut-bg)" stroke-width="${sw}"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="var(--sub)" font-family="-apple-system,sans-serif">No data</text>
    </svg>`;
  }
  const visible = segments.filter(s=>s.count>0);
  const gap = visible.length > 1 ? 2.5 : 0;   // 2px surface gap between fills
  let accum = 0;
  const arcs = visible.map(s => {
    const len = (s.count / total) * circ;
    const drawLen = Math.max(len - gap, 0.6);
    const offset = circ / 4 - accum;
    accum += len;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}"
      stroke-width="${sw}" stroke-dasharray="${drawLen.toFixed(2)} ${(circ-drawLen).toFixed(2)}"
      stroke-dashoffset="${offset.toFixed(2)}"/>`;
  }).join('');
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="donut-svg">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--donut-bg)" stroke-width="${sw}"/>
    ${arcs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="17" font-weight="800" fill="var(--text)" font-family="-apple-system,sans-serif">${total}</text>
    <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="7" fill="var(--sub)" font-family="-apple-system,sans-serif" letter-spacing="0.5">DONE</text>
  </svg>`;
}

function buildBarChart(byDay, daysInMonth) {
  const today = new Date().getDate();
  const W = 320, H = 118, padL = 4, padR = 4, padT = 12, padB = 18;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const vals = byDay.slice(1, daysInMonth+1);
  const maxVal = Math.max(1, ...vals);
  const barSlot = chartW / daysInMonth;
  const barW = Math.max(3, barSlot * 0.68);
  const baseY = padT + chartH;
  // average completions per elapsed day this month
  const elapsed = Math.min(today, daysInMonth);
  const totalDone = vals.reduce((a,b)=>a+b,0);
  const avg = elapsed > 0 ? totalDone / elapsed : 0;
  const avgY = baseY - Math.min(1, avg/maxVal) * chartH;

  let bars = '';
  for (let d = 1; d <= daysInMonth; d++) {
    const val = byDay[d] || 0;
    const x = padL + (d-1)*barSlot + (barSlot - barW)/2;
    const barH = val > 0 ? Math.max(3, (val/maxVal)*chartH) : 2;
    const y = baseY - barH;
    const isToday = d === today;
    const fill = isToday ? 'var(--chart-bar-today)' : 'var(--chart-bar)';
    const rad = Math.min(barW/2, 2.5).toFixed(1);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="${rad}" fill="${fill}"/>`;
    if (d===1 || d===10 || d===20 || d===daysInMonth || d===today) {
      bars += `<text x="${(x+barW/2).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="7.5" fill="var(--sub)" font-family="-apple-system,sans-serif" font-weight="${isToday?700:400}">${d}</text>`;
    }
  }
  const baseline = `<line x1="${padL}" y1="${baseY.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${baseY.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>`;
  const avgLine = avg > 0
    ? `<line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${avgY.toFixed(1)}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
       <text x="${padL}" y="${(avgY-3).toFixed(1)}" text-anchor="start" font-size="7" fill="var(--sub)" font-family="-apple-system,sans-serif">avg ${avg.toFixed(1)}/day</text>`
    : '';
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">${baseline}${bars}${avgLine}</svg>`;
}

function renderBacklog(el, activeTasks, doneTasks) {
  const pjGrouped = !searchQ && !filterTag;
  let filtered = pjGrouped ? activeTasks.filter(t => !(t.cardId && pjFind(t.cardId)[1])) : activeTasks;
  if (filterTag) filtered = filtered.filter(t => (t.tag||'').toLowerCase() === filterTag);
  if (searchQ) filtered = filtered.filter(t=>t.title.toLowerCase().includes(searchQ.toLowerCase()));
  // Sort by real creation date. Oldest = earliest first; newest = latest first.
  // Tiebreak by file position so identical/undated timestamps stay stable.
  filtered = [...filtered].sort((a, b) => {
    if (sortOrder === 'tag') {
      const ta = a.tag ? a.tag.toLowerCase() : '￿', tb = b.tag ? b.tag.toLowerCase() : '￿';
      if (ta !== tb) return ta < tb ? -1 : 1;
      return (createdMsOf(a) - createdMsOf(b)) || (a.lineIndex - b.lineIndex);
    }
    const diff = (createdMsOf(a) - createdMsOf(b)) || (a.lineIndex - b.lineIndex);
    return sortOrder === 'newest' ? -diff : diff;
  });

  const pjHtml = pjGrouped ? pjBacklogHTML() : '';
  let html = '';
  // Active task count header
  const countLabel = (searchQ || filterTag) ? `${filtered.length} of ${activeTasks.length}` : `${activeTasks.length}`;
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px;">
    <span style="font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.3px;">${countLabel} active task${activeTasks.length===1?'':'s'}</span>
  </div>`;

  if (filtered.length===0) {
    html += `<div style="text-align:center;padding:60px 20px;color:var(--sub);font-size:15px">
      ${searchQ||filterTag?'No tasks match your filter.':'🎉 All clear! Add something new.'}</div>`;
  } else if (sortOrder === 'tag' && !filterTag) {
    let cur = undefined;
    filtered.forEach(t => {
      const g = (t.tag || 'untagged').toLowerCase();
      if (g !== cur) { cur = g; html += `<div class="section-label" style="text-transform:capitalize">${g}</div>`; }
      html += taskCard(t);
    });
  } else {
    filtered.forEach(t => { html += taskCard(t); });
  }

  if (doneTasks.length > 0) {
    html += `<button class="done-toggle" onclick="doneExpanded=!doneExpanded;render()">
      <span class="done-toggle-label">Completed (${doneTasks.length})</span>
      <svg class="done-chevron ${doneExpanded?'open':''}" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>`;
    if (doneExpanded) doneTasks.forEach(t => { html += taskCard(t); });
  }
  if (pjGrouped && blDesktop()) {
    html = blKpis(activeTasks) + `<div class="bl-dash"><div class="bl-col glass-panel"><div class="bl-col-inner"><div class="pj-bighead">Everything else</div>${html}</div></div><div class="bl-col glass-panel"><div class="bl-col-inner">${pjHtml || '<div class="pj-bighead">Projects</div><div class="bl-empty">No open project tasks</div>'}</div></div></div>`;
  } else html = pjHtml + html;
  html += '<div style="height:16px"></div>';
  el.innerHTML = html;
  attachTaskEvents(el);
}

// ---- TODAY TAB ----
function renderToday(el, activeTasks, doneTasks) {
  const inToday = activeTasks.filter(t=>t.today);
  const doneToday = doneTasks.filter(t=>t.today);
  const staged = activeTasks.filter(t=>t.tomorrow);
  const total = inToday.length + doneToday.length;

  const toggle = `<div class="seg-ctrl day-seg">
    <button class="seg-btn ${laneView==='today'?'active':''}" onclick="laneView='today';render()">Today${total?` · ${total}`:''}</button>
    <button class="seg-btn ${laneView==='tomorrow'?'active':''}" onclick="laneView='tomorrow';render()">Tomorrow${staged.length?` · ${staged.length}`:''}</button>
  </div>`;

  if (laneView === 'tomorrow') {
    el.innerHTML = toggle + renderTomorrow(staged);
    attachTomorrowEvents(el);
    return;
  }

  // core = committed set (non-bonus); bonus = icing
  const coreUnfin = inToday.filter(t=>!t.bonus);
  const coreDone  = doneToday.filter(t=>!t.bonus);
  const bonusUnfin = inToday.filter(t=>t.bonus);
  const bonusDone  = doneToday.filter(t=>t.bonus);
  const coreTotal = coreUnfin.length + coreDone.length;
  const unlocked = coreComplete();
  // Denominator is the goal of 3 while working; only a genuinely-complete smaller set shows its own total.
  const target = unlocked ? Math.max(coreDone.length, coreTotal) : Math.max(TODAY_LIMIT, coreTotal);
  const pct = target>0 ? Math.round((coreDone.length/target)*100) : 0;
  const dateStr = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  let html = toggle + `<div class="today-date">${dateStr}</div>
    <div class="progress-wrap">
      <div class="progress-label"><span>${coreDone.length} of ${target} done</span><strong>${pct}%</strong></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>`;

  if (coreTotal===0 && bonusUnfin.length===0 && bonusDone.length===0) {
    html += `<div class="today-empty"><span class="emoji">🎯</span>Your focus set is empty.<br>Tap the <strong>+</strong> on up to <strong>3</strong> backlog tasks to load Today.</div>`;
  } else {
    // CORE
    if (coreUnfin.length > 0) {
      const locked = coreDone.length > 0;
      const slotsLeft = Math.max(0, TODAY_LIMIT - coreUnfin.length);
      html += locked
        ? `<div class="focus-hint locked">🔒 Finish your set to unlock new tasks</div>`
        : slotsLeft > 0
          ? `<div class="focus-hint">🎯 ${slotsLeft} focus slot${slotsLeft===1?'':'s'} left</div>`
          : `<div class="focus-hint full">🎯 Focus set full — heads down</div>`;
      html += `<div class="section-label">Up Next</div>`;
      coreUnfin.forEach(t => { html += todayCard(t, false); });
      if (coreDone.length>0) { html += `<div class="section-label">Done</div>`; coreDone.forEach(t => { html += todayCard(t, true); }); }
    } else if (coreDone.length > 0 && unlocked) {
      html += `<div class="win-banner">${IC_CHECKC}<span>${coreDone.length>=TODAY_LIMIT?'Daily 3 complete':'Focus set complete'}</span></div>`;
      html += `<div class="section-label">Core · done</div>`;
      coreDone.forEach(t => { html += todayCard(t, true); });
    } else if (coreDone.length > 0) {
      // Done so far, but a slot is open (e.g. you bailed one to swap) — keep the goal at 3.
      const openSlots = TODAY_LIMIT - coreDone.length;
      html += `<div class="focus-hint">🎯 ${coreDone.length} of ${TODAY_LIMIT} done — add ${openSlots} more to finish your set</div>`;
      html += `<div class="section-label">Done</div>`;
      coreDone.forEach(t => { html += todayCard(t, true); });
      html += `<button class="bonus-add-btn core-add-btn" data-core-add>＋ Add focus task</button>`;
    }
    // BONUS — shown once the core is cleared, or whenever icing exists
    if (unlocked || bonusUnfin.length || bonusDone.length) {
      html += `<div class="section-label bonus">STRETCH</div>`;
      if (!bonusUnfin.length && !bonusDone.length) {
        html += `<div class="today-empty" style="padding:22px 20px">Optional extras — pull anything from your backlog, no limit. Unfinished stretch tasks clear overnight.</div>`;
      } else {
        bonusUnfin.forEach(t => { html += bonusCard(t, false); });
        bonusDone.forEach(t => { html += bonusCard(t, true); });
      }
      html += `<button class="bonus-add-btn core-add-btn" data-bonus-add>＋ Add stretch task</button>`;
    }
  }
  html += '<div style="height:16px"></div>';
  el.innerHTML = html;
  attachTaskEvents(el);
}

  requestAnimationFrame(()=>ov.classList.add('visible'));

  ov.addEventListener('click', e => { if (e.target===ov) close(); });
  ov.querySelector('#tmr-done').addEventListener('click', close);
  ov.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', async e => {

  // Active-by-category
  const tagCounts = {};
  activeTasks.forEach(t => { const k=t.tag||'untagged'; tagCounts[k]=(tagCounts[k]||0)+1; });

  // Trend card: headline + delta + retimeable chart (line by default, bars optional)
  const flip = `

          <div class="kpi-num">${series.total}</div>

        <button class="${trendsView==='bars'?'on':''}" onclick="trendsView='bars';localStorage.setItem('trendsView','bars');render()">Bars</button>
      </div>

  let out = flip + `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${totalDone}</div><div class="stat-label">All-time completed</div></div>
      <div class="stat-card"><div class="stat-value">${activeTasks.length}</div><div class="stat-label">Open tasks</div></div>
    </div>`;

  if (donutSegs.length > 0) {
    out += `<div class="chart-card">
      <div class="chart-title">Completed by category</div>
      <div class="donut-row">
        ${buildDonutChart(donutSegs)}
        <div class="donut-legend">
          ${donutSegs.map(s=>`<div class="legend-item">
            <div class="legend-dot" style="background:${s.color}"></div>
            <span class="legend-label">${s.label}</span>
            <span class="legend-count">${s.count}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  }

  if (Object.keys(tagCounts).length > 0) {
    out += `<div class="chart-card">
      <div class="chart-title">Active by category</div>
      ${Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).map(([tag,count])=>`
        <div class="tag-stat">
          <span class="task-tag ${tagClass(tag)}" style="font-size:12px">${tag}</span>
          <span style="font-size:15px;font-weight:600;color:var(--accent)">${count}</span>
        </div>`).join('')}
    </div>`;
  }
  return out;
}

// ---- FOCUS STATS HELPERS ----
function focusCountForDay(key) { return focusLog[key] || 0; }
// "All-time completed" was reset to start Aug 31, 2026 — count completions on/after that
// (older bulk-imported checkoffs are excluded).
const ALLTIME_START = new Date(2026, 7, 31).getTime();
function allTimeCompleted() {
  return Object.values(completions).filter(iso => {
    const t = Date.parse(iso);
    return !isNaN(t) && t >= ALLTIME_START;
  }).length;
}
function dayKeyFromDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysHitThisMonth() {
  const now = new Date();
  const pre = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-`;
  return Object.entries(focusLog).filter(([k,c]) => k.startsWith(pre) && c >= FOCUS_GOAL).length;
}
function computeFocusStreak() {
  const dayMs = 86400000;
  const hit = (d) => focusCountForDay(dayKeyFromDate(d)) >= FOCUS_GOAL;
  let current = 0;
  let cursor = new Date();
  // an in-progress today that hasn't hit yet shouldn't break the streak
  if (!hit(cursor)) cursor = new Date(cursor.getTime() - dayMs);
  while (hit(cursor)) { current++; cursor = new Date(cursor.getTime() - dayMs); }
  // best run across all recorded hit-days
  const keys = Object.keys(focusLog).filter(k => focusLog[k] >= FOCUS_GOAL).sort();
  let best = 0, run = 0, prev = null;
  keys.forEach(k => {
    if (prev && (new Date(k+'T12:00:00') - new Date(prev+'T12:00:00')) === dayMs) run++; else run = 1;
    if (run > best) best = run;
    prev = k;
  });
  best = Math.max(best, current);
  return { current, best };
}
function heatmapMonthName(offset) {
  const b = new Date();
  const ref = new Date(b.getFullYear(), b.getMonth() + (offset||0), 1);
  return ref.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}
function buildMonthHeatmap(offset) {
  offset = offset || 0;
  const b = new Date();
  const ref = new Date(b.getFullYear(), b.getMonth() + offset, 1);
  const y = ref.getFullYear(), m = ref.getMonth();
  const isCurrentMonth = (y === b.getFullYear() && m === b.getMonth());
  const today = b.getDate();
  const startDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const dow = ['S','M','T','W','T','F','S'].map(x=>`<div class="hm-dow">${x}</div>`).join('');
  let cells = '';
  for (let i=0;i<startDow;i++) cells += `<div class="hm-cell blank"></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const c = focusCountForDay(key);
    const future = isCurrentMonth && d > today;
    const lvl = future ? 'future' : c>=FOCUS_GOAL ? 'hit' : c>0 ? 'partial' : 'none';
    const isToday = (isCurrentMonth && d===today) ? 'today' : '';
    cells += `<div class="hm-cell ${lvl} ${isToday}" title="${key}: ${c} task${c===1?'':'s'} done">` +
      `<span class="hm-date">${d}</span>${(c>0 && !future)?`<span class="hm-count">${c}</span>`:''}</div>`;
  }
  return `<div class="hm-grid">${dow}${cells}</div>`;
}
function getWeeklyCompletions(n) {
  const now = new Date();
  const mondayOffset = (now.getDay()+6)%7;
  const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()-mondayOffset);
  const buckets = [];
  for (let i=n-1;i>=0;i--) { const s=new Date(weekStart); s.setDate(weekStart.getDate()-i*7); buckets.push({start:s,count:0}); }
  Object.values(completions).forEach(iso => {
    const d = new Date(iso);
    for (let i=buckets.length-1;i>=0;i--) { if (d>=buckets[i].start) { buckets[i].count++; break; } }
  });
  return buckets.map((b,i)=>({count:b.count, label:`${b.start.getMonth()+1}/${b.start.getDate()}`, isCurrent:i===buckets.length-1}));
}
function buildWeeklyThroughput(weeks) {
  const W=320, H=120, padL=4, padR=4, padT=14, padB=18;
  const chartW=W-padL-padR, chartH=H-padT-padB, baseY=padT+chartH;
  const maxVal=Math.max(1, ...weeks.map(w=>w.count));
  const slot=chartW/weeks.length, barW=Math.max(4, slot*0.62);
  let bars='';
  weeks.forEach((w,i)=>{
    const x=padL+i*slot+(slot-barW)/2;
    const barH=w.count>0?Math.max(3,(w.count/maxVal)*chartH):2;
    const y=baseY-barH;
    const fill=w.isCurrent?'var(--chart-bar-today)':'var(--chart-bar)';
    const rad=Math.min(barW/2,2.5).toFixed(1);
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="${rad}" fill="${fill}"/>`;
    if (w.count>0) bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700" fill="var(--sub)" font-family="-apple-system,sans-serif">${w.count}</text>`;
    if (i%2===0 || i===weeks.length-1) bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="7" fill="var(--sub)" font-family="-apple-system,sans-serif" font-weight="${w.isCurrent?700:400}">${w.label}</text>`;
  });
  const baseline=`<line x1="${padL}" y1="${baseY.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${baseY.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">${baseline}${bars}</svg>`;
}

// ---- TRENDS: retimeable series (line) + year contribution grid ----
// Buckets real completions into the chosen window plus an equal prior window
// (for the vs-prior delta). Weekly buckets for 4W/12W, monthly for 6M/1Y.
function getRangeSeries(range) {
  const cfg = TRENDS_RANGES[range] || TRENDS_RANGES['12w'];
  const n = cfg.n;
  const now = new Date();
  const buckets = []; // 2n buckets, oldest first (prior window then current window)
  if (cfg.bucket === 'week') {
    const mondayOffset = (now.getDay()+6)%7;
    const ws = new Date(now.getFullYear(), now.getMonth(), now.getDate()-mondayOffset);
    for (let i=2*n-1; i>=0; i--) {
      const s = new Date(ws); s.setDate(ws.getDate()-i*7);
      const e = new Date(s); e.setDate(s.getDate()+7);
      buckets.push({ start:s, end:e, count:0, label:`${s.getMonth()+1}/${s.getDate()}` });
    }
  } else {
    for (let i=2*n-1; i>=0; i--) {
      const s = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const e = new Date(now.getFullYear(), now.getMonth()-i+1, 1);
      buckets.push({ start:s, end:e, count:0, label:s.toLocaleDateString('en-US',{month:'short'}) });
    }
  }
  Object.values(completions).forEach(iso => {
    const d = new Date(iso); if (isNaN(d)) return;
    if (d.getTime() < ALLTIME_START) return; // honor the Aug 31, 2026 reset — same as the all-time counter
    for (let i=0; i<buckets.length; i++) { if (d>=buckets[i].start && d<buckets[i].end) { buckets[i].count++; break; } }
  });
  const cur = buckets.slice(n), prev = buckets.slice(0, n);
  const total = cur.reduce((a,b)=>a+b.count,0);
  const prevTotal = prev.reduce((a,b)=>a+b.count,0);
  return { points: cur, total, prevTotal, cfg };
}
function trendsDeltaHTML(total, prevTotal, cfg) {
  const priorLabel = cfg.bucket==='week' ? `prior ${cfg.n}w` : `prior ${cfg.n}mo`;
  if (prevTotal <= 0) return total>0 ? `<div class="kpi-delta up">▲ new activity</div>` : '';
  const pct = Math.round(((total-prevTotal)/prevTotal)*100);
  const cls = pct>0?'up':pct<0?'down':'flat';
  const arr = pct>0?'▲':pct<0?'▼':'▬';
  return `<div class="kpi-delta ${cls}">${arr} ${Math.abs(pct)}% vs ${priorLabel}</div>`;
}
function buildTrendLine(points) {
  const W=320, H=132, padL=8, padR=8, padT=16, padB=18;
  const cw=W-padL-padR, ch=H-padT-padB, baseY=padT+ch;
  const vals = points.map(p=>p.count);
  const mx = Math.max(1, ...vals);
  const n = vals.length;
  const step = n>1 ? cw/(n-1) : 0;
  const pts = vals.map((v,i)=>[padL+i*step, baseY-(v/mx)*ch]);
  const line = pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const areapath = `M ${pts[0][0].toFixed(1)},${baseY} ` + pts.map(p=>`L ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') + ` L ${pts[n-1][0].toFixed(1)},${baseY} Z`;
  let svg = `<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--grid-line)" stroke-width="1"/>`;
  svg += `<defs><linearGradient id="trend-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0.02"/></linearGradient></defs>`;
  svg += `<path d="${areapath}" fill="url(#trend-fill)"/>`;
  svg += `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const lblStep = Math.max(1, Math.floor(n/6));
  pts.forEach((p,i)=>{ if (i%lblStep===0 || i===n-1) svg += `<text x="${p[0].toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="7.5">${points[i].label}</text>`; });
  svg += `<circle cx="${pts[n-1][0].toFixed(1)}" cy="${pts[n-1][1].toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">${svg}</svg>`;
}
function buildTrendBars(points) {
  const W=320, H=132, padL=8, padR=8, padT=16, padB=18;
  const cw=W-padL-padR, ch=H-padT-padB, baseY=padT+ch;
  const vals = points.map(p=>p.count);
  const mx = Math.max(1, ...vals);
  const n = vals.length;
  const slot = cw/n, barW = Math.max(4, slot*0.62);
  const lblStep = Math.max(1, Math.floor(n/6));
  let bars = `<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--grid-line)" stroke-width="1"/>`;
  points.forEach((p,i)=>{
    const x = padL + i*slot + (slot-barW)/2;
    const barH = p.count>0 ? Math.max(3,(p.count/mx)*ch) : 2;
    const y = baseY - barH;
    const fill = (i===n-1) ? 'var(--chart-bar-today)' : 'var(--chart-bar)';
    const rad = Math.min(barW/2,2.5).toFixed(1);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="${rad}" fill="${fill}"/>`;
    if (p.count>0) bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700">${p.count}</text>`;
    if (i%lblStep===0 || i===n-1) bars += `<text x="${(x+barW/2).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="7.5" font-weight="${i===n-1?700:400}">${p.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">${bars}</svg>`;
}
function openTrendsRangeMenu(ev) {

let openSwipeWrap = null;

function closeOpenSwipe() {
  if (!openSwipeWrap) return;
  const card = openSwipeWrap.querySelector('.task-card');
  if (card) { card.classList.remove('swiping'); card.style.transform=''; card.style.transition=''; }
  openSwipeWrap.classList.remove('swipe-live');
  openSwipeWrap = null;
}

function attachTaskEvents(el) {
  // Check ring — toggle done
  el.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      const pt = tasks.find(t => t.lineIndex === parseInt(btn.dataset.line));
      if (pt && pt.cardId && !pt.done && currentTab === 'backlog' && pjFind(pt.cardId)[1]) { pjOpen('act', pt.cardId); return; }
      toggleDone(btn.dataset.toggle, parseInt(btn.dataset.line));
    });
  });

  // Task body — open edit modal
  el.querySelectorAll('.task-body[data-edit-line]').forEach(body => {
    body.addEventListener('click', e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      const lineIdx = parseInt(body.dataset.editLine);
      const task = tasks.find(t=>t.lineIndex===lineIdx);
      if (task && task.cardId && pjFind(task.cardId)[1]) { pjOpen('card', task.cardId); return; }
      if (task) openEditModal(task);
    });
  });

  // Today toggle button
  el.querySelectorAll('[data-today-toggle]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      const title = btn.dataset.todayToggle;
      const task = tasks.find(t => t.title === title);
      if (task && task.today) { await bailFromToday(title); }
      else if (bonusUnlocked()) { const ok = await addBonus(title); if (ok) showToast('Added as stretch task'); }
      else { const ok = await addToToday(title); if (ok) showToast('Added to Today'); }
    });
  });

  // Tomorrow (moon) toggle on backlog cards — tap to unstage
  el.querySelectorAll('[data-tmr-toggle]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      await removeFromTomorrow(btn.dataset.tmrToggle);
      showToast('Unstaged from tomorrow');
    });
  });

  // Bonus (sparkle) toggle on backlog cards — tap to remove (no confirm, it's icing)
  el.querySelectorAll('[data-bonus-toggle]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      await removeFromToday(btn.dataset.bonusToggle);
      showToast('Removed from bonus');
    });
  });

  // Bonus remove (×) on Today bonus cards — no confirm
  el.querySelectorAll('[data-bonus-remove]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      await removeFromToday(btn.dataset.bonusRemove);
      showToast('Removed from bonus');
    });
  });

  // Add-bonus button (Today bonus section) → picker
  el.querySelectorAll('[data-bonus-add]').forEach(b => b.addEventListener('click', openBonusPicker));
  el.querySelectorAll('[data-core-add]').forEach(b => b.addEventListener('click', openCorePicker));

  // Today remove button
  el.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      await bailFromToday(btn.dataset.remove);
    });
  });

  // Delete action
  el.querySelectorAll('[data-delete-line]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      deleteTask(parseInt(btn.dataset.deleteLine), btn.dataset.deleteTitle);
    });
  });

  // Swipe-to-delete
  const OPEN_X = 76, THRESHOLD = 40;
  el.querySelectorAll('.swipe-wrap').forEach(wrap => {
    const card = wrap.querySelector('.task-card');
    if (!card) return;
    let startX=0, startY=0, dx=0, tracking=false, startedOpen=false, locked=false;
    const LOCK = 14;   // px of clearly-horizontal travel before a swipe engages (kills accidental touches)

    card.addEventListener('touchstart', e => {
      if (openSwipeWrap && openSwipeWrap!==wrap) closeOpenSwipe();
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
      startedOpen = openSwipeWrap===wrap;
      dx = startedOpen ? -OPEN_X : 0;
      tracking=true; locked=startedOpen;
      if (locked) { card.classList.add('swiping'); wrap.classList.add('swipe-live'); }
    }, {passive:true});

    card.addEventListener('touchmove', e => {
      if (!tracking) return;
      const mx=e.touches[0].clientX-startX, my=e.touches[0].clientY-startY;
      if (!locked) {
        if (Math.abs(my) > 10 && Math.abs(my) >= Math.abs(mx)) { tracking=false; return; }   // it's a scroll
        if (mx > -LOCK || Math.abs(mx) < Math.abs(my) * 1.6) return;                          // not a deliberate left swipe yet
        locked=true; card.classList.add('swiping'); wrap.classList.add('swipe-live');
      }

async function boot() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loading-screen"><div class="spinner"></div></div>`;

  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const urlError = params.get('error');
  const returnedState = params.get('state');
  // Capture shortcut action before any history.replaceState calls clear the URL
  const pendingAction = params.get('action');

  if (urlError) {
    localStorage.setItem('auth_error', params.get('error_description') || urlError);
    history.replaceState({}, '', location.pathname);
    render(); return;
  }

  if (code) {
    const ok = await exchangeCode(code, returnedState);
    if (!ok) { render(); return; }
  } else {
    accessToken = localStorage.getItem('ms_token');
    if (accessToken) {
      const ok = await refreshToken();
      if (!ok) accessToken = localStorage.getItem('ms_token');
    }
  }

  if (!accessToken) {
    // Clean the action param so it doesn't linger on the sign-in screen
    if (pendingAction) history.replaceState({}, '', location.pathname);
    render(); return;
  }

  try {
    await Promise.all([loadBacklog(), loadFocusHistory(), loadProjects()]);
    await maybeRolloverToday();
    render();
    // Handle iOS Shortcut: ?action=add → open Add Task modal.
    // Guard on accessToken: a 401 during load calls signOut() which sets
    // accessToken = null before we reach here, so we must not open the modal
    // on top of the auth screen.
    if (pendingAction === 'add' && accessToken) {
      history.replaceState({}, '', location.pathname); // clean the URL first
      setTimeout(() => openAddModal(), 200); // let the render paint before modal slides up
    }
  }
  catch(e) { console.error(e); render(); }
}

function pjCheckinItems() {
  const out = [];

async function pjSheetChange(e) {

async function pjUpload(cardId, file) {
  const safe = file.name.replace(/[\\/:*?"<>|#%]/g, '_');
  const path = `${PJ_ATTACH_DIR}/${cardId}/${Date.now().toString(36)}-${safe}`;
  const enc = path.split('/').map(encodeURIComponent).join('/');
  if (file.size <= 4e6) {
    const r = await graphFetch(`/me/drive/root:${enc}:/content`, { method: 'PUT', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file });
    if (!r || !r.ok) throw new Error('upload ' + (r && r.status)); return r.json();
  }
  const s = await graphFetch(`/me/drive/root:${enc}:/createUploadSession`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'rename' } }) });
  if (!s || !s.ok) throw new Error('session'); const { uploadUrl } = await s.json();
  const CH = 327680 * 10; let pos = 0, last = null;
  while (pos < file.size) { const end = Math.min(pos + CH, file.size);
    last = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${pos}-${end - 1}/${file.size}` }, body: file.slice(pos, end) });
    if (!last.ok && last.status !== 202) throw new Error('chunk'); pos = end; }
  return last.json();
}

  if (!rows.length) return h;
  const grp = (label, arr, cls = '') => arr.length ? `<div class="pj-sec ${cls}">${label} · ${arr.length}</div>` + arr.map(r => taskCard(r.t)).join('') : '';
  const onToday = rows.filter(r => r.today); const notToday = rows.filter(r => !r.today);
  const ready = notToday.filter(r => r.c.ready || pjDue(r.c)), rest = notToday.filter(r => !(r.c.ready || pjDue(r.c)));
  h += `<div class="pj-bighead">Projects<button onclick="switchTab('projects')">Board ›</button></div>`;
  h += grp('☀ On Today', onToday);
  h += grp('⚡ Ready for you', ready, 'ready');
  h += grp('▶ In progress', rest.filter(r => r.k === 'active'));
  h += grp('Up next', rest.filter(r => r.k === 'queue').sort((a, b) => b.i - a.i));
  h += grp('⏳ Waiting on others', rest.filter(r => r.k === 'waiting'));
  h += `<div class="pj-divider"></div>`;
  return h;
}
// extra bits for a project task row: stage pill + waiting/ready line
function pjTaskExtras(t) {
  const [p, c] = pjFind(t.cardId); if (!c) return { meta: '', line: '', parked: false, right: null };
  const w = c.waiting && !t.done, due = pjDue(c);
  const line = w ? (due ? `<div class="pj-wline due">⏰ Follow up${c.waiting.on ? ' with ' + pjh(c.waiting.on) : ''}</div>` : `<div class="pj-wline">Waiting on ${c.waiting.on ? pjh(c.waiting.on) : 'someone'}${c.waiting.until ? ' · follow up ' + pjFmtDay(c.waiting.until) : ''}</div>`)
    : (c.ready && !t.done ? '<div class="pj-wline rdy">⚡ Unblocked — your move</div>' : '');
  return { meta: pjStagePill(p, c) + `<span class="pj-badge">${pjh(p.name)}</span>` + (c.notes ? `<span class="pj-ind">${PJ_IC_NOTE}</span>` : '') + ((c.files || []).length ? `<span class="pj-ind">${PJ_IC_CLIP}${c.files.length}</span>` : ''),
    line, parked: w && !due, right: w ? `<button class="pj-back-btn" data-pj-unblock="${c.id}">${due ? 'Follow up' : 'It’s back'}</button>` : null };
}
document.addEventListener('click', e => {
  const t = e.target; if (!t.closest) return;
  if (t.closest('[data-pj-checkin]')) { e.stopPropagation(); return pjStartCheckin(); }
  const ub = t.closest('[data-pj-unblock]'); if (ub) { e.stopPropagation(); const [, c] = pjFind(ub.dataset.pjUnblock);
    if (pjDue(c)) return pjOpen('act', c.id);
    pjFlip(() => { pjUnblock(c); render(); }); pjSave(); showToast('⚡ Back in your court'); }
}, true);

// ---------- hooks into existing app functions ----------
const _pjToggleDone = toggleDone;
toggleDone = async function (title, lineIndex) {
  const t = tasks.find(x => x.lineIndex === lineIndex);
  const [, c] = t && t.cardId ? pjFind(t.cardId) : [null, null];
  if (c) { const completing = !t.done;
    pjLog(c, completing ? 'Completed' : 'Reopened', completing ? '✓' : '↺');
    if (completing) { c.ready = false; c.waiting = null; c.waitSince = null; if (currentTab !== 'projects') pjSinking.add(c.id); }
    pjSave(); }
  return _pjToggleDone(title, lineIndex);
};
const _pjDeleteTask = deleteTask;
deleteTask = async function (lineIndex, title) {
  const t = tasks.find(x => x.lineIndex === lineIndex);
  if (t && t.cardId) { const [p, c] = pjFind(t.cardId); if (c) { p.cards = p.cards.filter(x => x !== c); pj.tomb.push(c.id); pjTouch(p); pjSave(); } }
  return _pjDeleteTask(lineIndex, title);
};
const _pjEditTask = editTask;
editTask = async function (lineIndex, oldTitle, newTitle, newTag, newNotes) {
  const t = tasks.find(x => x.lineIndex === lineIndex);
  if (t && t.cardId) { const [, c] = pjFind(t.cardId); if (c && c.title !== newTitle) { c.title = newTitle; pjTouch(c); pjSave(); } newTag = 'project'; }
  return _pjEditTask(lineIndex, oldTitle, newTitle, newTag, newNotes);
};

// ---------- DESKTOP DASHBOARD (Backlog tab) ----------
const blMQ = window.matchMedia('(min-width: 860px)');
function blDesktop() { return blMQ.matches; }
blMQ.addEventListener('change', () => { if (accessToken && currentTab === 'backlog') render(); });
function ageChip(t) {
  const ms = createdMsOf(t); if (!ms || t.done) return '';
  const d = Math.floor((Date.now() - ms) / 864e5);
  const cls = d >= 30 ? 'old' : d >= 14 ? 'mid' : '';
  return `<span class="age-chip ${cls}" title="Created ${new Date(ms).toLocaleDateString()}">${d < 1 ? 'new' : d + 'd'}</span>`;
}
function blKpis(activeTasks) {
  const U = todayUnfinishedCount(), Dn = todayDoneCount(), goal = TODAY_LIMIT;
  const pct = Math.min(1, Dn / goal), C = 2 * Math.PI * 15;
  let ready = 0, waiting = 0, due = 0;
  pj.projects.forEach(p => p.cards.forEach(c => { const t = pjTask(c); if (!t || t.done) return;
    if (c.ready || pjDue(c)) ready++; if (c.waiting) { waiting++; if (pjDue(c)) due++; } }));
  const dated = activeTasks.filter(t => createdMsOf(t)).sort((a, b) => createdMsOf(a) - createdMsOf(b));
  const old = dated[0], oldD = old ? Math.floor((Date.now() - createdMsOf(old)) / 864e5) : 0;
  return `<div class="bl-kpis">
    <div class="bl-kpi glass-panel bl-kpi-ring" onclick="switchTab('today')"><svg width="70" height="70" viewBox="0 0 36 36"><defs><linearGradient id="blgr" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
      <circle cx="18" cy="18" r="15" fill="none" stroke="var(--tag-bg)" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="url(#blgr)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${pct * C} ${C}" transform="rotate(-90 18 18)"/></svg>
      <div><div class="l">Today’s focus</div><div class="v">${Dn} / ${goal}</div><div class="s">${U ? `${U} still open` : Dn >= goal ? 'Set complete 🤙' : 'Open slots — add some'}</div></div></div>
    <div class="bl-kpi glass-panel" ${ready ? 'data-pj-checkin' : ''}><div class="l">⚡ Ready for you</div><div class="v" style="color:var(--green)">${ready}</div><div class="s">${ready ? 'your move — tap to check in' : 'nothing came back yet'}</div></div>
    <div class="bl-kpi glass-panel"><div class="l">⏳ Waiting on others</div><div class="v" style="color:var(--orange)">${waiting}</div><div class="s">${due ? `<span style="color:var(--danger)">${due} follow-up${due > 1 ? 's' : ''} due</span>` : 'no follow-ups due'}</div></div>
    <div class="bl-kpi glass-panel" ${old ? `data-bl-open="${old.lineIndex}"` : ''}><div class="l">Oldest open</div><div class="v">${old ? oldD + 'd' : '—'}</div><div class="s bl-trunc">${old ? old.title.replace(/</g, '&lt;') : 'nothing dated'}</div></div>
  </div>`;
}
document.addEventListener('click', e => {
  const o = e.target.closest && e.target.closest('[data-bl-open]'); if (!o) return;
  const t = tasks.find(x => x.lineIndex === +o.dataset.blOpen); if (!t) return;
  if (t.cardId && pjFind(t.cardId)[1]) pjOpen('card', t.cardId); else openEditModal(t);
});

boot();
</script>
