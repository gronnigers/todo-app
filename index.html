// ============================================================
// TAG REGISTRY — canonical tag vocabulary, persisted in the md as an
// HTML comment `<!-- tags: a, b, c -->` right after `## Active`. The task
// parser ignores non-`- [ ]` lines, so it's invisible + safe. Lets tags
// exist (be added/removed) even when no task currently uses them.
// ============================================================
const REGISTRY_RE = /<!--\s*tags:\s*([^>]*?)\s*-->/i;
function defaultTags(){ return Object.keys(TAG_COLORS).filter(t => t !== 'personal'); }
function readTagRegistry(){
  const m = rawMd.match(REGISTRY_RE);
  if (!m) return null;
  return m[1].split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
}
function usedTags(){ return [...new Set(tasks.map(t=>t.tag).filter(Boolean).map(t=>t.toLowerCase()))]; }
function currentTagSet(){ return new Set([...(readTagRegistry() || defaultTags()), ...usedTags()]); }
function allTags(){ return [...currentTagSet()].sort(); }
function setTagRegistry(names){
  const line = `<!-- tags: ${names.join(', ')} -->`;
  const lines = rawMd.split('\n');
  const idx = lines.findIndex(l => REGISTRY_RE.test(l));
  if (idx !== -1) lines[idx] = line;
  else {
    const act = lines.findIndex(l => l.trim() === '## Active');
    if (act !== -1) lines.splice(act+1, 0, line); else lines.unshift(line);
  }
  rawMd = lines.join('\n');
}
async function addTagToRegistry(name){
  const set = currentTagSet();
  if (set.has(name)) return;
  set.add(name);
  setTagRegistry([...set].sort());
  parseTasks(); await saveBacklog();
}
async function renameTag(oldT, newT){
  const re = new RegExp(`\\(${escapeRe(oldT)}\\)(?=(?:\\s*\\[[^\\]]*\\])*\\s*$)`, 'i');
  rawMd = rawMd.split('\n').map(l => l.startsWith('- [') ? l.replace(re, `(${newT})`) : l).join('\n');
  const set = currentTagSet(); set.delete(oldT); set.add(newT);
  setTagRegistry([...set].sort());
  if (filterTag === oldT) filterTag = newT;
  parseTasks(); render(); await saveBacklog();
}
async function removeTag(t){
  const re = new RegExp(`\\s*\\(${escapeRe(t)}\\)(?=(?:\\s*\\[[^\\]]*\\])*\\s*$)`, 'i');
  rawMd = rawMd.split('\n').map(l => l.startsWith('- [') ? l.replace(re, '') : l).join('\n');
  const set = currentTagSet(); set.delete(t);
  setTagRegistry([...set].sort());
  if (filterTag === t) filterTag = null;
  parseTasks(); render(); await saveBacklog();
}

// ============================================================
// PKCE AUTH
// ============================================================
function base64urlEncode(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function generatePKCE() {
  const verifier = base64urlEncode(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = base64urlEncode(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  return { verifier, challenge };
}
async function login() {
  const { verifier, challenge } = await generatePKCE();
  const state = base64urlEncode(crypto.getRandomValues(new Uint8Array(16)));
  localStorage.setItem('pkce_verifier', verifier);
  localStorage.setItem('pkce_state', state);
  localStorage.setItem('auth_error', '');
  const p = new URLSearchParams({
    client_id: CONFIG.CLIENT_ID, response_type: 'code',
    redirect_uri: REDIRECT_URI, scope: CONFIG.SCOPES,
    code_challenge: challenge, code_challenge_method: 'S256', state
  });
  location.href = `https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/authorize?${p}`;
}
async function exchangeCode(code, returnedState) {
  const verifier = localStorage.getItem('pkce_verifier');
  const savedState = localStorage.getItem('pkce_state');
  if (!verifier) { localStorage.setItem('auth_error', 'PKCE verifier missing.'); return false; }
  if (savedState && returnedState && savedState !== returnedState) {
    localStorage.setItem('auth_error', 'State mismatch.'); return false;
  }
  try {
    const res = await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/token`, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: CONFIG.CLIENT_ID, grant_type: 'authorization_code',
        code, redirect_uri: REDIRECT_URI, code_verifier: verifier
      })
    });
    const data = await res.json();
    if (data.access_token) {
      accessToken = data.access_token;
      localStorage.setItem('ms_token', accessToken);
      if (data.refresh_token) localStorage.setItem('ms_refresh', data.refresh_token);
      localStorage.removeItem('pkce_verifier'); localStorage.removeItem('pkce_state');
      localStorage.setItem('auth_error', '');
      history.replaceState({}, '', location.pathname);
      return true;
    }
    localStorage.setItem('auth_error', data.error_description || data.error || JSON.stringify(data));
    return false;
  } catch(e) {
    localStorage.setItem('auth_error', 'Network error: ' + e.message); return false;
  }
}
async function refreshToken() {
  const rt = localStorage.getItem('ms_refresh');
  if (!rt) return false;
  const res = await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/token`, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CONFIG.CLIENT_ID, grant_type: 'refresh_token',
      refresh_token: rt, scope: CONFIG.SCOPES
    })
  });
  const data = await res.json();
  if (data.access_token) {
    accessToken = data.access_token;
    localStorage.setItem('ms_token', accessToken);
    if (data.refresh_token) localStorage.setItem('ms_refresh', data.refresh_token);
    return true;
  }
  return false;
}

// ============================================================
// GRAPH API
// ============================================================
async function graphFetch(url, opts = {}) {
  const res = await fetch('https://graph.microsoft.com/v1.0' + url, {
    ...opts, headers: { Authorization: 'Bearer ' + accessToken, ...(opts.headers || {}) }
  });
  if (res.status === 401) {
    const ok = await refreshToken();
    if (ok) return graphFetch(url, opts);
    signOut(); return null;
  }
  return res;
}

let lastSynced = null;
let syncError = null;

let backlogBase = null;   // the content we last loaded/saved — the merge base

async function loadBacklog() {
  syncError = null;
  const res = await graphFetch(CONFIG.FILE_PATH);
  if (!res) { syncError = 'Auth failed — signed out'; return; }
  if (!res.ok) {
    const body = await res.text().catch(()=>'');
    syncError = `Load failed: HTTP ${res.status} — ${body.slice(0,120)}`;
    showToast('⚠️ Could not load backlog (' + res.status + ')');
    return;
  }
  rawMd = await res.text();
  backlogBase = rawMd;
  lastSynced = new Date();
  parseTasks();
}

// ---- CONFLICT-SAFE MERGE ----
// The backlog file is written from several places (this app on each device, plus
// Dispatch/the backlog assistant). Before overwriting, we merge our changes onto
// whatever is newest so a stale copy can never silently wipe someone else's edit
// (e.g. notes just added on another device).
function taskKeyOf(line) {
  if (!/^- \[[ x]\] /.test(line)) return null;         // not a task line
  return line.replace(/^- \[[ x]\] /, '')
             .replace(/\s*\[[^\]]*\]/g, '')            // strip bracket flags
             .replace(/\s*\([A-Za-z][\w -]*\)\s*$/, '')      // strip trailing (tag)
             .trim();
}
function _keyCounts(lines) {
  const m = new Map();
  for (const l of lines) { const k = taskKeyOf(l); if (k) m.set(k, (m.get(k)||0)+1); }
  return m;
}
function mergeBacklog(base, ours, theirs) {
  const baseL = base.split('\n'), ourL = ours.split('\n'), theirL = theirs.split('\n');
  const baseC = _keyCounts(baseL), ourC = _keyCounts(ourL), theirC = _keyCounts(theirL);
  const safe = k => !!k && baseC.get(k) === 1 && (ourC.get(k) || 0) <= 1;  // unambiguous only
  const baseByKey = new Map(); baseL.forEach(l => { const k = taskKeyOf(l); if (k && baseC.get(k)===1) baseByKey.set(k, l); });
  const ourByKey  = new Map(); ourL.forEach(l => { const k = taskKeyOf(l); if (k && ourC.get(k)===1) ourByKey.set(k, l); });
  const removed = new Set([...baseByKey.keys()].filter(k => safe(k) && !ourByKey.has(k)));
  const result = [], consumed = new Set();
  for (const line of theirL) {
    const k = taskKeyOf(line);
    if (k === null) { result.push(line); continue; }               // headers/prose/blanks: keep theirs
    if (safe(k) && removed.has(k)) continue;                       // we deleted this task
    if (safe(k) && ourByKey.has(k)) {                              // task in both
      consumed.add(k);
      const ourLine = ourByKey.get(k), baseLine = baseByKey.get(k);
      result.push(ourLine !== baseLine ? ourLine : line);          // our edit wins; else keep theirs
    } else {
      result.push(line);                                           // untouched or ambiguous: keep theirs
    }
  }
  // tasks we created that don't exist in base or theirs yet
  const additions = [...ourByKey.entries()].filter(([k]) => ourC.get(k) === 1 && !baseC.has(k) && !theirC.has(k)).map(([,l]) => l);
  if (additions.length) {
    const idx = result.findIndex(l => l.trim() === '## Active');
    if (idx !== -1) result.splice(idx + 2, 0, ...additions); else result.push(...additions);
  }
  // Tag-registry comment is app-managed metadata: if WE changed it, our version wins
  // (a concurrent task-only write would otherwise carry theirs' stale registry through).
  const regOf = s => { const m = s.match(REGISTRY_RE); return m ? m[0] : null; };
  const baseReg = regOf(base), ourReg = regOf(ours);
  if (ourReg && ourReg !== baseReg) {
    const ri = result.findIndex(l => REGISTRY_RE.test(l));
    if (ri !== -1) result[ri] = ourReg;
    else { const a = result.findIndex(l => l.trim() === '## Active'); if (a !== -1) result.splice(a + 1, 0, ourReg); else result.unshift(ourReg); }
  }
  return result.join('\n');
}

async function loadStats() {
  try {
    const res = await graphFetch(CONFIG.STATS_PATH);
    if (res && res.ok) {
      gamifyData = await res.json();
    } else {
      gamifyData = null;
    }
  } catch(e) {
    console.error('Stats load error:', e);
    gamifyData = null;
  }
}

async function saveBacklog() {
  // Conflict-safe: re-read the newest copy and merge our changes onto it before
  // overwriting, so we never clobber edits (like notes) made elsewhere meanwhile.
  try {
    const cur = await graphFetch(CONFIG.FILE_PATH);
    if (cur && cur.ok) {
      const latest = await cur.text();
      if (backlogBase !== null && latest !== backlogBase && latest !== rawMd) {
        rawMd = mergeBacklog(backlogBase, rawMd, latest);
        parseTasks();
      }
    }
  } catch (e) { /* best-effort — fall through and still write */ }

  const res = await graphFetch(CONFIG.FILE_PATH, {
    method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: rawMd
  });
  if (res && !res.ok) {
    const body = await res.text().catch(()=>'');
    syncError = `Save failed: HTTP ${res.status} — ${body.slice(0,120)}`;
    showToast('⚠️ Save failed (' + res.status + ')');
  } else if (res && res.ok) {
    backlogBase = rawMd;
    lastSynced = new Date();
  }
}

async function manualRefresh() {
  showToast('Refreshing…');
  await Promise.all([loadBacklog(), loadFocusHistory(), loadProjects(), loadPrefs()]);
  await maybeRolloverToday();
  if (maybeBackfillFromDeck()) await saveBacklog();
  render();
  if (!syncError) showToast('✓ Synced');
}

// ============================================================
// PARSE
// ============================================================
function parseTasks() {
  tasks = [];
  let createdDirty = false;
  let completionsDirty = false;
  rawMd.split('\n').forEach((line, i) => {
    // Extract and strip all bracket metadata before parsing
    let createdTs = null, doneTs = null, notesRaw = null;
    const createdMatch = line.match(/\s*\[created:([^\]]+)\]/);
    if (createdMatch) createdTs = createdMatch[1];
    const doneMatch = line.match(/\s*\[done:([^\]]+)\]/);
    if (doneMatch) doneTs = doneMatch[1];
    const notesMatch = line.match(/\s*\[notes:([^\]]*)\]/);
    if (notesMatch) notesRaw = notesMatch[1];
    const cardMatch = line.match(/\[card:([^\]]+)\]/);
    const isFocus = /\[focus\]/.test(line);
    const isTomorrow = /\[tomorrow\]/.test(line);
    const isBonus = /\[bonus\]/.test(line);
    const isOnDeck = /\[ondeck\]/.test(line);
    const parkM = line.match(/\[park:(started|waiting):([^\]]+)\]/), waitM = line.match(/\[waiton:([^\]]*)\]/),
          attM = line.match(/\[att:([^\]]*)\]/),
          tdoM = line.match(/\[tdo:(\d{4}-\d{2}-\d{2}):(\d+)\]/),
          nudgeM = line.match(/\[nudge:(\d+)\]/), pnoteM = line.match(/\[pnote:([^\]]*)\]/), pingM = line.match(/\[pinged:([^\]]+)\]/);

    // Strip [created:...], [done:...], [notes:...], [tomorrow], [bonus], [ondeck] before main parse
    const cleanLine = line
      .replace(/\s*\[created:[^\]]+\]/g, '')
      .replace(/\s*\[done:[^\]]+\]/g, '')
      .replace(/\s*\[notes:[^\]]*\]/g, '')
      .replace(/\s*\[tomorrow\]/g, '')
      .replace(/\s*\[bonus\]/g, '')
      .replace(/\s*\[card:[^\]]+\]/g, '')
      .replace(/\s*\[focus\]/g, '')
      .replace(/\s*\[ondeck\]/g, '')
      .replace(/\s*\[(?:park|waiton|nudge|pnote|pinged|tdo|att):[^\]]*\]/g, '');

    let m = cleanLine.match(/^- \[( |x)\] (.+?)(?:\s+\(([A-Za-z0-9][\w -]*)\))?(\s+\[today(?::([^\]]+))?\])?$/);
    if (m && m[3] && /\s/.test(m[3]) && !(readTagRegistry() || []).includes(m[3].toLowerCase()) && !TAG_COLORS[m[3].toLowerCase()]) {   // "(Function Health)" etc. is part of the title, not a tag
      m = [...m]; m[2] = m[2] + ' (' + m[3] + ')'; m[3] = undefined;
    }
    if (m) {
      const title = m[2];
      // Store inline created timestamp
      if (createdTs && !created[title]) { created[title] = createdTs; createdDirty = true; }
      // Store inline done timestamp into completions
      if (doneTs && !completions[title]) { completions[title] = doneTs; completionsDirty = true; }
      const today = !!m[4];
      tasks.push({
        done: m[1]==='x', title, tag: m[3]||null,
        today,
        tomorrow: isTomorrow && !today,   // [tomorrow] staging (mutually exclusive with today)
        bonus: isBonus && today,          // [bonus] legacy icing task (retired — kept for old data)
        ondeck: isOnDeck && !today && !isTomorrow,  // [ondeck] queued overflow for today
        todayAt: m[5] ? new Date(m[5]) : null,
        lineIndex: i,
        notes: notesRaw !== null ? decodeNotes(notesRaw) : null,
        cardId: cardMatch ? cardMatch[1] : null,
        focus: isFocus, doneAt: doneTs || null,
        parked: parkM ? parkM[1] : null, parkedAt: parkM ? new Date(parkM[2]) : null,
        waitOn: waitM ? decodeNotes(waitM[1]) : '', nudge: nudgeM ? +nudgeM[1] : 5,
        pnote: pnoteM ? decodeNotes(pnoteM[1]) : '', pingedAt: pingM ? new Date(pingM[1]) : null,
        tdoDay: tdoM ? tdoM[1] : null, tdo: tdoM ? +tdoM[2] : null,
        files: attM ? attDecode(attM[1]) : []
      });
    }
  });
  if (createdDirty) saveCreated();
  if (completionsDirty) saveCompletions();
}

function todayAgeHours(task) {
  if (!task.today || !task.todayAt || task.done) return 0;
  return (Date.now() - task.todayAt.getTime()) / 3600000;
}
// Aging badge: how many full days a task has been sitting on Today (≥1 day only).
function ageBadge(task) {
  const days = Math.floor(todayAgeHours(task) / 24);
  if (days < 1) return '';
  const stale = days >= 2 ? 'stale' : '';
  return `<span class="age-badge ${stale}" title="On Today for ${days} day${days===1?'':'s'}">` +
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>` +
    `${days}d</span>`;
}

// ============================================================
// TOGGLE DONE — records timestamp
// ============================================================
let todayCelebrating = false;

async function clearTodayList() {
  const lines = rawMd.split('\n').map(l => l.replace(/\s+\[today(?::[^\]]+)?\]/, ''));
  rawMd = lines.join('\n');
  todayCelebrating = false;
  parseTasks(); render();
  await saveBacklog();
}

async function toggleDone(title, lineIndex) {
  const lines = rawMd.split('\n');
  let line = lines[lineIndex];
  if (!line) return;
  const marking = line.includes('- [ ]');
  const ts = new Date().toISOString();

  if (marking) {
    line = line.replace('- [ ]','- [x]');
    // Persist the completion timestamp INTO the file so stats are durable & sync.
    if (!/\[done:/.test(line)) line = line.trimEnd() + ` [done:${ts}]`;
    // Every completed task counts toward the day — whether or not it was ever on
    // the Today list. The [focus] stamp is what the stats derive from.
    if (!/\[focus\]/.test(line)) line = line.trimEnd() + ' [focus]';
    completions[title] = ts;
    bumpFocusToday(1);
  } else {
    line = line.replace('- [x]','- [ ]').replace(/\s*\[done:[^\]]*\]/,'').replace(/\s*\[focus\]/,'');
    delete completions[title];
    bumpFocusToday(-1);
  }
  lines[lineIndex] = line;
  rawMd = lines.join('\n');
  saveCompletions();

  parseTasks();
  // Once the focus 3 are cleared, slide in the next On Deck task (one at a time).
  maybeBackfillFromDeck();
  render();
  await saveBacklog();

  // Check if all today tasks are now complete — show celebration but don't auto-clear
  if (marking && !todayCelebrating) {
    const todayTasks = tasks.filter(t => t.today);
    if (todayTasks.length > 0 && todayTasks.every(t => t.done)) {
      todayCelebrating = true;
      render();
    }
  }
}

// ============================================================
// ADD TASK
// ============================================================
async function addTask(title, tag, notes) {
  const lines = rawMd.split('\n');
  const activeIdx = lines.findIndex(l => l.trim() === '## Active');
  const iso = new Date().toISOString();
  const notesFlag = notes ? ` [notes:${encodeNotes(notes)}]` : '';
  const base = tag ? `- [ ] ${title} (${tag})` : `- [ ] ${title}`;
  // Stamp [created:] inline so creation order persists in the file and syncs across devices.
  const newLine = `${base} [created:${iso}]${notesFlag}`;
  if (activeIdx !== -1) lines.splice(activeIdx + 2, 0, newLine);
  else lines.push(newLine);
  rawMd = lines.join('\n');
  if (!created[title]) { created[title] = iso; saveCreated(); }
  parseTasks(); render();
  await saveBacklog();
}

// ============================================================
// EDIT TASK
// ============================================================
async function editTask(lineIndex, oldTitle, newTitle, newTag, newNotes) {
  const lines = rawMd.split('\n');
  const line = lines[lineIndex];
  if (!line) return;
  const isDone = line.includes('- [x]');
  // Preserve ALL existing bracket metadata (created/done/today/tomorrow/bonus);
  // only the title, tag, and notes are being rewritten here.
  const keptFlags = (line.match(/\s*\[(?:created|done|today|tomorrow|bonus|card|focus|ondeck|park|waiton|nudge|pnote|pinged|tdo|att)(?::[^\]]*)?\]/g) || []).join('');
  const notesFlag = newNotes ? ` [notes:${encodeNotes(newNotes)}]` : '';
  const box = isDone ? '- [x]' : '- [ ]';
  const tagPart = newTag ? ` (${newTag})` : '';
  lines[lineIndex] = `${box} ${newTitle}${tagPart}${notesFlag}${keptFlags}`;
  rawMd = lines.join('\n');

  // Update completions key if title changed
  if (oldTitle !== newTitle && completions[oldTitle]) {
    completions[newTitle] = completions[oldTitle];
    delete completions[oldTitle];
    saveCompletions();
  }
  // Update created key if title changed
  if (oldTitle !== newTitle && created[oldTitle]) {
    created[newTitle] = created[oldTitle];
    delete created[oldTitle];
    saveCreated();
  }

  parseTasks(); render();
  await saveBacklog();
}

// ============================================================
// DELETE TASK
// ============================================================
async function deleteTask(lineIndex, title) {
  const gone = tasks.find(t => t.lineIndex === lineIndex);
  if (gone && gone.files && gone.files.length) gone.files.forEach(f => graphFetch(`/me/drive/items/${f.id}`, { method: 'DELETE' }).catch(() => {}));
  const lines = rawMd.split('\n');
  lines.splice(lineIndex, 1);
  rawMd = lines.join('\n');
  if (title) { delete completions[title]; saveCompletions(); }
  if (title) { delete created[title]; saveCreated(); }
  parseTasks(); render();
  showToast('Task deleted');
  await saveBacklog();
}

function showModal() {
  const overlay = document.getElementById('modal');
  overlay.classList.remove('hidden');
  // Trigger animation on next frame
  requestAnimationFrame(() => {
    overlay.classList.add('visible');
    setTimeout(() => document.getElementById('modal-task-title').focus(), 150);
  });
  // Adjust for virtual keyboard on iOS
  if (window.visualViewport) {
    const adjustModal = () => {
      const vv = window.visualViewport;
      const keyboardHeight = window.innerHeight - vv.height;
      overlay.style.paddingTop = keyboardHeight > 100
        ? `${Math.max(20, vv.offsetTop + 40)}px`
        : '';
    };
    window.visualViewport.addEventListener('resize', adjustModal);
    overlay._vvCleanup = () => window.visualViewport.removeEventListener('resize', adjustModal);
  }
}
function closeModal() {
  const overlay = document.getElementById('modal');
  overlay.classList.remove('visible');
  if (overlay._vvCleanup) { overlay._vvCleanup(); overlay._vvCleanup = null; }
  overlay.style.paddingTop = '';
  setTimeout(() => overlay.classList.add('hidden'), 200);
}
function submitModal() {
  const title = document.getElementById('modal-task-title').value.trim();

    editTask(editingTask.lineIndex, editingTask.title, title, tag, notes);
    showToast('Task saved');

}
function deleteFromModal() {

}

function getCompletionsThisMonth() {
  const now = new Date();
  const yr = now.getFullYear(), mo = now.getMonth();
  return Object.entries(completions).filter(([,iso]) => {
    const d = new Date(iso);
    return d.getFullYear() === yr && d.getMonth() === mo;
  });
}
function getCompletionsByDay() {
  const now = new Date();
  const yr = now.getFullYear(), mo = now.getMonth();
  const daysInMonth = new Date(yr, mo+1, 0).getDate();
  const byDay = new Array(daysInMonth+1).fill(0);
  Object.values(completions).forEach(iso => {
    const d = new Date(iso);
    if (d.getFullYear()===yr && d.getMonth()===mo) byDay[d.getDate()]++;
  });
  return { byDay, daysInMonth };
}

// ============================================================
// SVG CHARTS
// ============================================================
// Radial progress ring for the monthly score card
function buildProgressRing(value, goal) {
  const pct = Math.max(0, Math.min(1, goal > 0 ? value / goal : 0));
  const r = 62, cx = 74, cy = 74, sw = 12, circ = 2 * Math.PI * r;
  const dash = (pct * circ).toFixed(2);
  return `<svg viewBox="0 0 148 148" xmlns="http://www.w3.org/2000/svg" style="width:148px;height:148px;transform:rotate(-90deg)">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#007aff"/><stop offset="1" stop-color="#5ac8fa"/>
      </linearGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--progress-bg)" stroke-width="${sw}"/>
    ${pct > 0 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#ringGrad)" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${dash} ${(circ - pct * circ).toFixed(2)}"/>` : ''}
  </svg>`;
}

function buildDonutChart(segments) {
  // segments: [{label, count, color}]
  const total = segments.reduce((s,x) => s+x.count, 0);
  const r = 36, cx = 50, cy = 50, sw = 11, circ = 2 * Math.PI * r;
  if (total === 0) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="donut-svg">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--donut-bg)" stroke-width="${sw}"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="var(--sub)" font-family="-apple-system,sans-serif">No data</text>
    </svg>`;
  }
  const visible = segments.filter(s=>s.count>0);
  const gap = visible.length > 1 ? 2.5 : 0;   // 2px surface gap between fills
  let accum = 0;
  const arcs = visible.map(s => {
    const len = (s.count / total) * circ;
    const drawLen = Math.max(len - gap, 0.6);
    const offset = circ / 4 - accum;
    accum += len;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}"
      stroke-width="${sw}" stroke-dasharray="${drawLen.toFixed(2)} ${(circ-drawLen).toFixed(2)}"
      stroke-dashoffset="${offset.toFixed(2)}"/>`;
  }).join('');
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="donut-svg">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--donut-bg)" stroke-width="${sw}"/>
    ${arcs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="17" font-weight="800" fill="var(--text)" font-family="-apple-system,sans-serif">${total}</text>
    <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="7" fill="var(--sub)" font-family="-apple-system,sans-serif" letter-spacing="0.5">DONE</text>
  </svg>`;
}

function buildBarChart(byDay, daysInMonth) {
  const today = new Date().getDate();
  const W = 320, H = 118, padL = 4, padR = 4, padT = 12, padB = 18;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const vals = byDay.slice(1, daysInMonth+1);
  const maxVal = Math.max(1, ...vals);
  const barSlot = chartW / daysInMonth;
  const barW = Math.max(3, barSlot * 0.68);
  const baseY = padT + chartH;
  // average completions per elapsed day this month
  const elapsed = Math.min(today, daysInMonth);
  const totalDone = vals.reduce((a,b)=>a+b,0);
  const avg = elapsed > 0 ? totalDone / elapsed : 0;
  const avgY = baseY - Math.min(1, avg/maxVal) * chartH;

  let bars = '';
  for (let d = 1; d <= daysInMonth; d++) {
    const val = byDay[d] || 0;
    const x = padL + (d-1)*barSlot + (barSlot - barW)/2;
    const barH = val > 0 ? Math.max(3, (val/maxVal)*chartH) : 2;
    const y = baseY - barH;
    const isToday = d === today;
    const fill = isToday ? 'var(--chart-bar-today)' : 'var(--chart-bar)';
    const rad = Math.min(barW/2, 2.5).toFixed(1);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="${rad}" fill="${fill}"/>`;
    if (d===1 || d===10 || d===20 || d===daysInMonth || d===today) {
      bars += `<text x="${(x+barW/2).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="7.5" fill="var(--sub)" font-family="-apple-system,sans-serif" font-weight="${isToday?700:400}">${d}</text>`;
    }
  }
  const baseline = `<line x1="${padL}" y1="${baseY.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${baseY.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>`;
  const avgLine = avg > 0
    ? `<line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${avgY.toFixed(1)}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
       <text x="${padL}" y="${(avgY-3).toFixed(1)}" text-anchor="start" font-size="7" fill="var(--sub)" font-family="-apple-system,sans-serif">avg ${avg.toFixed(1)}/day</text>`
    : '';
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">${baseline}${bars}${avgLine}</svg>`;
}

function render() {
  const app = document.getElementById('app');
  if (!accessToken) { renderAuth(app); return; }
  renderMain(app);

// ---- BACKLOG TAB ----
function renderBacklog(el, activeTasks, doneTasks) {
  const pjGrouped = !searchQ && !filterTag;
  const parkedAll = activeTasks.filter(t => t.parked);
  if (!parkedAll.length && blView === 'parked') blView = 'active';
  activeTasks = activeTasks.filter(t => !t.parked);
  let filtered = pjGrouped ? activeTasks.filter(t => !(t.cardId && pjFind(t.cardId)[1])) : activeTasks;
  if (filterTag) filtered = filtered.filter(t => (t.tag||'').toLowerCase() === filterTag);
  if (searchQ) filtered = filtered.filter(t=>t.title.toLowerCase().includes(searchQ.toLowerCase()));
  // Sort by real creation date. Oldest = earliest first; newest = latest first.
  // Tiebreak by file position so identical/undated timestamps stay stable.
  filtered = [...filtered].sort((a, b) => {
    if (sortOrder === 'tag') {
      const ta = a.tag ? a.tag.toLowerCase() : '￿', tb = b.tag ? b.tag.toLowerCase() : '￿';
      if (ta !== tb) return ta < tb ? -1 : 1;
      return (createdMsOf(a) - createdMsOf(b)) || (a.lineIndex - b.lineIndex);
    }
    const diff = (createdMsOf(a) - createdMsOf(b)) || (a.lineIndex - b.lineIndex);
    return sortOrder === 'newest' ? -diff : diff;
  });

  const pjHtml = pjGrouped ? pjBacklogHTML() : '';
  let html = '';
  // Active task count header
  const countLabel = (searchQ || filterTag) ? `${filtered.length} of ${activeTasks.length}` : `${activeTasks.length}`;
  if (parkedAll.length) html += `<div class="seg-ctrl bl-park-seg">
      <button class="seg-btn ${blView==='active'?'active':''}" onclick="blSetView('active')">Active · ${activeTasks.length}</button>
      <button class="seg-btn ${blView==='parked'?'active':''}" onclick="blSetView('parked')">Parked · ${parkedAll.length}${parkedAll.some(parkDue) ? '<span class="pk-dot"></span>' : ''}</button></div>`;
  if (blView === 'parked') {
    let P = parkedAll;
    if (filterTag) P = P.filter(t => (t.tag||'').toLowerCase() === filterTag);
    if (searchQ) P = P.filter(t => t.title.toLowerCase().includes(searchQ.toLowerCase()));
    html += parkedViewHTML(P);
  } else {
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px;">
    <span style="font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.3px;">${countLabel} active task${activeTasks.length===1?'':'s'}</span>
  </div>`;

  if (filtered.length===0) {
    html += `<div style="text-align:center;padding:60px 20px;color:var(--sub);font-size:15px">
      ${searchQ||filterTag?'No tasks match your filter.':'🎉 All clear! Add something new.'}</div>`;
  } else if (sortOrder === 'tag' && !filterTag) {
    let cur = undefined;
    filtered.forEach(t => {
      const g = (t.tag || 'untagged').toLowerCase();
      if (g !== cur) { cur = g; html += `<div class="section-label" style="text-transform:capitalize">${g}</div>`; }
      html += taskCard(t);
    });
  } else {
    filtered.forEach(t => { html += taskCard(t); });
  }

  if (doneTasks.length > 0) {
    html += `<button class="done-toggle" onclick="doneExpanded=!doneExpanded;render()">
      <span class="done-toggle-label">Completed (${doneTasks.length})</span>
      <svg class="done-chevron ${doneExpanded?'open':''}" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>`;
    if (doneExpanded) doneTasks.forEach(t => { html += taskCard(t); });
  }
  }
  const eeBlock = `<div class="pj-bighead pj-collapse-head" data-ee-collapse><span class="pj-chev ${eeCollapsed ? '' : 'open'}">›</span>To Do List <span class="pj-hcount">${filtered.length}</span></div>` + (eeCollapsed ? '' : html);
  if (pjGrouped && blDesktop()) {
    const colE = `<div class="bl-col glass-panel"><div class="bl-col-inner">${eeBlock}</div></div>`;
    const colP = `<div class="bl-col glass-panel"><div class="bl-col-inner">${pjCheckinBar()}${pjHtml || '<div class="pj-bighead">Projects</div><div class="bl-empty">No open project tasks</div>'}</div></div>`;
    html = blKpis(activeTasks) + `<div class="bl-dash">${pjOnTop ? colP + colE : colE + colP}</div>`;
  } else if (pjGrouped) {
    html = pjCheckinBar() + (pjOnTop ? pjHtml + (pjHtml ? '<div class="pj-divider"></div>' : '') + eeBlock : eeBlock + (pjHtml ? '<div class="pj-divider"></div>' + pjHtml : ''));
  }
  html += '<div style="height:16px"></div>';
  el.innerHTML = html;
  attachTaskEvents(el);
  el.querySelectorAll('[data-pk-ping]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); parkPinged(b.dataset.pkPing.split(',').map(Number)); }));
}

// ============================================================
// PARKING — the Waiting room. A task can be parked as "started" (partway done) or
// "waiting" on someone/something. Parked tasks leave Today/Tomorrow/On Deck and live
// in Backlog → Parked, grouped by who you're waiting on, with a nudge after N days.
// Stored inline on the backlog.md line: [park:kind:ISO] [waiton:x] [nudge:n] [pnote:x] [pinged:ISO]
// ============================================================
let blView = 'active';
function blSetView(v) { blView = v; const y = window.scrollY; render(); window.scrollTo(0, y); }
function parkDays(t) { const from = t.pingedAt || t.parkedAt; return from && !isNaN(from) ? Math.max(0, Math.floor((Date.now() - from) / 864e5)) : 0; }
function parkAge(t) { return t.parkedAt && !isNaN(t.parkedAt) ? Math.max(0, Math.floor((Date.now() - t.parkedAt) / 864e5)) : 0; }
function parkDue(t) { return !t.done && t.parked === 'waiting' && t.nudge > 0 && parkDays(t) >= t.nudge; }
function parkLine(t) {
  const d = parkAge(t), age = d === 0 ? 'today' : d + 'd';
  const chip = t.parked === 'waiting' ? `⏳ ${t.waitOn ? 'Waiting on ' + pjh(t.waitOn) : 'Waiting'} · ${age}` : `🚧 Started · ${age}`;
  return `${t.pnote ? `<div class="pk-note">${pjh(t.pnote)}</div>` : ''}<div class="pk-chips"><span class="pk-chip ${parkDue(t) ? 'due' : ''}">${chip}</span></div>`;
}
function parkedViewHTML(P) {
  if (!P.length) return `<div class="bl-empty" style="padding:40px 16px;text-align:center;color:var(--sub)">Nothing parked here.</div>`;
  const groups = new Map();
  P.forEach(t => { const k = t.parked === 'started' ? '\u0000started' : (t.waitOn || '').toLowerCase();
    if (!groups.has(k)) groups.set(k, { label: t.parked === 'started' ? 'Started' : (t.waitOn || 'something'), kind: t.parked, items: [] }); groups.get(k).items.push(t); });
  const arr = [...groups.values()].sort((a, b) => (a.kind === 'started') - (b.kind === 'started') || Math.max(...b.items.map(parkDays)) - Math.max(...a.items.map(parkDays)));
  return arr.map(g => { g.items.sort((a, b) => (a.parkedAt || 0) - (b.parkedAt || 0));
    const due = g.items.filter(parkDue), d = Math.max(...g.items.map(parkDays));
    return `<div class="section-label pk-head"><span>${g.kind === 'started' ? '🚧 Started' : '⏳ ' + pjh(g.label)}</span>${due.length ? `<button class="pk-ping" data-pk-ping="${due.map(t => t.lineIndex).join(',')}" title="Tap once you've followed up — resets the nudge">${d}d · ping?</button>` : ''}</div>` + g.items.map(taskCard).join(''); }).join('')
    + `<div class="pk-hint">${matchMedia('(hover: none)').matches ? 'Swipe right on a parked task to unpark it, or tap it for options.' : 'Click a parked task for options.'}</div>`;
}
function parkRecent() {
  const s = new Map(); const add = x => { if (x && !s.has(x.toLowerCase())) s.set(x.toLowerCase(), x); };
  tasks.filter(t => !t.done && t.parked === 'waiting').forEach(t => add(t.waitOn));
  try { JSON.parse(localStorage.getItem('dz_waiton_recent') || '[]').forEach(add); } catch (e) {}
  return [...s.values()].slice(0, 8);
}
function parkRemember(w) { try { const a = JSON.parse(localStorage.getItem('dz_waiton_recent') || '[]').filter(x => x.toLowerCase() !== w.toLowerCase()); a.unshift(w); localStorage.setItem('dz_waiton_recent', JSON.stringify(a.slice(0, 12))); } catch (e) {} }
// write (or clear, when p is null) the park tokens on one backlog line
async function setPark(lineIndex, p) {
  const lines = rawMd.split('\n'); let l = lines[lineIndex]; if (l == null) return;
  const t = tasks.find(x => x.lineIndex === lineIndex);
  l = l.replace(/\s*\[(?:park|waiton|nudge|pnote|pinged):[^\]]*\]/g, '');
  if (p) {
    const since = p.keepSince && t && t.parkedAt && !isNaN(t.parkedAt) ? t.parkedAt.toISOString() : new Date().toISOString();
    l = l.replace(/\s*\[today(?::[^\]]+)?\]/, '').replace(/\s*\[tomorrow\]/, '').replace(/\s*\[ondeck\]/, '').trimEnd();
    l += ` [park:${p.kind}:${since}]`;
    if (p.kind === 'waiting') { if (p.waitOn) l += ` [waiton:${encodeNotes(p.waitOn)}]`; l += ` [nudge:${p.nudge ?? 5}]`; }
    if (p.note) l += ` [pnote:${encodeNotes(p.note)}]`;
    if (p.pinged) l += ` [pinged:${p.pinged}]`;
  }
  lines[lineIndex] = l; rawMd = lines.join('\n'); parseTasks();
  const y = window.scrollY; render(); window.scrollTo(0, y);
  await saveBacklog();
}
function parkModal(inner) {
  const ov = document.createElement('div'); ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal pk-modal">${inner}</div>`;
  const close = () => { ov.classList.remove('visible'); setTimeout(() => ov.remove(), 200); };
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  document.body.appendChild(ov); requestAnimationFrame(() => ov.classList.add('visible'));
  return { ov, close };
}
function openParkSheet(task) {
  const editing = !!task.parked;
  let kind = task.parked || 'waiting', nudge = task.parked ? task.nudge : 5;
  const recent = parkRecent();
  const { ov, close } = parkModal(`
    <h2>${editing ? 'Edit park' : 'Park'} <span class="pk-tt">“${pjh(task.title)}”</span></h2>
    <div class="pk-sub">${task.today || task.tomorrow || task.ondeck ? 'It leaves Today and frees the slot. ' : ''}You'll find it under Backlog → Parked.</div>
    <div class="pk-opts">
      <button class="pk-opt" data-k="started"><span class="ic">🚧</span><span>Started<small>I'm partway through</small></span></button>
      <button class="pk-opt" data-k="waiting"><span class="ic">⏳</span><span>Waiting on…<small>someone or something else</small></span></button>
    </div>
    <div class="pk-wait">
      ${recent.length ? `<div class="pk-lbl">Recent</div><div class="pk-chips2">${recent.map(r => `<button class="pk-c" data-who="${pjh(r)}">${pjh(r)}</button>`).join('')}</div>` : ''}
      <input type="text" class="pk-who" placeholder="Who or what? (HOA, lender, a refund…)" value="${pjh(task.waitOn || '')}">
      <div class="pk-lbl">Nudge me after</div>
      <div class="pk-chips2 pk-nudge">${[[3, '3 days'], [5, '5 days'], [7, '1 week'], [0, 'Never']].map(([v, l]) => `<button class="pk-c" data-n="${v}">${l}</button>`).join('')}</div>
    </div>
    <input type="text" class="pk-note-in" placeholder="Note: where you left off (optional)" value="${pjh(task.pnote || '')}">
    <div class="modal-btns"><button class="btn-cancel">Cancel</button><button class="btn-primary">${editing ? 'Save' : 'Park'}</button></div>`);
  const who = ov.querySelector('.pk-who');
  const sync = () => {
    ov.querySelectorAll('.pk-opt').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
    ov.querySelector('.pk-wait').style.display = kind === 'waiting' ? '' : 'none';
    ov.querySelectorAll('.pk-nudge .pk-c').forEach(b => b.classList.toggle('on', +b.dataset.n === nudge));
    ov.querySelectorAll('[data-who]').forEach(b => b.classList.toggle('on', b.dataset.who.toLowerCase() === who.value.trim().toLowerCase()));
  };
  ov.querySelectorAll('.pk-opt').forEach(b => b.onclick = () => { kind = b.dataset.k; sync(); if (kind === 'waiting' && !who.value) who.focus(); });
  ov.querySelectorAll('[data-who]').forEach(b => b.onclick = () => { who.value = b.dataset.who; sync(); });
  ov.querySelectorAll('.pk-nudge .pk-c').forEach(b => b.onclick = () => { nudge = +b.dataset.n; sync(); });
  who.addEventListener('input', sync);
  ov.querySelector('.btn-cancel').onclick = close;
  ov.querySelector('.btn-primary').onclick = async () => {
    const w = who.value.trim(), note = ov.querySelector('.pk-note-in').value.trim();
    if (kind === 'waiting' && w) parkRemember(w);
    close();
    await setPark(task.lineIndex, { kind, waitOn: kind === 'waiting' ? w : '', nudge, note, keepSince: editing, pinged: editing && task.pingedAt ? task.pingedAt.toISOString() : null });
    showToast(editing ? 'Park updated' : kind === 'waiting' ? `⏸ Parked${w ? ' · waiting on ' + w : ''}` : '⏸ Parked · started');
  };
  sync();
}
function parkFromModal() { const t = editingTask; if (!t) return; closeModal(); setTimeout(() => openParkSheet(t), 220); }
async function unparkTask(t, msg) { await setPark(t.lineIndex, null); showToast(msg || '↩ Back in your Backlog'); }
async function parkPinged(lineIdxs) {
  const now = new Date().toISOString();
  for (const li of lineIdxs) { const t = tasks.find(x => x.lineIndex === li); if (t && t.parked) await setPark(li, { kind: t.parked, waitOn: t.waitOn, nudge: t.nudge, note: t.pnote, keepSince: true, pinged: now }); }
  showToast('👍 Nudge reset. I\'ll check again later');
}
function openParkActions(task) {
  const d = parkAge(task), due = parkDue(task);
  const { ov, close } = parkModal(`
    <h2 class="pk-tt2">${pjh(task.title)}</h2>
    <div class="pk-sub">${task.parked === 'waiting' ? '⏳ Waiting' + (task.waitOn ? ' on <b>' + pjh(task.waitOn) + '</b>' : '') : '🚧 Started'} · parked ${d === 0 ? 'today' : d + ' day' + (d === 1 ? '' : 's')}${due ? ' · <b style="color:var(--orange)">time to ping</b>' : ''}</div>
    ${task.pnote ? `<div class="pk-quote">“${pjh(task.pnote)}”</div>` : ''}
    <div class="modal-btns"><button class="btn-cancel" data-a="unpark">Unpark</button><button class="btn-primary" data-a="today">→ Today</button></div>
    <div class="pk-acts">
      ${task.parked === 'waiting' ? '<button data-a="ping">👍 Still waiting · I followed up</button>' : ''}
      <button data-a="edit">✏️ Change reason or note</button>
      <button data-a="task">📝 Edit task</button>
      <button data-a="done">✓ Mark done</button>
    </div>`);
  ov.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const a = b.dataset.a; close();
    if (a === 'unpark') return unparkTask(task);
    if (a === 'ping') return parkPinged([task.lineIndex]);
    if (a === 'edit') return setTimeout(() => openParkSheet(task), 220);
    if (a === 'task') return setTimeout(() => openEditModal(task), 220);
    if (a === 'done') return toggleDone(task.title, task.lineIndex);
    if (a === 'today') {
      await setPark(task.lineIndex, null);
      if (canAddToToday().ok) { if (await addToToday(task.title)) showToast('→ Back on Today'); }
      else if (await addToDeck(task.title)) showToast('Focus set is full, so it\'s queued on deck');
    }
  });
}

// ---- "Daily 3 done" celebration card ----
function winCard(doneN, deckN) {
  const st = computeFocusStreak().current, today = focusCountForDay(localDayKey());
  const title = doneN >= TODAY_LIMIT ? `Daily ${TODAY_LIMIT} done` : 'Focus set complete';
  const bits = [st >= 1 ? `🔥 ${st}-day streak` : '', today > TODAY_LIMIT ? `${today} done today` : '',
    deckN ? `${deckN} stretch task${deckN === 1 ? '' : 's'} to go` : 'Take the win 🤙'].filter(Boolean);
  return `<div class="win-card"><div class="win-badge">${fxRing(58, 7, TODAY_LIMIT)}<span class="win-ck">✓</span></div>
    <div class="win-txt"><div class="win-t">${title}</div><div class="win-s">${bits.join(' · ')}</div></div></div>`;
}


// ============================================================

const IC_CLIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';

function attEncode(files) { return files.filter(f => !f.busy).map(f => [f.id, encodeNotes(String(f.name).replace(/[|;]/g, '_')), (f.type || '').replace(/[|;\]]/g, '')].join('|')).join(';'); }

async function driveUpload(dir, file) {
  const safe = file.name.replace(/[\\/:*?"<>|#%]/g, '_');

  if (file.size <= 4e6) {
    const r = await graphFetch(`/me/drive/root:${enc}:/content`, { method: 'PUT', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file });
    if (!r || !r.ok) throw new Error('upload ' + (r && r.status)); return r.json();
  }
  const s = await graphFetch(`/me/drive/root:${enc}:/createUploadSession`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'rename' } }) });
  if (!s || !s.ok) throw new Error('session'); const { uploadUrl } = await s.json();
  const CH = 327680 * 10; let pos = 0, last = null;
  while (pos < file.size) { const end = Math.min(pos + CH, file.size);
    last = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${pos}-${end - 1}/${file.size}` }, body: file.slice(pos, end) });
    if (!last.ok && last.status !== 202) throw new Error('chunk'); pos = end; }
  return last.json();
}

    if (u) { const lb = document.createElement('div'); lb.className = 'pj-lightbox'; lb.innerHTML = `<img src="${u}" alt="">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); return; } }

  const r = await graphFetch(`/me/drive/items/${f.id}?$select=webUrl`); if (r && r.ok) { const j = await r.json(); if (win) win.location = j.webUrl; else location.href = j.webUrl; } else if (win) win.close();
}

// ---- TODAY TAB ----
function renderToday(el, activeTasks, doneTasks) {
  const inToday = activeTasks.filter(t=>t.today);
  const doneToday = doneTasks.filter(t=>t.today);
  const staged = activeTasks.filter(t=>t.tomorrow);
  const total = inToday.length + doneToday.length;

  const toggle = `<div class="seg-ctrl day-seg">
    <button class="seg-btn ${laneView==='today'?'active':''}" onclick="laneView='today';render()">Today${total?` · ${total}`:''}</button>
    <button class="seg-btn ${laneView==='tomorrow'?'active':''}" onclick="laneView='tomorrow';render()">Tomorrow${staged.length?` · ${staged.length}`:''}</button>
  </div>`;

  if (laneView === 'tomorrow') {
    el.innerHTML = toggle + renderTomorrow(staged);
    attachTomorrowEvents(el);
    return;
  }

  // All Today tasks = the focus 3 plus anything promoted from On Deck.
  const todayUnfin = inToday;    // unfinished [today]
  const todayDone  = doneToday;  // finished [today]
  const deck       = activeTasks.filter(t => t.ondeck);   // queued, not yet active
  // `total` (inToday + doneToday) is already computed at the top of renderToday.
  const unlocked   = coreComplete();
  const inOverflow = todayDone.length >= TODAY_LIMIT;     // the 3 are done; the rest is overflow
  const target = (unlocked || inOverflow) ? Math.max(todayDone.length, total) : Math.max(TODAY_LIMIT, total);
  const pct = target>0 ? Math.round((todayDone.length/target)*100) : 0;
  const dateStr = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  let html = toggle + `<div class="today-date">${dateStr}</div>
    <div class="progress-wrap">
      <div class="progress-label"><span>${todayDone.length} of ${target} done</span><strong>${pct}%</strong></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>`;

  if (total===0 && deck.length===0) {
    html += `<div class="today-empty"><span class="emoji">🎯</span>Nothing on Today yet.<br>Tap the <strong>+</strong> on backlog tasks to load it. Your first <strong>3</strong> are your Focus, and anything after that is Stretch.</div>`;
  } else {
    // ONE LIST: the first 3 you put on Today are your Focus; anything added after that is Stretch.
    const dk = localDayKey(), ordOf = t => t.tdoDay === dk ? t.tdo : null;
    const byAdded = (x, y) => { const a = ordOf(x), b = ordOf(y);
      if (a != null && b != null) return a - b; if (a != null) return -1; if (b != null) return 1;
      return ((x.todayAt ? +x.todayAt : 0) - (y.todayAt ? +y.todayAt : 0)) || (x.lineIndex - y.lineIndex); };
    const all = [...todayUnfin, ...todayDone].sort(byAdded);
    const focusSet = all.slice(0, TODAY_LIMIT), stretch = all.slice(TODAY_LIMIT);
    const fOpen = focusSet.filter(t => !t.done), fDone = focusSet.filter(t => t.done);
    const sOpen = stretch.filter(t => !t.done), sDone = stretch.filter(t => t.done);
    const slotsLeft = Math.max(0, TODAY_LIMIT - focusSet.length);
    todayGroups = { fDone, fOpen, sOpen, sDone, K: fOpen.length };
    if (focusSet.length >= TODAY_LIMIT && !fOpen.length) html += winCard(fDone.length, sOpen.length);
    // open work stays on top (Focus, then Stretch); everything finished collects in Done at the bottom
    if (fOpen.length || slotsLeft) {
      const note = slotsLeft ? `${slotsLeft} slot${slotsLeft === 1 ? '' : 's'} open` : `${fDone.length} of ${TODAY_LIMIT} done`;
      html += `<div class="lu-head"><span class="section-label">Focus</span><span class="lu-note">${note}</span></div>`;
      fOpen.forEach(t => { html += todayCard(t, false); });
      if (slotsLeft) html += `<button class="lu-add" data-core-add>＋ Add focus task</button>`;
    }
    if (sOpen.length) {
      html += `<div class="lu-then"><span>Stretch · ${sOpen.length} to go</span></div>`;
      sOpen.forEach(t => { html += todayCard(t, false, true, fOpen.length > 0); });
    }
    if (!slotsLeft) html += `<button class="lu-add" data-core-add>＋ Add a stretch task</button>`;
    if (fDone.length || sDone.length) {
      html += `<div class="lu-head"><span class="section-label">Done</span><span class="lu-note">${fDone.length} focus${sDone.length ? ` · ${sDone.length} stretch` : ''}</span></div>`;
      fDone.forEach(t => { html += todayCard(t, true); });
      sDone.forEach(t => { html += todayCard(t, true, true); });
    }
  }
  html += '<div style="height:16px"></div>';
  el.innerHTML = html;
  attachTaskEvents(el);
  tdAttachDrag(el);
}

// ---- TODAY REORDER: drag the grip to reorder; drop a Stretch task above the line to swap it into Focus ----
let todayGroups = null;
async function todayReorder(newOpen) {
  const G = todayGroups; if (!G) return;
  const all = [...G.fDone, ...newOpen, ...G.sDone], dk = localDayKey(), lines = rawMd.split('\n');
  all.forEach((t, i) => { const l = lines[t.lineIndex]; if (l == null) return;
    lines[t.lineIndex] = l.replace(/\s*\[tdo:[^\]]*\]/g, '').trimEnd() + ` [tdo:${dk}:${i}]`; });
  rawMd = lines.join('\n'); parseTasks(); render(); await saveBacklog();
}
function tdAttachDrag(root) {
  root.querySelectorAll('[data-td-up]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); const G = todayGroups; if (!G) return;
    const li = +b.dataset.tdUp, t = G.sOpen.find(x => x.lineIndex === li); if (!t) return;
    const open = [...G.fOpen, ...G.sOpen].filter(x => x !== t); open.splice(Math.max(0, G.K - 1), 0, t);
    if (navigator.vibrate) navigator.vibrate(8);
    todayReorder(open); showToast(`⇅ Swapped into Focus · "${G.fOpen[G.K - 1].title}" moved to Stretch`);
  }));
  root.querySelectorAll('[data-td-grip]').forEach(g => g.addEventListener('pointerdown', e => tdDragStart(e, g)));
}
function tdDragStart(e, grip) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const G = todayGroups, card = grip.closest('[data-td-open]'); if (!G || !card) return;
  e.preventDefault(); e.stopPropagation();
  const open = [...G.fOpen, ...G.sOpen], li = +card.dataset.tdOpen, dragged = open.find(t => t.lineIndex === li);
  const rem = [...document.querySelectorAll('#content [data-td-open]')].filter(x => x !== card);
  const divider = document.querySelector('#content .lu-then');
  const line = document.createElement('div'); line.className = 'td-drop';
  const startY = e.clientY, startScroll = window.scrollY; let lastY = e.clientY, idx = rem.indexOf(card), moved = false;
  window.__tdDrag = true; card.classList.add('td-dragging'); document.body.classList.add('td-drag-on');
  try { grip.setPointerCapture(e.pointerId); } catch (_) {}
  const place = () => {
    card.style.transform = `translateY(${lastY - startY + window.scrollY - startScroll}px)`;
    let i = 0; for (const x of rem) { const r = x.getBoundingClientRect(); if (lastY > r.top + r.height / 2) i++; }
    idx = i; const inFocus = i < G.K || !divider, focusRem = rem.filter(x => x.dataset.tdGroup === 'f');
    if (rem[i] && (!inFocus || rem[i].dataset.tdGroup === 'f')) rem[i].before(line);
    else if (inFocus && focusRem.length) focusRem[focusRem.length - 1].after(line);
    else if (inFocus && divider) divider.before(line);
    else (rem[rem.length - 1] || card).after(line);
    line.classList.toggle('to-stretch', !inFocus);
  };
  const tick = setInterval(() => { if (lastY < 90) { window.scrollBy(0, -10); place(); } else if (lastY > innerHeight - 110) { window.scrollBy(0, 10); place(); } }, 16);
  const move = ev => { lastY = ev.clientY; if (Math.abs(lastY - startY) > 4) moved = true; place(); };
  const up = () => {
    clearInterval(tick); grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
    window.__tdDrag = false; document.body.classList.remove('td-drag-on'); line.remove(); card.classList.remove('td-dragging'); card.style.transform = '';
    if (!moved) return;
    const order = rem.map(x => open.find(t => t.lineIndex === +x.dataset.tdOpen)); order.splice(idx, 0, dragged);
    if (order.every((t, i) => t === open[i])) return;
    const wasF = G.fOpen.includes(dragged), nowF = idx < G.K;
    todayReorder(order);
    if (wasF !== nowF) showToast(nowF ? '⇅ Moved into Focus' : '⇅ Moved to Stretch');
  };
  grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  place();
}

        <div class="tr-delta ${diff >= 0 ? 'up' : 'dn'}">${diff > 0 ? '▲ ' + diff + ' ahead of' : diff < 0 ? '▼ ' + -diff + ' behind' : 'Even with'} last week's pace</div></div>
        <div style="text-align:right"><div class="fx-lbl">Projected</div><div class="fx-num" style="font-size:calc(28px * var(--fxs));margin-top:6px;color:var(--accent)">${proj}</div><div class="fx-sub">vs ${lw[6]} last week</div></div></div>

// ---- FOCUS STATS HELPERS ----
// Focus days are DERIVED from backlog.md ([focus] + [done:] on each line), so completions made on any
// device always count. focus-history.json is kept only as the record for days before this fix.
const FOCUS_CUTOVER = '2026-09-26';
const FOCUS_REPAIRS = { '2026-09-25': 4 };   // restores the day lost to the old cross-device overwrite (3 core + 1 stretch, per backlog.md done stamps)
function focusDerived() {
  const m = {};
  tasks.forEach(t => { if (!t.done || !t.focus) return; const iso = t.doneAt || completions[t.title]; if (!iso) return;
    const k = dayKeyFromDate(new Date(iso)); m[k] = (m[k] || 0) + 1; });
  return m;
}
function focusDays() {
  const d = focusDerived(), out = {};
  Object.entries(focusLog).forEach(([k, v]) => { if (k < FOCUS_CUTOVER) out[k] = v; });
  Object.entries(FOCUS_REPAIRS).forEach(([k, v]) => { out[k] = Math.max(out[k] || 0, v); });
  Object.entries(d).forEach(([k, v]) => { out[k] = k < FOCUS_CUTOVER ? Math.max(out[k] || 0, v) : v; });
  return out;
}

// "All-time completed" was reset to start Aug 31, 2026 — count completions on/after that
// (older bulk-imported checkoffs are excluded).
const ALLTIME_START = new Date(2026, 7, 31).getTime();
function allTimeCompleted() {
  return Object.values(completions).filter(iso => {
    const t = Date.parse(iso);
    return !isNaN(t) && t >= ALLTIME_START;
  }).length;
}
function dayKeyFromDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysHitThisMonth() {
  const now = new Date();
  const pre = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-`;
  return Object.entries(focusDays()).filter(([k,c]) => k.startsWith(pre) && c >= FOCUS_GOAL).length;
}

  while (hit(cursor)) { current++; cursor = new Date(cursor.getTime() - dayMs); }
  // best run across all recorded hit-days

  let best = 0, run = 0, prev = null;
  keys.forEach(k => {
    if (prev && (new Date(k+'T12:00:00') - new Date(prev+'T12:00:00')) === dayMs) run++; else run = 1;
    if (run > best) best = run;

}
function heatmapMonthName(offset) {

  return ref.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="${rad}" fill="${fill}"/>`;
    if (w.count>0) bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700" fill="var(--sub)" font-family="-apple-system,sans-serif">${w.count}</text>`;
    if (i%2===0 || i===weeks.length-1) bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="7" fill="var(--sub)" font-family="-apple-system,sans-serif" font-weight="${w.isCurrent?700:400}">${w.label}</text>`;
  });

// ---- TRENDS: retimeable series (line) + year contribution grid ----
// Buckets real completions into the chosen window plus an equal prior window
// (for the vs-prior delta). Weekly buckets for 4W/12W, monthly for 6M/1Y.
function getRangeSeries(range) {
  const cfg = TRENDS_RANGES[range] || TRENDS_RANGES['12w'];
  const n = cfg.n;
  const now = new Date();
  const buckets = []; // 2n buckets, oldest first (prior window then current window)
  if (cfg.bucket === 'week') {
    const mondayOffset = (now.getDay()+6)%7;
    const ws = new Date(now.getFullYear(), now.getMonth(), now.getDate()-mondayOffset);
    for (let i=2*n-1; i>=0; i--) {
      const s = new Date(ws); s.setDate(ws.getDate()-i*7);
      const e = new Date(s); e.setDate(s.getDate()+7);
      buckets.push({ start:s, end:e, count:0, label:`${s.getMonth()+1}/${s.getDate()}` });
    }
  } else {
    for (let i=2*n-1; i>=0; i--) {
      const s = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const e = new Date(now.getFullYear(), now.getMonth()-i+1, 1);
      buckets.push({ start:s, end:e, count:0, label:s.toLocaleDateString('en-US',{month:'short'}) });
    }
  }
  Object.values(completions).forEach(iso => {
    const d = new Date(iso); if (isNaN(d)) return;
    if (d.getTime() < ALLTIME_START) return; // honor the Aug 31, 2026 reset — same as the all-time counter
    for (let i=0; i<buckets.length; i++) { if (d>=buckets[i].start && d<buckets[i].end) { buckets[i].count++; break; } }
  });

  const total = cur.reduce((a,b)=>a+b.count,0);

}

  if (prevTotal <= 0) return total>0 ? `<div class="kpi-delta up">▲ new activity</div>` : '';
  const pct = Math.round(((total-prevTotal)/prevTotal)*100);
  const cls = pct>0?'up':pct<0?'down':'flat';
  const arr = pct>0?'▲':pct<0?'▼':'▬';

}
function buildTrendLine(points) {
  const W=320, H=132, padL=8, padR=8, padT=16, padB=18;
  const cw=W-padL-padR, ch=H-padT-padB, baseY=padT+ch;
  const vals = points.map(p=>p.count);
  const mx = Math.max(1, ...vals);
  const n = vals.length;
  const step = n>1 ? cw/(n-1) : 0;
  const pts = vals.map((v,i)=>[padL+i*step, baseY-(v/mx)*ch]);
  const line = pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const areapath = `M ${pts[0][0].toFixed(1)},${baseY} ` + pts.map(p=>`L ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') + ` L ${pts[n-1][0].toFixed(1)},${baseY} Z`;
  let svg = `<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--grid-line)" stroke-width="1"/>`;
  svg += `<defs><linearGradient id="trend-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0.02"/></linearGradient></defs>`;
  svg += `<path d="${areapath}" fill="url(#trend-fill)"/>`;
  svg += `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const lblStep = Math.max(1, Math.floor(n/6));
  pts.forEach((p,i)=>{ if (i%lblStep===0 || i===n-1) svg += `<text x="${p[0].toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="7.5">${points[i].label}</text>`; });
  svg += `<circle cx="${pts[n-1][0].toFixed(1)}" cy="${pts[n-1][1].toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">${svg}</svg>`;
}
function buildTrendBars(points) {
  const W=320, H=132, padL=8, padR=8, padT=16, padB=18;
  const cw=W-padL-padR, ch=H-padT-padB, baseY=padT+ch;
  const vals = points.map(p=>p.count);
  const mx = Math.max(1, ...vals);
  const n = vals.length;
  const slot = cw/n, barW = Math.max(4, slot*0.62);
  const lblStep = Math.max(1, Math.floor(n/6));
  let bars = `<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--grid-line)" stroke-width="1"/>`;
  points.forEach((p,i)=>{
    const x = padL + i*slot + (slot-barW)/2;
    const barH = p.count>0 ? Math.max(3,(p.count/mx)*ch) : 2;
    const y = baseY - barH;
    const fill = (i===n-1) ? 'var(--chart-bar-today)' : 'var(--chart-bar)';
    const rad = Math.min(barW/2,2.5).toFixed(1);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="${rad}" fill="${fill}"/>`;
    if (p.count>0) bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700">${p.count}</text>`;
    if (i%lblStep===0 || i===n-1) bars += `<text x="${(x+barW/2).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="7.5" font-weight="${i===n-1?700:400}">${p.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">${bars}</svg>`;
}
function openTrendsRangeMenu(ev) {

let openSwipeWrap = null;

function closeOpenSwipe() {
  if (!openSwipeWrap) return;
  const card = openSwipeWrap.querySelector('.task-card');
  if (card) { card.classList.remove('swiping'); card.style.transform=''; card.style.transition=''; }
  openSwipeWrap.classList.remove('swipe-live');
  openSwipeWrap = null;
}

function attachTaskEvents(el) {
  // Check ring — toggle done
  el.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      const pt = tasks.find(t => t.lineIndex === parseInt(btn.dataset.line));
      if (pt && pt.cardId && !pt.done && currentTab === 'backlog' && pjFind(pt.cardId)[1]) { pjOpen('act', pt.cardId); return; }
      toggleDone(btn.dataset.toggle, parseInt(btn.dataset.line));
    });
  });

  // Task body — open edit modal
  el.querySelectorAll('.task-body[data-edit-line]').forEach(body => {
    body.addEventListener('click', e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      const lineIdx = parseInt(body.dataset.editLine);
      const task = tasks.find(t=>t.lineIndex===lineIdx);
      if (task && task.cardId && pjFind(task.cardId)[1]) { pjOpen('card', task.cardId); return; }
      if (task && task.parked && !task.done) { openParkActions(task); return; }
      if (task) openEditModal(task);
    });
  });

  // Today toggle button
  el.querySelectorAll('[data-today-toggle]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      const title = btn.dataset.todayToggle;
      const task = tasks.find(t => t.title === title);
      if (task && task.today) { await bailFromToday(title); }
      else { const ok = await addToToday(title); if (ok) showToast('Added to Today'); }
    });
  });

  // On-deck toggle on backlog cards — add to / remove from the queue
  el.querySelectorAll('[data-deck-toggle]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      const title = btn.dataset.deckToggle;
      const task = tasks.find(t => t.title === title);
      if (task && task.ondeck) { await removeFromDeck(title); showToast('Removed from On Deck'); }
      else { const ok = await addToDeck(title); if (ok) showToast('Queued on deck'); }
    });
  });

  // On-deck cards in the Today view — pull in now / remove from queue
  el.querySelectorAll('[data-deck-pull]').forEach(btn => {
    btn.addEventListener('click', async e => { e.stopPropagation(); await promoteFromDeck(btn.dataset.deckPull); });
  });
  el.querySelectorAll('[data-deck-remove]').forEach(btn => {
    btn.addEventListener('click', async e => { e.stopPropagation(); await removeFromDeck(btn.dataset.deckRemove); showToast('Removed from On Deck'); });
  });
  el.querySelectorAll('[data-deck-add]').forEach(b => b.addEventListener('click', openDeckPicker));

  // Tomorrow (moon) toggle on backlog cards — tap to unstage
  el.querySelectorAll('[data-tmr-toggle]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      await removeFromTomorrow(btn.dataset.tmrToggle);
      showToast('Unstaged from tomorrow');
    });
  });

  // Bonus (sparkle) toggle on backlog cards — tap to remove (no confirm, it's icing)
  el.querySelectorAll('[data-bonus-toggle]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (openSwipeWrap) { closeOpenSwipe(); return; }
      await removeFromToday(btn.dataset.bonusToggle);
      showToast('Removed from bonus');
    });
  });

  // Bonus remove (×) on Today bonus cards — no confirm
  el.querySelectorAll('[data-bonus-remove]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      await removeFromToday(btn.dataset.bonusRemove);
      showToast('Removed from bonus');
    });
  });

  // Add-bonus button (Today bonus section) → picker
  el.querySelectorAll('[data-bonus-add]').forEach(b => b.addEventListener('click', openBonusPicker));
  el.querySelectorAll('[data-core-add]').forEach(b => b.addEventListener('click', openCorePicker));

  // Today remove button
  el.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      await bailFromToday(btn.dataset.remove);
    });
  });

  // Delete action
  el.querySelectorAll('[data-delete-line]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      deleteTask(parseInt(btn.dataset.deleteLine), btn.dataset.deleteTitle);
    });
  });

  // Swipe-to-delete
  const OPEN_X = 76, THRESHOLD = 40;
  el.querySelectorAll('.swipe-wrap').forEach(wrap => {
    const card = wrap.querySelector('.task-card');
    if (!card) return;
    let startX=0, startY=0, dx=0, tracking=false, startedOpen=false, locked=false, dir=-1;
    const LOCK = 14;   // px of clearly-horizontal travel before a swipe engages (kills accidental touches)

    card.addEventListener('touchstart', e => {
      if (openSwipeWrap && openSwipeWrap!==wrap) closeOpenSwipe();
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
      startedOpen = openSwipeWrap===wrap;
      dx = startedOpen ? -OPEN_X : 0;
      tracking=true; locked=startedOpen; dir=-1;
      if (locked) { card.classList.add('swiping'); wrap.classList.add('swipe-live'); }
    }, {passive:true});

    card.addEventListener('touchmove', e => {
      if (!tracking) return;
      const mx=e.touches[0].clientX-startX, my=e.touches[0].clientY-startY;
      if (!locked) {
        if (Math.abs(my) > 10 && Math.abs(my) >= Math.abs(mx)) { tracking=false; return; }   // it's a scroll
        if (Math.abs(mx) < LOCK || Math.abs(mx) < Math.abs(my) * 1.6) return;                // not a deliberate swipe yet
        if (mx > 0 && !wrap.dataset.park) return;                                             // right swipe = park; only where allowed
        dir = mx > 0 ? 1 : -1;
        locked=true; card.classList.add('swiping'); wrap.classList.add(dir > 0 ? 'swipe-park' : 'swipe-live');
      }
      if (dir > 0) { dx = Math.max(0, Math.min(OPEN_X + 24, mx - LOCK)); card.style.transform=`translateX(${dx}px)`; wrap.classList.toggle('park-armed', dx > THRESHOLD + 10); return; }
      dx=Math.max(-OPEN_X,Math.min(0,(startedOpen?-OPEN_X:0)+mx+(startedOpen?0:LOCK)));
      card.style.transform=`translateX(${dx}px)`;
    }, {passive:true});

    card.addEventListener('touchend', () => {
      if (!tracking || !locked) { tracking=false; return; }
      tracking=false; locked=false; card.classList.remove('swiping');
      if (dir > 0) {
        const fire = dx > THRESHOLD + 10; dir = -1;
        card.style.transition='transform .2s cubic-bezier(.25,.46,.45,.94)'; card.style.transform='';
        setTimeout(()=>{ card.style.transition=''; wrap.classList.remove('swipe-park', 'park-armed'); },220);
        if (fire) { const t = tasks.find(x => x.lineIndex === parseInt(wrap.dataset.swipeLine));
          if (t) { if (navigator.vibrate) navigator.vibrate(8); if (wrap.dataset.park === 'unpark') unparkTask(t); else openParkSheet(t); } }
        return;
      }
      if (dx < -THRESHOLD) {
        card.style.transition='transform .2s cubic-bezier(.25,.46,.45,.94)';
        card.style.transform=`translateX(-${OPEN_X}px)`;
        openSwipeWrap=wrap;
      } else {
        card.style.transition='transform .2s cubic-bezier(.25,.46,.45,.94)';
        card.style.transform='';
        if (openSwipeWrap===wrap) openSwipeWrap=null;
      }
      setTimeout(()=>{ card.style.transition=''; if (openSwipeWrap!==wrap) wrap.classList.remove('swipe-live'); },220);
    }, {passive:true});
  });

  el.querySelectorAll('.swipe-wrap').forEach(wrap => wrap.querySelector('.task-card')?.addEventListener('touchcancel', () => {
    const card = wrap.querySelector('.task-card'); card.classList.remove('swiping');
    if (openSwipeWrap !== wrap) { card.style.transform=''; wrap.classList.remove('swipe-live'); }
  }, {passive:true}));
  el.addEventListener('touchstart', e=>{
    if (openSwipeWrap&&!openSwipeWrap.contains(e.target)) closeOpenSwipe();
  },{passive:true});
}

  renderBacklog(content, activeTasks, doneTasks);
}

const verKey = v => String(v || '').split(/[.\-]/).map(n => parseInt(n, 10) || 0);

async function boot() {
  initUpdates();
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loading-screen"><div class="spinner"></div></div>`;

  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const urlError = params.get('error');
  const returnedState = params.get('state');
  // Capture shortcut action before any history.replaceState calls clear the URL
  const pendingAction = params.get('action');

  if (urlError) {
    localStorage.setItem('auth_error', params.get('error_description') || urlError);
    history.replaceState({}, '', location.pathname);
    render(); return;
  }

  if (code) {
    const ok = await exchangeCode(code, returnedState);
    if (!ok) { render(); return; }
  } else {
    accessToken = localStorage.getItem('ms_token');
    if (accessToken) {
      const ok = await refreshToken();
      if (!ok) accessToken = localStorage.getItem('ms_token');
    }
  }

  if (!accessToken) {
    // Clean the action param so it doesn't linger on the sign-in screen
    if (pendingAction) history.replaceState({}, '', location.pathname);
    render(); return;
  }

  try {
    await Promise.all([loadBacklog(), loadFocusHistory(), loadProjects(), loadPrefs()]);
    await maybeRolloverToday();
    if (maybeBackfillFromDeck()) await saveBacklog();
    render();
    maybeShowWhatsNew();
    if (!syncError) await migrateTags();
    // Handle iOS Shortcut: ?action=add → open Add Task modal.
    // Guard on accessToken: a 401 during load calls signOut() which sets
    // accessToken = null before we reach here, so we must not open the modal
    // on top of the auth screen.
    if (pendingAction === 'add' && accessToken) {
      history.replaceState({}, '', location.pathname); // clean the URL first
      setTimeout(() => openAddModal(), 200); // let the render paint before modal slides up
    }
  }
  catch(e) { console.error(e); render(); }
}

async function loadProjects() {
  try {
    const res = await graphFetch(PJ_PATH);
    if (res && res.ok) {
      const txt = await res.text();
      const data = JSON.parse(txt);
      if (data && Array.isArray(data.projects)) { pj = Object.assign({ tomb: [] }, data); pjBase = txt; }
    } else if (res && res.status === 404) { pjBase = null; }
  } catch (e) { console.warn('projects load', e); }

}
function pjMerge(ours, theirs) {
  const tomb = new Set([...(ours.tomb || []), ...(theirs.tomb || [])]);
  const byId = new Map(theirs.projects.map(p => [p.id, p]));
  const out = [];
  const mergeProj = (o, t) => {
    if (!t) return o; if (!o) return t;
    const base = (o.upd || 0) >= (t.upd || 0) ? o : t;
    const tc = new Map(t.cards.map(c => [c.id, c])), cards = [];
    o.cards.forEach(c => { const x = tc.get(c.id); cards.push(x && (x.upd || 0) > (c.upd || 0) ? x : c); tc.delete(c.id); });
    tc.forEach(c => cards.push(c));
    return Object.assign({}, base, { cards: cards.filter(c => !tomb.has(c.id)) });
  };
  ours.projects.forEach(p => { out.push(mergeProj(p, byId.get(p.id))); byId.delete(p.id); });
  byId.forEach(p => out.push(p));
  return { version: 1, projects: out.filter(p => !tomb.has(p.id)), tomb: [...tomb].slice(-500) };
}

function pjGuessTag(c, p, opts) {

//   Start it → In Progress · Did my part → Waiting On · Complete → Completed
const PJ_KIND_NAME = { queue: 'To Do', active: 'In Progress', waiting: 'Waiting On', done: 'Completed' };
const PJ_KIND_RANK = { queue: 0, active: 1, waiting: 2, done: 3 };
function pjEnsureList(p, kind) {
  let l = p.lists.find(x => pjKind(x) === kind); if (l) return l;
  l = { id: pjId('l'), name: PJ_KIND_NAME[kind], kind };
  let at = p.lists.length; for (let i = p.lists.length - 1; i >= 0; i--) { if (PJ_KIND_RANK[pjKind(p.lists[i])] <= PJ_KIND_RANK[kind]) { at = i + 1; break; } at = i; }
  p.lists.splice(at, 0, l); pjTouch(p); return l;
}
function pjNormalize() {   // completed cards always live in the Completed list; reopened ones leave it
  let changed = false;
  pj.projects.forEach(p => p.cards.forEach(c => { const t = pjTask(c); if (!t) return; const k = pjKind(pjListOf(p, c));
    if (t.done && k !== 'done') { const d = pjEnsureList(p, 'done'); c.prevList = c.listId; c.listId = d.id; c.waiting = null; c.ready = false; pjTouch(c); changed = true; }
    else if (!t.done && t.today && k === 'queue') { pjMove(c, pjEnsureList(p, 'active').id); changed = true; }
    else if (!t.done && k === 'done') { const back = p.lists.find(l => l.id === c.prevList && pjKind(l) !== 'done') || pjEnsureList(p, 'queue'); c.listId = back.id; pjTouch(c); changed = true; } }));
  if (changed) pjSave();
}
const pjPauseDue = c => !!(c.paused && (!c.paused.until || c.paused.until <= pjToday()) && c.paused.until);
// ---------- stage transitions (the rules) ----------
// Enter Waiting → parked (off Today). Leave Waiting → flagged Ready. Enter an Active list → Ready cleared.
function pjTransition(p, c, fromId) {
  const from = p.lists.find(l => l.id === fromId), to = pjListOf(p, c);
  if (from && to && from !== to) pjLog(c, `Moved ${from.name} → ${to.name}`, '→');
  let r; if (from !== to) c.paused = null;
  if (pjKind(to) === 'done') { c.prevList = fromId; c.waiting = null; c.waitSince = null; c.ready = false; pjTouch(c, p); return 'done'; }
  if (pjKind(to) === 'waiting' && pjKind(from) !== 'waiting') {
    c.prevList = fromId; c.ready = false; c.waitSince = pjNow();
    if (pjStripTodayFlags(c)) saveBacklog();
    r = 'waiting';
  } else if (pjKind(from) === 'waiting' && pjKind(to) !== 'waiting') {
    if (c.waitSince) { const d = pjDaysSince(c.waitSince); pjLog(c, `Back from waiting${c.waiting && c.waiting.on ? ' on ' + c.waiting.on : ''} after ${d} day${d === 1 ? '' : 's'}`, '⚡'); }
    c.waiting = null; c.waitSince = null; c.ready = pjKind(to) !== 'active'; r = 'ready';
  } else if (pjKind(to) === 'active') c.ready = false;

}

  if (pjStripTodayFlags(c)) saveBacklog();

}

  const [p] = pjFind(c.id);

// ---------- FLIP animation (keyed, relative to keyed parent) ----------

// ---------- DRAG ENGINE (cards + lists on board, press-and-hold on touch) ----------
let pjPending = null, pjDrag = null, pjRaf = 0;
const PJ_CFG = {

    tap(item) { pjOpen('card', item.dataset.id); },
    drop() {
      const p = pjProj(), prev = new Map(p.cards.map(c => [c, c.listId])), order = []; let parked = null, back = null;
      document.querySelectorAll('.pj-board .pj-cards').forEach(ct => ct.querySelectorAll('.pj-card').forEach(el => { const c = p.cards.find(c => c.id === el.dataset.id); if (c) { c.listId = ct.dataset.list; order.push(c); } }));

  col: { item: '.pj-col', axis: 'x', tail: '.pj-new-col', handle: '.pj-col-head', delay: 200, containerAt() { return document.querySelector('.pj-board'); },
    tap(item) { pjOpen('list', item.dataset.id); },
    drop() { const p = pjProj(); const ids = [...document.querySelectorAll('.pj-board .pj-col')].map(c => c.dataset.id); p.lists = ids.map(id => p.lists.find(l => l.id === id)).filter(Boolean); pjTouch(p); pjSave(); pjFlip(render); } }
};
document.addEventListener('pointerdown', e => {
  if (e.button > 0 || pjDrag || currentTab !== 'projects') return;

  let cfg = null, item = null;
  const head = e.target.closest('.pj-col-head');

    if (item) { pjPending = { tapOnly: true, item, x: e.clientX, y: e.clientY, cx: e.clientX, cy: e.clientY, cfg }; return; } }

async function pjUpload(cardId, file) {

    if (!last.ok && last.status !== 202) throw new Error('chunk'); pos = end; }

}
